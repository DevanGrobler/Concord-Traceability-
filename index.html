  <script type="text/plain" id="manual-html"><p>The Concord Traceability app replaces paper production sheets with one web app that records every job, signs it off by PIN, sends it for approval and reports line performance from the printing machine.</p>
<h2 id="man-introduction">1. Introduction</h2>
<p><strong>What it does</strong></p>
<ul>
<li><p>Operators fill in digital production and QC sheets for each process: printing, lamination, extruders, slitting and bag making.</p></li>
<li><p>Every entry is signed off with the person's own PIN, so each record shows who created it, who closed it and who approved it.</p></li>
<li><p>Managers approve or reject sheets before they count as final.</p></li>
<li><p>Printing Live and Printing OEE read the machine counter on the printing line and report meters, speed, downtime and OEE for each shift.</p></li>
<li><p>Everything can be searched in All Records and exported to Excel.</p></li>
</ul>
<p><strong>Logging in</strong></p>
<ol type="1">
<li><p>Open the app link in a browser on a phone, tablet or PC.</p></li>
<li><p>Enter your username and password and press <strong>Sign In</strong>.</p></li>
<li><p>Only the tabs you have been given permission for appear in the menu. If a tab you need is missing, ask an admin to change your permissions (see User Management).</p></li>
<li><p>Use <strong>Change Password</strong> in the menu to set your own password.</p></li>
</ol>
<p><strong>Two kinds of sign-off</strong></p>
<ul>
<li><p><strong>Password</strong> logs you in. It identifies who is using the app.</p></li>
<li><p><strong>PIN</strong> signs off an entry. Each row of a sheet is signed with the PIN of the person who actually did the work, even when someone else is logged in. Never share your PIN.</p></li>
</ul>
<p><strong>Drafts are saved for you</strong></p>
<p>The production sheet saves a draft on the device every 30 seconds. If the browser closes or the battery dies, reopening the sheet restores the draft and shows a yellow banner with the time. Use <strong>Discard Draft</strong> to start over.</p>
<h2 id="man-roles-and-permissions">2. Roles and permissions</h2>
<p>Each user has a role, and the role sets which tabs they start with. An admin can then add or remove tabs for one person in User Management.</p>
<table>
<colgroup>
<col style="width: 33%" />
<col style="width: 33%" />
<col style="width: 33%" />
</colgroup>
<thead>
<tr class="header">
<th>Role</th>
<th>Starts with access to</th>
<th>Cannot do by default</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Operator</td>
<td>Dashboard, Printing Live, Daily Production Printing, Lamination, Extruders, Slitting, Bag Making, Rejected, All Records</td>
<td>QC sheets for viscosity and printing, Printing OEE, settings, user management</td>
</tr>
<tr class="even">
<td>QC</td>
<td>Dashboard, Viscosity QC, Printing QC and all process QC sheets, Rejected, All Records</td>
<td>Production sheets, Printing Live, settings</td>
</tr>
<tr class="odd">
<td>Manager</td>
<td>Everything an operator and QC have, plus Efficiency Report and Lists / Settings</td>
<td>User management, trash, login log</td>
</tr>
<tr class="even">
<td>Viewer</td>
<td>Dashboard, Printing Live, Rejected, All Records (read only)</td>
<td>Filling in any sheet</td>
</tr>
<tr class="odd">
<td>Admin</td>
<td>Everything, including Pending Approval, User Mgmt, Trash Bin, Login Log, Lists / Settings and Debug</td>
<td>Nothing</td>
</tr>
</tbody>
</table>
<p><strong>Extra permissions an admin can switch on per user</strong></p>
<ul>
<li><p><strong>Pending Approval</strong> and <strong>Instant Approve / Reject (no PIN)</strong>: lets a manager approve or reject sheets. The instant option skips the PIN prompt.</p></li>
<li><p><strong>Printing OEE</strong>: either <em>View only</em> (see, filter and export) or <em>View &amp; edit</em> (also select and delete shift summaries).</p></li>
<li><p><strong>All Records: Reject / Approve</strong>: lets the user send a record back for resubmission and master-approve a stuck record. Only admins can edit or delete records.</p></li>
</ul>
<p>The tab list you see is exactly what you were given. If a change was just made to your permissions, log out and back in to see it.</p>
<h2 id="man-daily-production-printing-sheet">3. Daily Production Printing sheet</h2>
<p>One sheet covers one print job. Open <strong>Daily Production Printing</strong> and work down the page.</p>
<p><strong>Step by step</strong></p>
<ol type="1">
<li><p><strong>Job details.</strong> Date and shift fill in automatically. Enter the Job Card Number, choose Customer, Product Name, Substrate, Width A/B, Length A/B, Speed, Operator and Supervisor. Job Card Number, Customer, Substrate and Operator are compulsory.</p></li>
<li><p><strong>Raw Material Input.</strong> One row per roll or batch put on the machine: material, batch number, quantity and unit.</p></li>
<li><p><strong>Raw Material Output (Printing Reels).</strong> One row per printed reel: material, batch number, quantity, unit and meters. The time fills in when the row is signed.</p></li>
<li><p><strong>Return Raw BOPP.</strong> Only when the job is finished and unused BOPP goes back to the warehouse.</p></li>
<li><p><strong>BOPP Waste.</strong> Printing waste and raw film waste in kg, each with an optional comment.</p></li>
<li><p><strong>Ink Input.</strong> Ink code, type (Fresh or Press Return), batch number, supplier, quantity and quantity returned in kg.</p></li>
<li><p><strong>Solvent Input.</strong> Solvent, supplier, batch code, quantity and quantity returned in litres.</p></li>
<li><p><strong>Remarks.</strong> Anything the next shift or the approver should know.</p></li>
<li><p><strong>Close &amp; Sign Off Sheet.</strong> Press the button, choose your name and enter your PIN. The sheet is saved and sent for approval.</p></li>
</ol>
<p><strong>Signing rows</strong></p>
<p>Every row has its own <strong>Sign off this entry</strong> button. Pick your name, enter your PIN, and the row turns green with your name and time. The person who signs the row is the person recorded, so on a handover each operator signs their own reels.</p>
<p><strong>Required values</strong></p>
<p>The sheet will not close while a started row is incomplete.</p>
<ul>
<li><p>A row counts as started once anything is typed in it or it is signed.</p></li>
<li><p>Every field of a started row must be filled in. <strong>Type 0 when the value really is zero.</strong> A blank is refused, a 0 is accepted.</p></li>
<li><p>Raw Material Input, Raw Material Output, Ink Input and Solvent Input each need at least one complete row.</p></li>
<li><p>Both BOPP Waste values must be entered on every row.</p></li>
<li><p>Rows left completely empty are ignored. Return Raw BOPP is optional.</p></li>
</ul>
<p>A yellow list above the Close button shows what is missing, for example <em>Ink Input, row 2: Batch No., Returned</em>. If you press Close anyway, the sheet is not saved and the incomplete rows turn red.</p>
<p><strong>Long jobs</strong></p>
<p>For a job that runs over several shifts or days, keep adding reels to the same sheet and have each operator sign their own rows. Printing OEE uses those signatures to show who ran each shift.</p>
<h2 id="man-other-process-and-qc-sheets">4. Other process and QC sheets</h2>
<p>The other sheets work the same way as the printing sheet: fill in the sections, sign rows with your PIN, save. The required-values check described in section 3 currently applies to the Daily Production Printing sheet only.</p>

</tr>

</tr>
<tr class="even">

<td>Run details, quality checks, overall assessment</td>
</tr>
<tr class="odd">

<td>Job details, raw materials used, roll output, remarks</td>
</tr>
<tr class="even">

<td>QC</td>
<td>Run details, quality checks, overall assessment</td>
</tr>
<tr class="odd">

<td>Operator</td>
<td>Job details, stock received, paper rolls from the supplier, roll numbers after slitting, output loaded on the pallet, slit details, remarks</td>
</tr>
<tr class="even">
<td>Slitting 1 / 2 QC</td>
<td>QC</td>
<td>Run details, quality checks, overall assessment</td>
</tr>
<tr class="odd">
<td>Bag Making 1 to 4</td>
<td>Operator</td>
<td>Job details, boxes produced with batch codes, output loaded onto the pallet, slit / waste / blade change, operator sign, bag opener name and box numbers, remarks</td>
</tr>
<tr class="even">
<td>Bag Making 1 to 4 QC</td>
<td>QC</td>
<td>Run details, quality checks, overall assessment</td>
</tr>
</tbody>
</table>
<p><strong>QC overall result</strong></p>
<p>The QC sheets end with an overall assessment of the run. A failed check should be explained in the remarks so the approver understands what happened.</p>
<p><strong>Approval</strong></p>
<p>Whether a sheet goes through Pending Approval depends on the approval settings in Lists / Settings. By default only the Daily Production Printing sheet needs approval; the others are saved straight to All Records as approved.</p>
<h2 id="man-approval-workflow">5. Approval workflow</h2>
<p>A sheet that needs approval is saved as pending, and a manager either approves it or sends it back.</p>

<p><strong>Approving</strong></p>
<ol type="1">
<li><p>Open <strong>Pending Approval</strong>. Each card shows who submitted the sheet, the date, the customer and the product.</p></li>
<li><p>Click a card to read the full sheet and its document history.</p></li>
<li><p>Sign off with your PIN under <strong>Approve</strong>. Users with <em>Instant Approve / Reject</em> see Approve and Reject buttons without a PIN prompt.</p></li>
</ol>
<p><strong>Rejecting</strong></p>
<ol type="1">
<li><p>Press <strong>Reject</strong> on the card.</p></li>
<li><p>Type the reason. A reason is required.</p></li>
<li><p>Confirm with your PIN. The sheet moves to the <strong>Rejected</strong> tab.</p></li>
</ol>
<p><strong>Resubmitting</strong></p>
<ol type="1">
<li><p>The operator opens <strong>Rejected</strong>, clicks the sheet and reads the reason.</p></li>
<li><p>Press <strong>Edit Record</strong>, correct the sheet and save.</p></li>
<li><p>Type an optional comment for the approver, for example what was fixed.</p></li>
<li><p>Press <strong>Resubmit</strong> and enter your PIN.</p></li>
</ol>
<p>When the sheet is back in Pending Approval, a yellow banner on its card shows who resubmitted it, who rejected it and why, and the operator's comment. The same details stay in the document history, which lists every submission, approval, rejection and resubmission with who and when.</p>
<p><strong>Which sheets need approval</strong></p>
<p>An admin or manager chooses this under Lists / Settings, in Approval settings. Sheet types that are switched off are saved as approved straight away and never appear in Pending Approval.</p>
<h2 id="man-printing-live">6. Printing Live</h2>
<p>Printing Live shows what the printing line is doing now, using the counter on the machine. It refreshes by itself; you do not need to reload.</p>
<table>
<colgroup>
<col style="width: 50%" />
<col style="width: 50%" />
</colgroup>
<thead>
<tr class="header">
<th>Tile</th>
<th>What it shows</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Current Speed</td>
<td>Line speed in m/min. 0 when the line is stopped</td>
</tr>
<tr class="even">
<td>Average Speed</td>
<td>Average of the running readings in the current shift. Stops are not counted</td>
</tr>
<tr class="odd">
<td>Meters This Shift</td>
<td>Meters printed since the shift started</td>
</tr>
<tr class="even">
<td>Downtime Today</td>
<td>Total stopped time inside the current scheduled shift, with the most recent stoppages listed below</td>
</tr>
</tbody>
</table>
<p><strong>How the shift is chosen</strong></p>
<p>The page follows the shift times in Lists / Settings. Meters and downtime start at the scheduled start of the shift and keep adding up even if the machine controller restarts. After the scheduled end of the shift, downtime stops counting, so finishing early on a Friday is not recorded as a breakdown.</p>
<p><strong>Good to know</strong></p>
<ul>
<li><p>The machine sends a reading every 5 minutes. A new stoppage can take up to 5 minutes to show.</p></li>
<li><p>A stop under about 5 seconds is treated as running.</p></li>
<li><p>If no readings arrive for a long time, check that the machine controller is powered and on WiFi.</p></li>
</ul>
<h2 id="man-printing-oee">7. Printing OEE</h2>
<p>Printing OEE is the permanent record of every finished shift. A row is saved automatically shortly after each scheduled shift ends, and missed shifts from the last 7 days are caught up the next time someone opens the app.</p>
<p><strong>Reading the table</strong></p>
<table>
<colgroup>
<col style="width: 50%" />
<col style="width: 50%" />
</colgroup>
<thead>
<tr class="header">
<th>Column</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Date, Shift</td>
<td>The shift is shown under the date it starts. A night shift that ends after midnight stays on the date it started</td>
</tr>
<tr class="even">
<td>Operator(s)</td>
<td>Names taken from the PIN signatures on the printing reels of the production sheets for that shift. A dash means no sheet has been closed yet</td>
</tr>
<tr class="odd">
<td>Total Meters, Avg Speed</td>
<td>Meters printed and average running speed for the shift</td>
</tr>
<tr class="even">
<td>Downtime, Stops</td>
<td>Minutes stopped and number of stoppages inside the scheduled shift</td>
</tr>
<tr class="odd">
<td>Scheduled</td>
<td>Length of the shift as scheduled on that date</td>
</tr>
<tr class="even">
<td>Available</td>
<td>The meters the shift could have produced, see below</td>
</tr>
<tr class="odd">
<td>OEE</td>
<td>Total meters divided by Available meters</td>
</tr>
</tbody>
</table>
<p><strong>How OEE is calculated</strong></p>
<p>\text{Available} = \text{Max speed} \times \text{Loading factor} \times \text{Scheduled minutes} \times (1 - \text{Downtime provision})</p>
<p>With the standard settings (200 m/min, 70%, 20%) a 12 hour shift has 80,640 m available. OEE can pass 100% when a shift runs faster than the loading factor assumes.</p>
<p><strong>Filters and exports</strong></p>
<ul>
<li><p>Filter by year, month, shift and operator. The totals at the top follow the filter.</p></li>
<li><p><strong>Export to Excel</strong> downloads the filtered rows, including the operator names and scheduled minutes.</p></li>
<li><p>Shifts that were not scheduled are flagged <em>Unscheduled</em> and left out of the OEE totals.</p></li>
</ul>
<p><strong>Past shifts keep their schedule</strong></p>
<p>When a shift is saved, its scheduled length is stored with it. Changing Shift Times later does not rewrite old rows.</p>
<p><strong>Edit access</strong></p>
<p>Users with <em>View &amp; edit</em> can select rows and delete them. A deleted row is rebuilt automatically if its raw readings are still within the last 7 days, so delete bad rows soon after the shift.</p>
<h2 id="man-all-records">8. All Records</h2>
<p>All Records lists every saved sheet. Each card shows the title, who completed it, who closed it, the customer, product and the time it was saved, with an approval badge on the right.</p>
<p><strong>Finding records</strong></p>
<ul>
<li><p>Use the type buttons (All, Printing, Viscosity QC, and so on) to narrow by sheet.</p></li>
<li><p>Type a job number or title in <strong>Search</strong>.</p></li>
<li><p>Use the year and month drop-downs to narrow by date.</p></li>
<li><p>Click a card to open it and see the full sheet and its document history.</p></li>
</ul>
<p><strong>Exporting</strong></p>
<p>Tick the cards you want (or tick none to take everything shown) and use the export button to download an Excel file. The production export has a job details block, the operator, who created, closed and approved the sheet, and every sub-table.</p>
<p><strong>Admin and permitted users</strong></p>

<h2 id="man-lists-settings">9. Lists / Settings</h2>
<p>Lists / Settings controls the choices operators see and the rules the reports use. Pick a list from the buttons along the top. Changes apply as soon as you save.</p>
<table>
<colgroup>
<col style="width: 50%" />
<col style="width: 50%" />
</colgroup>
<thead>
<tr class="header">
<th>Setting</th>
<th>What it controls</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Dropdown lists</td>
<td>Customers, operators, supervisors, substrates, widths, units, solvents, suppliers and similar choices on the sheets</td>
</tr>
<tr class="even">
<td>Customer products, product ink codes, product speeds</td>
<td>Which products belong to each customer, which inks each product uses, and the target speed per product</td>
</tr>
<tr class="odd">
<td>Shift Times</td>
<td>Day and night start and end, and which weekdays each shift works. Day and night are set independently, and each weekday can have its own times</td>
</tr>
<tr class="even">
<td>OEE parameters</td>
<td>Max speed, loading factor and downtime provision used in the OEE calculation (section 7)</td>
</tr>
<tr class="odd">
<td>Approval settings</td>
<td>Which sheet types go through Pending Approval. Production printing is on by default</td>
</tr>
<tr class="even">
<td>ISO settings</td>
<td>The document reference details shown on the exported ISO letterhead</td>
</tr>
</tbody>
</table>
<p><strong>Shift Times</strong></p>
<p>Printing OEE and Printing Live follow the schedule. If the line stops at 13:00 on a Friday, set Friday's day shift end to 13:00 and turn Friday night off. The target meters and downtime for that shift then follow the schedule. Changes apply to shifts saved from then on; saved shifts keep the schedule they had.</p>
<p>Save the Shift Times once after any change to confirm it.</p>
<h2 id="man-user-management">10. User Management</h2>
<p>Only admins see <strong>User Mgmt</strong>.</p>
<p><strong>Add a user</strong></p>
<ol type="1">
<li><p>Enter Full Name, Username and Password.</p></li>
<li><p>Choose the role: admin, manager, operator, qc or viewer.</p></li>
<li><p>Press <strong>Add User</strong>. The user gets that role's standard tabs.</p></li>
</ol>
<p><strong>Change what a user can see</strong></p>
<ol type="1">
<li><p>Press <strong>Edit Permissions</strong> next to the user.</p></li>
<li><p>Switch the sheet buttons on or off.</p></li>

<p><strong>Other actions</strong></p>

<li><p><strong>Trash Bin</strong> restores or permanently removes deleted records.</p></li>

    // ── Shift schedule ───────────────────────────────────────────────────────
    // Day and Night each have their own working days, and every working day has
    // its own start and end time (so a Friday can finish early). A shift belongs
    // to the date it STARTS on: a Friday night shift that runs 19:00 → 01:00 is
    // "Friday". Older saved settings (one shared workDays list) still work — they
    // are expanded into a schedule on the fly.
    const WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]; // index = Date.getDay()
    const WEEKDAYS_MON_FIRST=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

    function getShiftSchedule(shiftTimes){
      const st=(shiftTimes&&typeof shiftTimes==="object"&&!Array.isArray(shiftTimes))?shiftTimes:DEFAULT_SHIFT_TIMES;
      const legacy=Array.isArray(st.workDays)?st.workDays:DEFAULT_SHIFT_TIMES.workDays;
      const out={"Day Shift":{},"Night Shift":{}};
      [["Day Shift","daySchedule",st.dayStart||"07:00",st.dayEnd||"19:00"],
       ["Night Shift","nightSchedule",st.nightStart||"19:00",st.nightEnd||"07:00"]].forEach(([shift,key,ds,de])=>{
        WEEKDAYS.forEach(day=>{
          const e=st[key]&&st[key][day];
          out[shift][day]=e?{on:!!e.on,start:e.start||ds,end:e.end||de}:{on:legacy.includes(day),start:ds,end:de};
        });
      });
      return out;
    }

    // Returns {on:false} when that shift isn't worked that day (or has no length).
    function getShiftWindow(shiftTimes,dateStr,shift){
      const [y,m,d]=String(dateStr).substring(0,10).split("-").map(Number);
      if(!y||!m||!d) return {on:false,mins:0,start:null,end:null};
      const dayName=WEEKDAYS[new Date(y,m-1,d).getDay()];
      const e=getShiftSchedule(shiftTimes)[shift]?.[dayName];
      if(!e||!e.on) return {on:false,mins:0,start:null,end:null};
      const [sh,sm]=e.start.split(":").map(Number), [eh,em]=e.end.split(":").map(Number);
      let len=(eh*60+em)-(sh*60+sm);
      if(len<0) len+=1440;                       // finishes after midnight
      if(len===0) return {on:false,mins:0,start:null,end:null};
      const start=new Date(y,m-1,d,sh,sm,0,0);
      return {on:true,mins:len,start,end:new Date(start.getTime()+len*60000)};
    }

    const fmtMins=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`;

    // A PIN sign-off stores the date as a UTC date (toISOString) but the time as the
    // LOCAL time of day. Between midnight and 02:00 in South Africa those two are on
    // different calendar days, so rebuild the real moment: the local date is whichever
    // neighbouring day gives back the stored UTC date. Returns ms, or null if unreadable.
    function signedMs(signedDate,signedAt){
      const ds=String(signedDate||"").substring(0,10);
      const [y,m,d]=ds.split("-").map(Number);
      const [hh,mi,ss]=String(signedAt||"").split(":").map(Number);
      if(!y||!m||!d||isNaN(hh)||isNaN(mi)) return null;
      for(const off of [0,1,-1]){
        const dt=new Date(y,m-1,d+off,hh%24,mi,ss||0,0);
        if(dt.toISOString().substring(0,10)===ds) return dt.getTime();
      }
      return null;
    }

    // ── Customer-specific product helper ─────────────────────────────────────
    // Returns the product list for a given customer. If the customer has a
    // dedicated list in customer_products, that is returned. Otherwise falls
    // back to the generic per-sheet product list so nothing breaks.
    function getProductsForCustomer(customer, lists, sheetKey="product_name_printing"){
      if(!customer) return (lists[sheetKey]||[]).map(String).filter(Boolean);
      const cp=(lists.customer_products||[]);
      const entry=cp.find(x=>x.customer===customer);
      if(entry&&entry.products&&entry.products.length>0) return entry.products.filter(Boolean);
      return (lists[sheetKey]||[]).map(String).filter(Boolean);
    }

    // ── Product-specific ink helper ───────────────────────────────────────────
    // Returns the ink list for a given product. If the product has a dedicated
    // ink list in product_ink_codes, that is returned (as full ink objects so
    // code+description still show correctly). Otherwise falls back to the full
    // ink_code list so nothing breaks.
    // NOTE: filtering is currently INACTIVE — set FILTER_INKS_BY_PRODUCT=true
    // when you are ready to enforce product-specific ink selection.
    const FILTER_INKS_BY_PRODUCT = false;
    function getInksForProduct(product, lists){
      const allInks = lists.ink_code || [];
      if(!FILTER_INKS_BY_PRODUCT || !product) return allInks;
      const pi = (lists.product_ink_codes || []);
      const entry = pi.find(x => x.product === product);
      if(entry && entry.inks && entry.inks.length > 0){
        // Return only matching ink objects from the full list
        return allInks.filter(ink => entry.inks.includes(ink.code||ink));
      }
      return allInks;
    }

      const [session,setSession] = useState(()=>{ try{ return JSON.parse(sessionStorage.getItem("cpk_sess"))||null; }catch{ return null; } });
      const [status,setStatus]   = useState("loading");
      const [,setRenderTick]     = useState(0);
      const [lastSync,setLastSync] = useState(null);
      const [syncTick,setSyncTick] = useState(0);
      const [syncing,setSyncing]   = useState(false);
      const lastSyncRef = React.useRef(0);
      const syncRef     = React.useRef(()=>{});

      useEffect(()=>{
        const l=()=>setRenderTick(t=>t+1);
        window.addEventListener("themechange",l);
        return ()=>window.removeEventListener("themechange",l);
      },[]);

      // silent = background sync: a failed refresh keeps what is on screen instead of replacing the app with an error page
      const reload = async (silent=false) => {
        if(SUPABASE_URL==="PASTE_YOUR_SUPABASE_URL_HERE"){ setStatus("unconfigured"); return; }
        try {
          const [u,r,l,t,ll] = await Promise.all([dbUsers(),dbRecords(),dbGetLists(),dbGetTrash(),dbGetLoginLog()]);
          setUsers(u); setRecords(r); setTrashed(t); setLoginLog(ll);
          const lmap = {...DEFAULT_LISTS};
          l.forEach(row=>{ try{ lmap[row.list_name]=JSON.parse(row.items); }catch{} });
          if(!lmap.ink_code||lmap.ink_code.length===0||typeof lmap.ink_code[0]==="string"){
            lmap.ink_code=baseInks;
            dbUpsertList("ink_code",JSON.stringify(baseInks));
          } else {
            let needsUpdate=false;
            lmap.ink_code=lmap.ink_code.map(ink=>{
              let c=typeof ink==="object"?(ink.code||""):String(ink);
              let d=typeof ink==="object"?(ink.description||""):"";
              if(!d&&(c.includes(" - ")||c.includes("-"))){
                const parts=c.split(/ - |-/); c=parts[0].trim(); d=parts.slice(1).join(" - ").trim(); needsUpdate=true;
              }
              return {code:c,description:d};
            });
            if(needsUpdate) dbUpsertList("ink_code",JSON.stringify(lmap.ink_code));
          }
          setAppLists(lmap); setStatus("ok");
          lastSyncRef.current=Date.now(); setLastSync(new Date()); setSyncTick(t=>t+1);
        } catch { if(silent!==true) setStatus("error"); }
      };

      useEffect(()=>{ reload(); },[]);

      // ── Sync: the button in the menu, and automatically once an hour ──────────
      const sync = async () => { if(syncing) return; setSyncing(true); try{ await reload(true); } finally { setSyncing(false); } };
      syncRef.current = sync;
      useEffect(()=>{
        if(!session) return;
        const HOUR=3600000;
        const timer=setInterval(()=>{ if(!document.hidden) syncRef.current(); },HOUR);
        // browsers slow down timers in background tabs, so catch up when the tab comes back
        const onVis=()=>{ if(!document.hidden&&lastSyncRef.current&&Date.now()-lastSyncRef.current>HOUR) syncRef.current(); };
        document.addEventListener("visibilitychange",onVis);
        return ()=>{ clearInterval(timer); document.removeEventListener("visibilitychange",onVis); };
      },[session]);

      const login = u => { setSession(u); sessionStorage.setItem("cpk_sess",JSON.stringify(u)); dbLogLogin(u); };
      const logout = () => { setSession(null); sessionStorage.removeItem("cpk_sess"); };

      if(status==="loading")      return <Splash msg="Connecting to database…" />;
      if(status==="unconfigured") return <ConfigScreen />;
      if(status==="error")        return <Splash msg="Could not reach database. Check your credentials." />;
      if(!session)                return <Login users={users} onLogin={login} />;
      return <Main session={session} users={users} records={records} trashed={trashed}
                   loginLog={loginLog} appLists={appLists} onLogout={logout} reload={reload}
                   onSync={sync} syncing={syncing} lastSync={lastSync} syncTick={syncTick} />;
    }

    function Splash({msg}){
      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
        <div style={{fontSize:28,fontWeight:800,color:C.accent,letterSpacing:"-0.02em"}}>CONCORD</div>
        <div style={{fontSize:11,color:C.muted,letterSpacing:"0.2em"}}>PACKAGING TRACEABILITY</div>
        <div style={{fontSize:12,color:C.muted,marginTop:8}}>{msg}</div>
      </div>;
    }

    function ConfigScreen(){
      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{...S.card,maxWidth:560,padding:40}}>
          <div style={{fontSize:15,fontWeight:700,color:C.danger,marginBottom:20}}>Database not configured yet</div>
          <div style={{color:C.text,fontSize:13,lineHeight:2.2}}>
            Open <code style={{color:C.accent,background:C.bg,padding:"1px 6px",borderRadius:4}}>index.html</code> and replace the Supabase URL and anon key near the top.
          </div>
        </div>
      </div>;
    }

    // ── Login ─────────────────────────────────────────────────────────────────
    // ── NoFillInput ─ a text box browsers and password managers do not recognise as a login field ──
    // Used for the login and the PIN sign-off boxes, so a saved or remembered username/PIN is not
    // filled in for the person. Secret values are masked with CSS instead of type="password"
    // (a password-type box is what the browser offers saved logins for); where the browser cannot
    // mask that way it falls back to a normal password box that asks for "new-password".
    const MASK_OK=(()=>{ try{ return !!(window.CSS&&CSS.supports&&CSS.supports("-webkit-text-security","disc")); }catch{ return false; } })();
    function NoFillInput({secret=false,style,...rest}){
      const nm=React.useMemo(()=>"f"+Math.random().toString(36).slice(2,10),[]);
      const cssMask=secret&&MASK_OK;
      return <input {...rest} name={nm} type={secret&&!MASK_OK?"password":"text"} autoComplete={secret&&!MASK_OK?"new-password":"off"}
        autoCapitalize="none" autoCorrect="off" spellCheck={false}
        data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other"
        style={cssMask?{...style,WebkitTextSecurity:"disc"}:style} />;
    }

    function Login({users,onLogin}){
      const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState("");
      const go=()=>{
        const found=users.find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p);
        if(found){ setErr(""); onLogin(found); } else setErr("Invalid username or password.");
      };
      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{...S.card,width:360,padding:40}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{fontSize:28,fontWeight:800,color:C.accent,letterSpacing:"-0.02em"}}>CONCORD</div>
            <div style={{fontSize:11,color:C.muted,letterSpacing:"0.2em",marginTop:2}}>PACKAGING TRACEABILITY</div>
          </div>
          <label style={S.label}>Username</label>
          <NoFillInput style={{...S.input,marginBottom:14}} value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} />
          <label style={S.label}>Password</label>
          <NoFillInput secret style={{...S.input,marginBottom:20}} value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} />
          {err&&<div style={{color:C.danger,fontSize:12,marginBottom:12}}>{err}</div>}
          <button style={{...S.btn("accent"),width:"100%",padding:12,fontSize:14}} onClick={go}>Sign In</button>
        </div>
      </div>;
    }

    const ALL_TABS = [
      {id:"dashboard",     label:"Dashboard",                icon:"◈"},
      {id:"approval",      label:"Pending Approval",         icon:"⏳"},
      {id:"approval_instant", label:"Instant Approve",       icon:"⚡", hidden:true},
      {id:"rejected",      label:"Rejected",                 icon:"✕"},
      {id:"printinglive",  label:"Printing Live",            icon:"📡"},
      {id:"printingoee",   label:"Printing OEE",             icon:"📊"},
      {id:"printingoee_edit", label:"Printing OEE – Edit",     icon:"✎", hidden:true},
      {id:"records_reject", label:"All Records – Reject / Approve", icon:"↩", hidden:true},
      {id:"production",    label:"Daily Production Printing",icon:"◤"},
      {id:"viscosity",     label:"Viscosity QC",             icon:"◉"},
      {id:"printingqc",    label:"Printing QC",              icon:"✔"},

      {id:"extruder1qc",   label:"Extruder 1 QC",            icon:"✧"},
      {id:"extruder2",     label:"Extruder 2",               icon:"▣"},
      {id:"extruder2qc",   label:"Extruder 2 QC",            icon:"✧"},
      {id:"slitting1",     label:"Slitting 1",               icon:"⊟"},

      {id:"bagmaking1qc",  label:"Bag Making 1 QC",          icon:"◻"},
      {id:"bagmaking2",    label:"Bag Making 2",             icon:"◫"},
      {id:"bagmaking2qc",  label:"Bag Making 2 QC",          icon:"◻"},
      {id:"bagmaking3",    label:"Bag Making 3",             icon:"◫"},

      {id:"loginlog",      label:"Login Log",                icon:"📋"},

      {id:"password",      label:"Change Password",          icon:"🔑"},
      {id:"manual",        label:"User Manual",              icon:"📖"},
    ];

    const ROLE_DEFAULTS = {
      admin:    ["dashboard","approval","rejected","printinglive","production","viscosity","printingqc","lamination","laminationqc","extruder1","extruder1qc","extruder2","extruder2qc","slitting1","slitting1qc","slitting2","slitting2qc","bagmaking1","bagmaking1qc","bagmaking2","bagmaking2qc","bagmaking3","bagmaking3qc","bagmaking4","bagmaking4qc","efficiency","records","users","trash","loginlog","lists","debug","password"],
      manager:  ["dashboard","rejected","printinglive","production","viscosity","printingqc","lamination","laminationqc","extruder1","extruder1qc","extruder2","extruder2qc","slitting1","slitting1qc","slitting2","slitting2qc","bagmaking1","bagmaking1qc","bagmaking2","bagmaking2qc","bagmaking3","bagmaking3qc","bagmaking4","bagmaking4qc","efficiency","records","lists","password"],
      operator: ["dashboard","rejected","printinglive","production","lamination","laminationqc","extruder1","extruder2","slitting1","slitting2","bagmaking1","bagmaking2","bagmaking3","bagmaking4","records","password"],
      qc:       ["dashboard","rejected","viscosity","printingqc","lamination","laminationqc","extruder1qc","extruder2qc","slitting1qc","slitting2qc","bagmaking1qc","bagmaking2qc","bagmaking3qc","bagmaking4qc","records","password"],
      viewer:   ["dashboard","rejected","printinglive","records","password"],
    };

    function getTabs(user){
      if(!user) return [];
      if(user.role==="admin") return ALL_TABS;
      const perms=user.permissions||ROLE_DEFAULTS[user.role]||["dashboard","records"];
      return ALL_TABS.filter(t=>perms.includes(t.id)||t.id==="manual");   // the manual is open to every user
    }

    // ── Main shell ────────────────────────────────────────────────────────────
    function Main({session,users,records,trashed,loginLog,appLists,onLogout,reload,onSync,syncing,lastSync,syncTick}){
      const [tab,setTab]       = useState("dashboard");
      const [saving,setSaving] = useState(false);
      const [tabKeys,setTabKeys] = useState({});
      const getTabKey = t => tabKeys[t]||0;
      const resetTab  = t => setTabKeys(p=>({...p,[t]:(p[t]||0)+1}));
      const [toast,setToast]   = useState(null);

      const flash=(msg,type="success")=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

      const addRecord = async rec => {
        setSaving(true);
        const approvalCfg=appLists.approval_settings||{production:true};
        const needsApproval=approvalCfg[rec.type]===true;
        const now=new Date().toISOString();
        const history=needsApproval?[{action:"submitted",by:session.name,date:now.split("T")[0],time:now.split("T")[1].substring(0,8)}]:[];
        const {error} = await dbAddRec({...rec, created_by:session.name, created_at:now, approval_status:needsApproval?"pending":"approved", approval_history:history});
        if(error) flash("Save failed: "+error.message,"danger");
        else { await reload(); flash(needsApproval?"Saved — pending manager approval":"Saved to database!"); setTab("records"); }
        setSaving(false);
      };

      const delRecord = async id => {
        const rec=records.find(r=>r.id===id);
        if(rec) await dbMoveToTrash(rec,session.name);
        await dbDelRec(id); await reload(); flash("Record moved to trash.");
      };
      const restoreRecord = async rec => { await dbRestoreRec(rec); await reload(); flash("Record restored."); };
      const permDelete    = async id  => { await dbEmptyTrash(id);  await reload(); flash("Permanently deleted."); };
      const saveRecord    = async (id,data) => {
        // Rebuild the title ("Type · JobNo · Date") from the edited header so the list header follows the edit
        const rec=records.find(r=>r.id===id); const upd={data};
        if(rec&&rec.title&&data?.header){
          const parts=rec.title.split(" · ");
          if(parts.length>=3){
            const hdr=data.header; const fallbackDate=/^(production|viscosity|printingqc)$/.test(rec.type)||/qc$/.test(rec.type);
            parts[1]=hdr.jobNo||(fallbackDate?"(no job)":(hdr.date||"(no job)"));
            if(hdr.date) parts[2]=hdr.date;
            upd.title=parts.slice(0,3).join(" · ");
          }
        }
        await sb.from("records").update(upd).eq("id",id); await reload(); flash("Record updated.");
      };

      // ── Approval functions ────────────────────────────────────────────────────
      const approveRecord = async (id, approverName) => {
        const now=new Date();
        const rec=records.find(r=>r.id===id); if(!rec) return;
        const history=[...(rec.approval_history||[]),{action:"approved",by:approverName,date:now.toISOString().split("T")[0],time:now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}];
        await sb.from("records").update({
          approval_status:"approved",
          approved_by:approverName,
          approved_at:now.toISOString(),
          rejected_by:null,
          rejected_at:null,
          rejection_reason:null,
          approval_history:history
        }).eq("id",id);
        await reload();
        flash("✔ Record approved by "+approverName+"!");
      };
      const rejectRecord = async (id, approverName, reason) => {
        const now=new Date();
        const rec=records.find(r=>r.id===id); if(!rec) return;
        const history=[...(rec.approval_history||[]),{action:"rejected",by:approverName,date:now.toISOString().split("T")[0],time:now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),reason}];
        await sb.from("records").update({approval_status:"rejected",rejection_reason:reason,rejected_by:approverName,rejected_at:now.toISOString(),approval_history:history}).eq("id",id);
        await reload(); flash("Record rejected.","danger");
      };
      const resubmitRecord = async (id, operatorName, note) => {
        const now=new Date();
        const rec=records.find(r=>r.id===id); if(!rec) return;
        const prev=[...(rec.approval_history||[])];
        // keep the rejection comment in the history even for older rejections that only stored it on the record
        for(let i=prev.length-1;i>=0;i--){ if(prev[i].action==="rejected"){ if(!prev[i].reason&&rec.rejection_reason) prev[i]={...prev[i],reason:rec.rejection_reason}; break; } }
        const history=[...prev,{action:"resubmitted",by:operatorName,date:now.toISOString().split("T")[0],time:now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),note:(note||"").trim()||undefined}];
        await sb.from("records").update({approval_status:"pending",rejection_reason:null,approval_history:history}).eq("id",id);
        await reload(); flash("Record resubmitted for approval.");
      };

      const visibleTabs = getTabs(session).filter(t=>!t.hidden);
      React.useEffect(()=>{ if(!visibleTabs.find(t=>t.id===tab)) setTab("dashboard"); },[session]);

      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"row"}}>
        {toast&&<div style={{
          position:"fixed",top:16,right:16,zIndex:9999,padding:"12px 20px",borderRadius:8,
          background:toast.type==="danger"?C.danger:C.success,color:"#fff",fontSize:13,fontWeight:600,
          fontFamily:"'IBM Plex Mono',monospace",boxShadow:"0 4px 24px #0008"
        }}>{toast.msg}</div>}

        {/* ── Left Sidebar ── */}
        <div style={{width:220,minWidth:220,background:C.panel,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",minHeight:"100vh",flexShrink:0,position:"sticky",top:0,height:"100vh",overflowY:"auto"}}>
          {/* Logo */}
          <div style={{padding:"20px 16px 16px",borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
            <div style={{fontSize:20,fontWeight:800,color:C.accent,letterSpacing:"-0.02em"}}>CONCORD</div>
            <div style={{fontSize:9,color:C.muted,letterSpacing:"0.2em",marginTop:1}}>PACKAGING TRACEABILITY</div>
          </div>
          {/* Nav items */}
          <div style={{flex:1,overflowY:"auto",padding:"8px 0"}}>
            {visibleTabs.map(t=>{
              const approvalCfg=appLists?.approval_settings||{production:true};
              const pendingCount=t.id==="approval"?records.filter(r=>(r.approval_status||"pending")==="pending"&&approvalCfg[r.type]===true).length:0;
              const rejectedCount=t.id==="rejected"?records.filter(r=>r.approval_status==="rejected"&&approvalCfg[r.type]===true).length:0;
              const badge=pendingCount||rejectedCount;
              return (
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                display:"flex",alignItems:"center",justifyContent:"space-between",
                width:"100%",textAlign:"left",padding:"8px 16px",border:"none",cursor:"pointer",
                fontSize:11,fontWeight:600,fontFamily:"'IBM Plex Mono',monospace",
                background:tab===t.id?C.accent+"22":"transparent",
                color:tab===t.id?C.accent:C.muted,
                borderLeft:tab===t.id?`3px solid ${C.accent}`:"3px solid transparent",
                transition:"all 0.1s",
              }}>
                <span>{t.icon} {t.label}</span>
                {badge>0&&<span style={{fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10,background:t.id==="approval"?C.warn:C.danger,color:"#fff",minWidth:18,textAlign:"center"}}>{badge}</span>}
              </button>
              );
            })}
          </div>
          {/* Bottom user strip */}
          <div style={{padding:"12px 16px",borderTop:`1px solid ${C.border}`,flexShrink:0}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{session.name}</div>
            <div style={{fontSize:10,color:C.muted,marginBottom:6}}>Synced {lastSync?lastSync.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",hour12:false}):"—"} · auto every hour</div>
            <button style={S.btn("ghost",{padding:"5px 8px",fontSize:11,width:"100%",marginBottom:6,color:C.accent,outline:`1px solid ${C.accent}`})} disabled={syncing} onClick={onSync}>{syncing?"⟳ Syncing…":"⟳ Sync now"}</button>
            <div style={{display:"flex",gap:6}}>
              <button style={S.btn("ghost",{padding:"4px 8px",fontSize:10,flex:1})} onClick={window.toggleTheme}>◑ Theme</button>
              <button style={S.btn("ghost",{padding:"4px 8px",fontSize:10,flex:1})} onClick={onLogout}>Sign Out</button>
            </div>
          </div>
        </div>

        {/* ── Content ── */}
        <div style={{flex:1,padding:24,overflowY:"auto",minWidth:0}}>
          <div style={{display:tab==="dashboard"    ?"block":"none"}}><Dashboard records={records} session={session} /></div>
          <div style={{display:tab==="approval"    ?"block":"none"}}><PendingApproval records={records} session={session} onApprove={approveRecord} onReject={rejectRecord} onSave={saveRecord} users={users} appLists={appLists} canInstant={getTabs(session).some(t=>t.id==="approval_instant")} /></div>
          <div style={{display:tab==="rejected"    ?"block":"none"}}><RejectedRecords records={records} session={session} onResubmit={resubmitRecord} onSave={saveRecord} users={users} appLists={appLists} /></div>
          <div style={{display:tab==="printinglive"?"block":"none"}}><PrintingLive session={session} appLists={appLists} /></div>
          <div style={{display:tab==="printingoee" ?"block":"none"}}><PrintingOEE appLists={appLists} session={session} records={records} syncTick={syncTick} canEdit={getTabs(session).some(t=>t.id==="printingoee_edit")} /></div>
          <div style={{display:tab==="production"   ?"block":"none"}}><ProductionForm   key={getTabKey("production")}   onReset={()=>resetTab("production")}   onSave={addRecord} users={users} lists={appLists} /></div>
          <div style={{display:tab==="viscosity"    ?"block":"none"}}><ViscosityForm    key={getTabKey("viscosity")}    onReset={()=>resetTab("viscosity")}    onSave={addRecord} users={users} lists={appLists} /></div>
          <div style={{display:tab==="printingqc"   ?"block":"none"}}><PrintingQCForm   key={getTabKey("printingqc")}   onReset={()=>resetTab("printingqc")}   onSave={addRecord} users={users} lists={appLists} /></div>
          <div style={{display:tab==="lamination"   ?"block":"none"}}><LaminationForm   key={getTabKey("lamination")}   onReset={()=>resetTab("lamination")}   onSave={addRecord} users={users} lists={appLists} /></div>
          <div style={{display:tab==="laminationqc" ?"block":"none"}}><LaminationQCForm key={getTabKey("laminationqc")} onReset={()=>resetTab("laminationqc")} onSave={addRecord} users={users} lists={appLists} /></div>
          <div style={{display:tab==="extruder1"    ?"block":"none"}}><ExtruderForm     key={getTabKey("extruder1")}    onReset={()=>resetTab("extruder1")}    onSave={addRecord} users={users} lists={appLists} machine={1} /></div>
          <div style={{display:tab==="extruder1qc"  ?"block":"none"}}><ExtruderQCForm   key={getTabKey("extruder1qc")}  onReset={()=>resetTab("extruder1qc")}  onSave={addRecord} users={users} lists={appLists} machine={1} /></div>
          <div style={{display:tab==="extruder2"    ?"block":"none"}}><ExtruderForm     key={getTabKey("extruder2")}    onReset={()=>resetTab("extruder2")}    onSave={addRecord} users={users} lists={appLists} machine={2} /></div>
          <div style={{display:tab==="extruder2qc"  ?"block":"none"}}><ExtruderQCForm   key={getTabKey("extruder2qc")}  onReset={()=>resetTab("extruder2qc")}  onSave={addRecord} users={users} lists={appLists} machine={2} /></div>

    function useFormValidation(){
      const [errors,setErrors]=React.useState({});
      const validate=(fields)=>{
        const errs={};
        Object.entries(fields).forEach(([k,{value,label}])=>{ if(!value||!String(value).trim()) errs[k]=`${label} is required`; });
        setErrors(errs);
        return Object.keys(errs).length===0;
      };
      const clear=(k)=>setErrors(p=>{ const n={...p}; delete n[k]; return n; });
      return {errors,validate,clear,setErrors};
    }
    function ErrMsg({msg}){
      if(!msg) return null;
      return <div style={{color:C.danger,fontSize:10,marginTop:2,fontWeight:600}}>{msg}</div>;
    }

    // ── Shift auto-detect ─────────────────────────────────────────────────────
    function getShiftFromTime(){
      const h=new Date().getHours();
      // Day shift 07:00–18:59, Night shift 19:00–06:59 (crosses midnight)
      return (h>=7&&h<19)?"Day Shift":"Night Shift";
    }

    // ── PIN verification ──────────────────────────────────────────────────────
    async function verifyPin(username,pin){
      const {data}=await sb.from("users").select("id,name,pin").ilike("username",username).single();
      if(!data||!data.pin) return {ok:false,msg:"User not found or no PIN set."};
      if(String(data.pin)!==String(pin)) return {ok:false,msg:"Incorrect PIN."};
      return {ok:true,name:data.name};
    }

    // ── PinPrompt — inline per-row sign-off widget ────────────────────────────
    function PinPrompt({onConfirm,label="Sign off"}){
      const [un,setUn]=useState(""); const [pin,setPin]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
      const go=async()=>{
        if(!un.trim()||!pin.trim()){ setErr("Username and PIN required."); return; }
        setBusy(true); setErr("");
        const res=await verifyPin(un.trim(),pin.trim());
        setBusy(false);
        if(!res.ok){ setErr(res.msg); return; }
        const now=new Date();
        const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
        const dateStr=now.toISOString().split("T")[0];
        onConfirm({signedBy:res.name,signedAt:timeStr,signedDate:dateStr,signedShift:getShiftFromTime()});
        setUn(""); setPin(""); setErr("");
      };
      return <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 8px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,flexWrap:"wrap",marginTop:4}}>
        <span style={{fontSize:10,color:C.muted,fontWeight:600,flexShrink:0}}>✎ {label}</span>
        <NoFillInput style={{...S.input,width:120,padding:"4px 7px",fontSize:11}} value={un} onChange={e=>setUn(e.target.value)} placeholder="Username" onKeyDown={e=>e.key==="Enter"&&go()} />
        <NoFillInput secret inputMode="numeric" style={{...S.input,width:80,padding:"4px 7px",fontSize:11}} value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN" onKeyDown={e=>e.key==="Enter"&&go()} />
        <button style={S.btn("accent",{padding:"4px 12px",fontSize:11})} onClick={go} disabled={busy}>{busy?"…":"✔ Confirm"}</button>
        {err&&<span style={{fontSize:11,color:C.danger,fontWeight:600}}>{err}</span>}
      </div>;
    }

    // ── Signed badge ──────────────────────────────────────────────────────────
    function SignedBadge({row}){
      if(!row?.signedBy) return <div style={{fontSize:10,color:C.muted,fontStyle:"italic",padding:"2px 0"}}>— awaiting sign-off</div>;
      return <div style={{fontSize:10,color:C.success,fontWeight:600,lineHeight:1.5}}>
        ✔ {row.signedBy}
        <span style={{color:C.muted,fontWeight:400}}> · {row.signedShift}{row.signedDate?` · ${row.signedDate}`:""} · {row.signedAt}</span>

    // ── Production Form ───────────────────────────────────────────────────────
    const eP    = () => ({material:"",batchNo:"",qty:"",unit:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""});
    const ePOut = () => ({material:"",batchNo:"",qty:"",unit:"",meters:"",time:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""});
    const eI    = () => ({inkCode:"",description:"",inkType:"",batchNo:"",supplier:"",qty:"",returned:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""});
    const eSv   = () => ({solvent:"",supplier:"",batchNo:"",qty:"",returned:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""});

    const DRAFT_KEY = "cpk_production_draft";

    function ProductionForm({onSave,onReset,users=[],lists={}}){
      // ── Draft restore ──────────────────────────────────────────────────────
      const loadDraft=()=>{
        try{ const d=localStorage.getItem(DRAFT_KEY); return d?JSON.parse(d):null; }catch{ return null; }
      };
      const draft=loadDraft();

      const [hdr,setHdr]=useState(()=>draft?.hdr||{date:todayStr(),shift:getShiftFromTime(),jobNo:"",customer:"",productName:"",substrate:"",widthA:"",widthB:"",lengthA:"",lengthB:"",speed:"",operator:"",supervisor:""});
      const [rawIn,setRawIn]=useState(()=>draft?.rawIn||[eP()]);
      const [rawOut,setRawOut]=useState(()=>draft?.rawOut||[ePOut()]);
      const [returnBopp,setReturnBopp]=useState(()=>draft?.returnBopp||[{material:"",batchNo:"",qty:"",unit:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""}]);
      const [inks,setInks]=useState(()=>draft?.inks||[eI()]);
      const [solvents,setSolv]=useState(()=>draft?.solvents||[eSv()]);
      const [boppWaste,setBoppWaste]=useState(()=>draft?.boppWaste||[{printingBopp:"",printingComment:"",rawBopp:"",rawComment:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""}]);
      const [remarks,setRemarks]=useState(()=>draft?.remarks||"");
      const [saved,setSaved]=useState(false);
      const [attempted,setAttempted]=useState(false);
      const [draftRestored,setDraftRestored]=useState(!!draft);
      const [draftTime,setDraftTime]=useState(draft?.savedAt||"");
      const [lastSaved,setLastSaved]=useState("");

      // ── Auto-save draft every 30 seconds ──────────────────────────────────
      React.useEffect(()=>{
        const interval=setInterval(()=>{
          if(saved) return;
          const now=new Date().toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
          try{
            localStorage.setItem(DRAFT_KEY,JSON.stringify({hdr,rawIn,rawOut,returnBopp,inks,solvents,boppWaste,remarks,savedAt:now}));
            setLastSaved(now);
          }catch(e){}
        },30000);
        return ()=>clearInterval(interval);
      },[hdr,rawIn,rawOut,returnBopp,inks,solvents,boppWaste,remarks,saved]);

      const clearDraft=()=>{ try{ localStorage.removeItem(DRAFT_KEY); }catch{} };
      const discardDraft=()=>{ clearDraft(); onReset(); };

      const opNames=(lists.operator||[]).length>0?(lists.operator||[]).map(String).filter(Boolean):users.filter(u=>u.role==="operator").map(u=>u.name);
      const {errors:fErr,validate,clear:clrErr}=useFormValidation();
      const h=(k,v)=>{ clrErr(k); setHdr(p=>({...p,[k]:v})); };
      const as=(fn,i,k,v)=>fn(a=>a.map((r,x)=>x===i?{...r,[k]:v}:r));
      const asSign=(fn,i,sig)=>fn(a=>a.map((r,x)=>x===i?{...r,...sig}:r));
      const ad=(fn,i)=>fn(a=>a.filter((_,x)=>x!==i));
      // ── Completeness check ──────────────────────────────────────────────────
      // A row that has been started (anything typed, or signed off) must have every
      // value filled in before the sheet can be closed. A typed 0 counts as filled;
      // only a blank is refused. Rows left completely empty are ignored.
      const has=v=>String(v===null||v===undefined?"":v).trim()!=="";
      const SEC_REQ=[
        {sec:"rawIn",needOne:true,   title:"Raw Material Input",  rows:rawIn,      f:[["material","Material"],["batchNo","Batch No."],["qty","Qty"],["unit","Unit"]]},
        {sec:"rawOut",needOne:true,  title:"Raw Material Output", rows:rawOut,     f:[["material","Material"],["batchNo","Batch No."],["qty","Qty"],["unit","Unit"],["meters","Meters"]]},
        {sec:"retBopp", title:"Return Raw BOPP",     rows:returnBopp, f:[["material","Material"],["batchNo","Batch No."],["qty","Qty"],["unit","Unit"]]},
        {sec:"inks",needOne:true,    title:"Ink Input",           rows:inks,       f:[["inkCode","Ink Code"],["inkType","Type"],["batchNo","Batch No."],["supplier","Supplier"],["qty","Qty"],["returned","Returned"]]},
        {sec:"solvents",needOne:true,title:"Solvent Input",       rows:solvents,   f:[["solvent","Solvent"],["supplier","Supplier"],["batchNo","Batch Code"],["qty","Qty"],["returned","Returned"]]},
        {sec:"waste",  all:true,title:"BOPP Waste",          rows:boppWaste,  f:[["printingBopp","Printing BOPP waste (kg)"],["rawBopp","Raw BOPP film waste (kg)"]]},
      ];
      const incomplete=[];
      SEC_REQ.forEach(({sec,title,rows,f,all,needOne})=>{
        let anyStarted=false;
        rows.forEach((r,i)=>{
          const started=all||f.some(([k])=>has(r[k]))||has(r.signedBy);
          if(!started) return;
          anyStarted=true;
          const missing=f.filter(([k])=>!has(r[k])).map(([,l])=>l);
          if(missing.length) incomplete.push({sec,i,title,missing});
        });
        // Inputs and outputs: at least one completed row is required
        if(needOne&&!anyStarted) incomplete.push({sec,i:-1,title,missing:["at least one completed row is required"]});
      });
      const bad=(sec,i)=>attempted&&incomplete.some(x=>x.sec===sec&&x.i===i);
      if(saved) return <Done label="Production Sheet" reset={()=>{ clearDraft(); onReset(); }} />;
      const save=async(closeSig)=>{
        setAttempted(true);
        if(incomplete.length){
          setTimeout(()=>{ const el=document.getElementById("prod-missing"); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"}); },50);
          return;
        }
        if(!validate({shift:{value:hdr.shift,label:"Shift"},jobNo:{value:hdr.jobNo,label:"Job Card Number"},customer:{value:hdr.customer,label:"Customer"},substrate:{value:hdr.substrate,label:"Substrate"},operator:{value:hdr.operator,label:"Operator"}})) return;
        const now=new Date();
        const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
        const finalRawOut=rawOut.map((row,xi)=>xi===rawOut.length-1&&!row.time?{...row,time:timeStr}:row);
        const normBopp=boppWaste.map(r=>({...r,printingBopp:r.printingBopp===""?"0":r.printingBopp,rawBopp:r.rawBopp===""?"0":r.rawBopp}));
        await onSave({type:"production",title:`Production · ${hdr.jobNo||"(no job)"} · ${hdr.date}`,data:{header:hdr,rawIn,rawOut:finalRawOut,returnBopp,boppWaste:normBopp,inks,solvents,remarks,
          closedBy:closeSig.signedBy,closedAt:closeSig.signedAt,closedDate:closeSig.signedDate,closedShift:closeSig.signedShift}});
        clearDraft();
        setSaved(true);
      };
      return <div>
        <PH title="Daily Production Sheet Printing" sub="Record job details, materials, inks and solvents" />

        {/* ── Draft restored banner ── */}
        {draftRestored&&(
          <div style={{background:C.warn+"22",border:`1px solid ${C.warn}`,borderRadius:8,padding:"12px 18px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <span style={{fontSize:13,color:C.warn,fontWeight:700}}>⚠ Draft restored from {draftTime}</span>
            <span style={{fontSize:12,color:C.muted}}>Your previous session was recovered. Continue where you left off.</span>
            <button style={{...S.btn("ghost",{padding:"5px 14px",fontSize:12}),color:C.danger,outline:`1px solid ${C.danger}`,marginLeft:"auto"}} onClick={discardDraft}>Discard Draft</button>
          </div>
        )}

        {/* ── Auto-save indicator ── */}
        {lastSaved&&!draftRestored&&(
          <div style={{fontSize:10,color:C.success,textAlign:"right",marginBottom:8}}>✔ Draft auto-saved at {lastSaved}</div>
        )}
        {Object.keys(fErr).length>0&&<div style={{background:C.danger+"22",border:`1px solid ${C.danger}`,borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:C.danger,fontWeight:600}}>⚠ Please complete all required fields before saving.</div>}
        <SC title="Job Details">
          <Grid cols={4}>
            <F label="Date"><TI type="date" value={hdr.date} onChange={v=>h("date",v)} /></F>
            <F label="Shift">
              <div style={{...S.input,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"default"}}>
                <span>{hdr.shift}</span>
                <span style={{fontSize:10,color:C.success}}>⏱ auto</span>
              </div>
            </F>
            <F label="Job Card Number"><TI value={hdr.jobNo} onChange={v=>h("jobNo",v)} placeholder="CPK-0001" /><ErrMsg msg={fErr.jobNo} /></F>
            <F label="Customer"><TS value={hdr.customer} onChange={v=>{ h("customer",v); setHdr(p=>({...p,customer:v,productName:""})); }} options={(lists.customer||[]).map(String).filter(Boolean)} /><ErrMsg msg={fErr.customer} /></F>
            <F label="Product Name"><TS value={hdr.productName} onChange={v=>h("productName",v)} options={getProductsForCustomer(hdr.customer,lists,"product_name_printing")} /></F>
            <F label="Substrate"><TS value={hdr.substrate} onChange={v=>h("substrate",v)} options={(lists.substrate||["BOPP","BOPP MAT","PET","PET MAT"]).map(String).filter(Boolean)} /><ErrMsg msg={fErr.substrate} /></F>
            <F label="Width (mm)" col={2}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div>
                  <div style={{fontSize:10,color:C.accent,fontWeight:700,marginBottom:4}}>A</div>
                  <TS value={hdr.widthA} onChange={v=>h("widthA",v)} options={(lists.width||[]).map(String).filter(Boolean)} />
                </div>
                <div>
                  <div style={{fontSize:10,color:C.blue,fontWeight:700,marginBottom:4}}>B</div>
                  <TS value={hdr.widthB} onChange={v=>h("widthB",v)} options={(lists.width||[]).map(String).filter(Boolean)} />
                </div>
              </div>
            </F>
            <F label="Length (m)" col={2}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div>
                  <div style={{fontSize:10,color:C.accent,fontWeight:700,marginBottom:4}}>A</div>
                  <TI type="number" value={hdr.lengthA} onChange={v=>h("lengthA",v)} placeholder="0" />
                </div>
                <div>
                  <div style={{fontSize:10,color:C.blue,fontWeight:700,marginBottom:4}}>B</div>
                  <TI type="number" value={hdr.lengthB} onChange={v=>h("lengthB",v)} placeholder="0" />
                </div>
              </div>
            </F>
            <F label="Speed (m/min)"><TI type="number" value={hdr.speed} onChange={v=>h("speed",v)} /></F>
            <F label="Operator"><TS value={hdr.operator} onChange={v=>h("operator",v)} options={opNames} /><ErrMsg msg={fErr.operator} /></F>
            <F label="Supervisor"><TS value={hdr.supervisor} onChange={v=>h("supervisor",v)} options={(lists.supervisor||[]).map(String).filter(Boolean)} /></F>
          </Grid>
        </SC>
        <SC title="Raw Material Input">
          <THead cols={["Material","Batch No.","Qty","Unit",""]} widths={["2fr","1.5fr","1fr","1fr","40px"]} />
          {rawIn.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${bad("rawIn",i)?C.danger:r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TI value={r.material} onChange={v=>as(setRawIn,i,"material",v)} placeholder="Material" />
                <TI value={r.batchNo}  onChange={v=>as(setRawIn,i,"batchNo",v)} />
                <TI type="number" value={r.qty}  onChange={v=>as(setRawIn,i,"qty",v)} />
                <TS value={r.unit} onChange={v=>as(setRawIn,i,"unit",v)} options={(lists.unit||["kg","g","L","mL","m","mm","rolls","sheets"]).map(String).filter(Boolean)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setRawIn,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>asSign(setRawIn,i,sig)} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setRawIn(a=>[...a,eP()])}>+ Add Row</button>
        </SC>
        <SC title="Raw Material Output (Printing Reels)">
          <THead cols={["Material","Batch No.","Qty","Unit","Meters","Time",""]} widths={["2fr","1.5fr","1fr","1fr","1fr","70px","40px"]} />
          {rawOut.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${bad("rawOut",i)?C.danger:r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 1fr 70px 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TI value={r.material} onChange={v=>as(setRawOut,i,"material",v)} placeholder="Material" />
                <TI value={r.batchNo}  onChange={v=>as(setRawOut,i,"batchNo",v)} />
                <TI type="number" value={r.qty}    onChange={v=>as(setRawOut,i,"qty",v)} />
                <TS value={r.unit} onChange={v=>as(setRawOut,i,"unit",v)} options={(lists.unit||["kg","g","L","mL","m","mm","rolls","sheets"]).map(String).filter(Boolean)} />
                <TI type="number" value={r.meters||""} onChange={v=>as(setRawOut,i,"meters",v)} placeholder="0" />
                <div style={{fontSize:11,color:r.time?C.success:C.muted,fontWeight:r.time?600:400,padding:"6px 4px",textAlign:"center"}}>{r.time||"—"}</div>
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setRawOut,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>{
                const now=new Date();
                const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
                const dateStr=now.toISOString().split("T")[0];
                setRawOut(a=>a.map((x,xi)=>xi===i?{...x,...sig,time:x.time||timeStr,signedDate:dateStr}:x));
              }} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>{
            const now=new Date();
            const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
            setRawOut(a=>{
              const updated=a.map((row,xi)=>xi===a.length-1&&!row.time?{...row,time:timeStr}:row);
              return [...updated,ePOut()];
            });
          }}>+ Add Row</button>
        </SC>
        <SC title="Return Raw BOPP (When Job is Complete)">
          <div style={{fontSize:11,color:C.muted,marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>
            Complete this section when the job is finished and raw BOPP is being returned to the warehouse.
          </div>
          <THead cols={["Material","Batch No.","Qty","Unit",""]} widths={["2fr","1.5fr","1fr","1fr","40px"]} />
          {returnBopp.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${bad("retBopp",i)?C.danger:r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TI value={r.material} onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,material:v}:x))} placeholder="Material" />
                <TI value={r.batchNo}  onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,batchNo:v}:x))} />
                <TI type="number" value={r.qty}  onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,qty:v}:x))} />
                <TS value={r.unit} onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,unit:v}:x))} options={(lists.unit||["kg","g","L","mL","m","mm","rolls","sheets"]).map(String).filter(Boolean)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>setReturnBopp(a=>a.filter((_,xi)=>xi!==i))}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off return" onConfirm={sig=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,...sig}:x))} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setReturnBopp(a=>[...a,{material:"",batchNo:"",qty:"",unit:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""}])}>+ Add Row</button>
        </SC>
        <SC title="BOPP Waste">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.06em"}}>PRINTING BOPP WASTE (KG)</div>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.06em"}}>RAW BOPP FILM WASTE (KG)</div>
          </div>
          {boppWaste.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${bad("waste",i)?C.danger:r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:6}}>
                  <TI type="number" value={r.printingBopp} onChange={v=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,printingBopp:v}:x))} placeholder="0" />
                  <input style={{...S.input,fontSize:12}} value={r.printingComment||""} onChange={e=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,printingComment:e.target.value}:x))} placeholder="Comment…" />
                </div>
                <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:6}}>
                  <TI type="number" value={r.rawBopp} onChange={v=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,rawBopp:v}:x))} placeholder="0" />
                  <input style={{...S.input,fontSize:12}} value={r.rawComment||""} onChange={e=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,rawComment:e.target.value}:x))} placeholder="Comment…" />
                </div>
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>setBoppWaste(a=>a.filter((_,xi)=>xi!==i))}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,...sig}:x))} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:2,fontSize:11})} onClick={()=>setBoppWaste(a=>[...a,{printingBopp:"",printingComment:"",rawBopp:"",rawComment:"",signedBy:"",signedAt:"",signedDate:"",signedShift:""}])}>+ Add Row</button>
        </SC>
        <SC title="Ink Input">
          <THead cols={["Ink Code","Type","Batch No.","Supplier","Qty (kg)","Returned (kg)",""]} widths={["2.5fr","1fr","1.2fr","1.5fr","1fr","1fr","40px"]} />
          {inks.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${bad("inks",i)?C.danger:r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2.5fr 1fr 1.2fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <select style={S.input} value={r.inkCode} onChange={e=>{
                  const code=e.target.value;
                  setInks(prev=>prev.map((row,x)=>x===i?{...row,inkCode:code,description:((lists.ink_code||[]).find(ink=>ink.code===code)||{}).description||""}:row));
                }}>
                  <option value="">— Select —</option>
                  {getInksForProduct(hdr.productName,lists).map(x=>{
                    const code=x.code||x; const desc=(x.description||"").trim();
                    return <option key={code} value={code}>{desc?`${code} — ${desc}`:code}</option>;
                  })}
                </select>
                <select style={S.input} value={r.inkType||""} onChange={e=>as(setInks,i,"inkType",e.target.value)}>
                  <option value="">— Type —</option>
                  <option value="Fresh">Fresh</option>
                  <option value="Press Return">Press Return</option>
                </select>
                <TI value={r.batchNo||""} onChange={v=>as(setInks,i,"batchNo",v)} placeholder="Batch No." />
                <TS value={r.supplier} onChange={v=>as(setInks,i,"supplier",v)} options={(lists.ink_supplier||[]).map(String).filter(Boolean)} />
                <TI type="number" value={r.qty}      onChange={v=>as(setInks,i,"qty",v)} />
                <TI type="number" value={r.returned} onChange={v=>as(setInks,i,"returned",v)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setInks,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>asSign(setInks,i,sig)} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setInks(a=>[...a,eI()])}>+ Add Row</button>
        </SC>
        <SC title="Solvent Input">
          <THead cols={["Solvent","Supplier","Batch Code","Qty (L)","Returned (L)",""]} widths={["1.5fr","1.5fr","1.5fr","1fr","1fr","40px"]} />
          {solvents.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${bad("solvents",i)?C.danger:r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"1.5fr 1.5fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TS value={r.solvent}  onChange={v=>as(setSolv,i,"solvent",v)}   options={(lists.solvent||[]).map(String).filter(Boolean)} />
                <TS value={r.supplier} onChange={v=>as(setSolv,i,"supplier",v)}  options={(lists.solvent_supplier||[]).map(String).filter(Boolean)} />
                <TI value={r.batchNo}  onChange={v=>as(setSolv,i,"batchNo",v)}   placeholder="Batch Code" />
                <TI type="number" value={r.qty}      onChange={v=>as(setSolv,i,"qty",v)} />
                <TI type="number" value={r.returned} onChange={v=>as(setSolv,i,"returned",v)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setSolv,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>asSign(setSolv,i,sig)} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setSolv(a=>[...a,eSv()])}>+ Add Row</button>
        </SC>
        <SC title="Remarks"><textarea style={{...S.input,minHeight:80,resize:"vertical"}} value={remarks} onChange={e=>setRemarks(e.target.value)} /></SC>
        {incomplete.length>0&&<div id="prod-missing" style={{marginBottom:14,padding:"12px 16px",background:(attempted?C.danger:C.warn)+"15",border:`1px solid ${attempted?C.danger:C.warn}`,borderRadius:8}}>
          <div style={{fontSize:13,fontWeight:700,color:attempted?C.danger:C.warn,marginBottom:6}}>{attempted?"✕ Sheet not saved — ":"⚠ "}complete these values before closing the sheet (enter 0 if the value is zero):</div>
          {incomplete.map((x,k)=><div key={k} style={{fontSize:12,color:C.text,padding:"2px 0"}}>• <b>{x.title}</b>{x.i>=0?`, row ${x.i+1}`:""}: <span style={{color:C.danger}}>{x.missing.join(", ")}</span></div>)}
        </div>}
        <SC title="Close & Sign Off Sheet">
          <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Sign off here to close and save this production sheet. This name is recorded separately from whoever is logged in, so the record shows exactly who closed it out.</div>
          <PinPrompt label="Close & Save Sheet" onConfirm={sig=>save(sig)} />
        </SC>
      </div>;
    }

    // ── Viscosity Form ────────────────────────────────────────────────────────
    const emptyViscRow=(slots)=>({ink:"",type:"",target:"",unit:"sec",times:Object.fromEntries((slots||DAY_SLOTS).map(t=>[t,""]))});

    function ViscosityForm({onSave,onReset,users=[],lists={}}){
      const [hdr,setHdr]=useState({date:todayStr(),shift:"",jobNo:"",productName:"",press:"8 Color Gravure",operator:""});
      const [readings,setReadings]=useState([emptyViscRow(DAY_SLOTS),emptyViscRow(DAY_SLOTS),emptyViscRow(DAY_SLOTS),emptyViscRow(DAY_SLOTS)]);
      const [remarks,setRemarks]=useState(""); const [saved,setSaved]=useState(false);
      const slots=getSlotsForShift(hdr.shift);
      const opNames=(lists.operator||[]).length>0?(lists.operator||[]).map(String).filter(Boolean):users.filter(u=>u.role==="operator").map(u=>u.name);
      const {errors:fErr,validate,clear:clrErr}=useFormValidation();
      const h=(k,v)=>{
        clrErr(k);
        if(k==="shift"){ const ns=getSlotsForShift(v); setReadings(rs=>rs.map(r=>({...r,times:Object.fromEntries(ns.map(t=>[t,""]))})));  }
        setHdr(p=>({...p,[k]:v}));
      };
      const st=(i,slot,val)=>setReadings(rs=>rs.map((r,x)=>x===i?{...r,times:{...r.times,[slot]:val}}:r));
      const sf=(i,k,val)=>setReadings(rs=>rs.map((r,x)=>x===i?{...r,[k]:val}:r));
      if(saved) return <Done label="Viscosity QC" reset={onReset} />;
      const save=async()=>{
        if(!validate({shift:{value:hdr.shift,label:"Shift"},jobNo:{value:hdr.jobNo,label:"Job Card Number"},operator:{value:hdr.operator,label:"Operator"}})) return;
        await onSave({type:"viscosity",title:`Viscosity QC · ${hdr.jobNo||"(no job)"} · ${hdr.date}`,data:{header:hdr,readings,remarks}}); setSaved(true);
      };
      return <div>
        <PH title="Viscosity QC Form" sub="Add your ink rows below — type in ink name and type freely" />
        {Object.keys(fErr).length>0&&<div style={{background:C.danger+"22",border:`1px solid ${C.danger}`,borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:C.danger,fontWeight:600}}>⚠ Please complete all required fields before saving.</div>}
        <SC title="Run Details">
          <Grid cols={5}>
            <F label="Date"><TI type="date" value={hdr.date} onChange={v=>h("date",v)} /></F>
            <F label="Shift"><TS value={hdr.shift} onChange={v=>h("shift",v)} options={["Day Shift","Night Shift"]} /><ErrMsg msg={fErr.shift} /></F>
            <F label="Job Card Number"><TI value={hdr.jobNo} onChange={v=>h("jobNo",v)} /><ErrMsg msg={fErr.jobNo} /></F>
            <F label="Product Name"><TS value={hdr.productName} onChange={v=>h("productName",v)} options={getProductsForCustomer("",lists,"product_name_printing")} /></F>
            <F label="Operator"><TS value={hdr.operator} onChange={v=>h("operator",v)} options={opNames} /><ErrMsg msg={fErr.operator} /></F>
          </Grid>
        </SC>
        <SC title="Viscosity Readings">
          <div style={{overflowX:"auto"}}>
            <table style={{borderCollapse:"collapse",fontSize:11,width:"100%"}}>
              <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
                <th style={TH}>Ink Name</th><th style={TH}>Ink Type</th><th style={TH}>Target</th><th style={TH}>Unit</th>
                {slots.map(t=><th key={t} style={TH}>{t}</th>)}
                <th style={TH}></th>
              </tr></thead>
              <tbody>{readings.map((r,i)=>(
                <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                  <td style={TD}><input style={{...S.input,width:90,padding:"4px 6px"}} value={r.ink}    placeholder="e.g. Cyan"   onChange={e=>sf(i,"ink",e.target.value)} /></td>
                  <td style={TD}><input style={{...S.input,width:90,padding:"4px 6px"}} value={r.type}   placeholder="e.g. Solvent" onChange={e=>sf(i,"type",e.target.value)} /></td>
                  <td style={TD}><input style={{...S.input,width:60,padding:"4px 6px"}} value={r.target} placeholder="0"            onChange={e=>sf(i,"target",e.target.value)} /></td>
                  <td style={TD}><input style={{...S.input,width:60,padding:"4px 6px"}} value={r.unit}                             onChange={e=>sf(i,"unit",e.target.value)} /></td>
                  {slots.map(t=><td key={t} style={TD}><input style={{...S.input,width:50,padding:"4px",textAlign:"center"}} value={r.times[t]||""} placeholder="–" onChange={e=>st(i,t,e.target.value)} /></td>)}
                  <td style={TD}><button style={S.btn("danger",{padding:"4px 8px",fontSize:11})} onClick={()=>setReadings(rs=>rs.filter((_,x)=>x!==i))}>✕</button></td>
                </tr>
              ))}</tbody>
            </table>
