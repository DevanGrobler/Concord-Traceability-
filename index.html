    // ── Customer-specific product helper ─────────────────────────────────────
    // Returns the product list for a given customer. If the customer has a
    // dedicated list in customer_products, that is returned. Otherwise falls
    // back to the generic per-sheet product list so nothing breaks.
    function getProductsForCustomer(customer, lists, sheetKey="product_name_printing"){
      if(!customer) return (lists[sheetKey]||[]).map(String).filter(Boolean);
      const cp=(lists.customer_products||[]);
      const entry=cp.find(x=>x.customer===customer);
      if(entry&&entry.products&&entry.products.length>0) return entry.products.filter(Boolean);
      return (lists[sheetKey]||[]).map(String).filter(Boolean);
    }

    // ── Product-specific ink helper ───────────────────────────────────────────
    // Returns the ink list for a given product. If the product has a dedicated
    // ink list in product_ink_codes, that is returned (as full ink objects so
    // code+description still show correctly). Otherwise falls back to the full
    // ink_code list so nothing breaks.
    // NOTE: filtering is currently INACTIVE — set FILTER_INKS_BY_PRODUCT=true
    // when you are ready to enforce product-specific ink selection.
    const FILTER_INKS_BY_PRODUCT = false;
    function getInksForProduct(product, lists){
      const allInks = lists.ink_code || [];
      if(!FILTER_INKS_BY_PRODUCT || !product) return allInks;
      const pi = (lists.product_ink_codes || []);
      const entry = pi.find(x => x.product === product);
      if(entry && entry.inks && entry.inks.length > 0){
        // Return only matching ink objects from the full list
        return allInks.filter(ink => entry.inks.includes(ink.code||ink));
      }
      return allInks;
    }

    // ── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [users,setUsers]     = useState([]);
      const [records,setRecords] = useState([]);
      const [trashed,setTrashed] = useState([]);
      const [loginLog,setLoginLog] = useState([]);
      const [appLists,setAppLists] = useState(DEFAULT_LISTS);
      const [session,setSession] = useState(()=>{ try{ return JSON.parse(sessionStorage.getItem("cpk_sess"))||null; }catch{ return null; } });
      const [status,setStatus]   = useState("loading");
      const [,setRenderTick]     = useState(0);

      useEffect(()=>{
        const l=()=>setRenderTick(t=>t+1);
        window.addEventListener("themechange",l);
        return ()=>window.removeEventListener("themechange",l);
      },[]);

      const reload = async () => {
        if(SUPABASE_URL==="PASTE_YOUR_SUPABASE_URL_HERE"){ setStatus("unconfigured"); return; }
        try {
          const [u,r,l,t,ll] = await Promise.all([dbUsers(),dbRecords(),dbGetLists(),dbGetTrash(),dbGetLoginLog()]);
          setUsers(u); setRecords(r); setTrashed(t); setLoginLog(ll);
          const lmap = {...DEFAULT_LISTS};
          l.forEach(row=>{ try{ lmap[row.list_name]=JSON.parse(row.items); }catch{} });
          if(!lmap.ink_code||lmap.ink_code.length===0||typeof lmap.ink_code[0]==="string"){
            lmap.ink_code=baseInks;
            dbUpsertList("ink_code",JSON.stringify(baseInks));
          } else {
            let needsUpdate=false;
            lmap.ink_code=lmap.ink_code.map(ink=>{
              let c=typeof ink==="object"?(ink.code||""):String(ink);
              let d=typeof ink==="object"?(ink.description||""):"";
              if(!d&&(c.includes(" - ")||c.includes("-"))){
                const parts=c.split(/ - |-/); c=parts[0].trim(); d=parts.slice(1).join(" - ").trim(); needsUpdate=true;
              }
              return {code:c,description:d};
            });
            if(needsUpdate) dbUpsertList("ink_code",JSON.stringify(lmap.ink_code));
          }
          setAppLists(lmap); setStatus("ok");
        } catch { setStatus("error"); }
      };

      useEffect(()=>{ reload(); },[]);

      const login = u => { setSession(u); sessionStorage.setItem("cpk_sess",JSON.stringify(u)); dbLogLogin(u); };
      const logout = () => { setSession(null); sessionStorage.removeItem("cpk_sess"); };

      if(status==="loading")      return <Splash msg="Connecting to database…" />;
      if(status==="unconfigured") return <ConfigScreen />;
      if(status==="error")        return <Splash msg="Could not reach database. Check your credentials." />;
      if(!session)                return <Login users={users} onLogin={login} />;
      return <Main session={session} users={users} records={records} trashed={trashed}
                   loginLog={loginLog} appLists={appLists} onLogout={logout} reload={reload} />;
    }

    function Splash({msg}){
      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
        <div style={{fontSize:28,fontWeight:800,color:C.accent,letterSpacing:"-0.02em"}}>CONCORD</div>
        <div style={{fontSize:11,color:C.muted,letterSpacing:"0.2em"}}>PACKAGING TRACEABILITY</div>
        <div style={{fontSize:12,color:C.muted,marginTop:8}}>{msg}</div>
      </div>;
    }

    function ConfigScreen(){
      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{...S.card,maxWidth:560,padding:40}}>

            Open <code style={{color:C.accent,background:C.bg,padding:"1px 6px",borderRadius:4}}>index.html</code> and replace the Supabase URL and anon key near the top.

      return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{...S.card,width:360,padding:40}}>

            <div style={{fontSize:28,fontWeight:800,color:C.accent,letterSpacing:"-0.02em"}}>CONCORD</div>

      const delRecord = async id => {
        const rec=records.find(r=>r.id===id);
        if(rec) await dbMoveToTrash(rec,session.name);
        await dbDelRec(id); await reload(); flash("Record moved to trash.");
      };
      const restoreRecord = async rec => { await dbRestoreRec(rec); await reload(); flash("Record restored."); };
      const permDelete    = async id  => { await dbEmptyTrash(id);  await reload(); flash("Permanently deleted."); };

    function PH({title,sub}){
      return <div style={{marginBottom:24}}>
        <div style={{fontSize:22,fontWeight:800,color:C.text,letterSpacing:"-0.01em"}}>{title}</div>
        {sub&&<div style={{fontSize:12,color:C.muted,marginTop:2}}>{sub}</div>}
      </div>;
    }
    function SC({title,children}){
      return <div style={S.card}>
        <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:14}}>{title.toUpperCase()}</div>
        {children}
      </div>;
    }
    function Grid({cols,children}){ return <div style={{display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:12}}>{children}</div>; }
    function F({label,children,col=1}){
      return <div style={{gridColumn:`span ${col}`}}><label style={S.label}>{label}</label>{children}</div>;
    }
    function TI({value,onChange,type="text",placeholder="",onKeyDown}){
      return <input type={type} style={S.input} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)} onKeyDown={onKeyDown} />;
    }
    function TS({value,onChange,options}){
      return <select style={S.input} value={value} onChange={e=>onChange(e.target.value)}>
        <option value="">— Select —</option>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>;
    }
    function THead({cols,widths}){
      const tpl=widths?widths.join(" "):cols.map(()=>"1fr").join(" ");
      return <div style={{display:"grid",gridTemplateColumns:tpl,gap:8,padding:"0 0 6px",borderBottom:`1px solid ${C.border}`,marginBottom:8}}>
        {cols.map(c=><div key={c} style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em"}}>{c.toUpperCase()}</div>)}
      </div>;
    }
    function Done({label,reset}){
      return <div style={{...S.card,textAlign:"center",padding:60}}>
        <div style={{fontSize:40,marginBottom:12}}>✔</div>
        <div style={{color:C.success,fontSize:16,fontWeight:700}}>{label} saved to shared database</div>
        <div style={{color:C.muted,fontSize:12,marginTop:8}}>All users can now see this record.</div>
        <button style={{...S.btn("accent"),marginTop:20}} onClick={reset}>Fill New Sheet</button>
      </div>;
    }
    function useFormValidation(){
      const [errors,setErrors]=React.useState({});
      const validate=(fields)=>{
        const errs={};
        Object.entries(fields).forEach(([k,{value,label}])=>{ if(!value||!String(value).trim()) errs[k]=`${label} is required`; });
        setErrors(errs);
        return Object.keys(errs).length===0;
      };
      const clear=(k)=>setErrors(p=>{ const n={...p}; delete n[k]; return n; });
      return {errors,validate,clear,setErrors};
    }
    function ErrMsg({msg}){
      if(!msg) return null;
      return <div style={{color:C.danger,fontSize:10,marginTop:2,fontWeight:600}}>{msg}</div>;
    }

    // ── Shift auto-detect ─────────────────────────────────────────────────────
    function getShiftFromTime(){
      const h=new Date().getHours();
      return (h>=7&&h<19)?"Day Shift":"Night Shift";
    }

    // ── PIN verification ──────────────────────────────────────────────────────
    async function verifyPin(username,pin){
      const {data}=await sb.from("users").select("id,name,pin").eq("username",username).single();
      if(!data||!data.pin) return {ok:false,msg:"User not found or no PIN set."};
      if(String(data.pin)!==String(pin)) return {ok:false,msg:"Incorrect PIN."};
      return {ok:true,name:data.name};
    }

    // ── PinPrompt — inline per-row sign-off widget ────────────────────────────
    function PinPrompt({onConfirm,label="Sign off"}){
      const [un,setUn]=useState(""); const [pin,setPin]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
      const go=async()=>{
        if(!un.trim()||!pin.trim()){ setErr("Username and PIN required."); return; }
        setBusy(true); setErr("");
        const res=await verifyPin(un.trim(),pin.trim());
        setBusy(false);
        if(!res.ok){ setErr(res.msg); return; }
        const now=new Date();
        const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
        onConfirm({signedBy:res.name,signedAt:timeStr,signedShift:getShiftFromTime()});
        setUn(""); setPin(""); setErr("");
      };
      return <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 8px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,flexWrap:"wrap",marginTop:4}}>
        <span style={{fontSize:10,color:C.muted,fontWeight:600,flexShrink:0}}>✎ {label}</span>
        <input style={{...S.input,width:120,padding:"4px 7px",fontSize:11}} value={un} onChange={e=>setUn(e.target.value)} placeholder="Username" onKeyDown={e=>e.key==="Enter"&&go()} autoComplete="off" />
        <input type="password" style={{...S.input,width:80,padding:"4px 7px",fontSize:11}} value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN" onKeyDown={e=>e.key==="Enter"&&go()} autoComplete="off" />
        <button style={S.btn("accent",{padding:"4px 12px",fontSize:11})} onClick={go} disabled={busy}>{busy?"…":"✔ Confirm"}</button>
        {err&&<span style={{fontSize:11,color:C.danger,fontWeight:600}}>{err}</span>}
      </div>;
    }

    // ── Signed badge ──────────────────────────────────────────────────────────
    function SignedBadge({row}){
      if(!row?.signedBy) return <div style={{fontSize:10,color:C.muted,fontStyle:"italic",padding:"2px 0"}}>— awaiting sign-off</div>;
      return <div style={{fontSize:10,color:C.success,fontWeight:600,lineHeight:1.5}}>✔ {row.signedBy}<br/><span style={{color:C.muted,fontWeight:400}}>{row.signedShift} · {row.signedAt}</span></div>;
    }

    // ── Production Form ───────────────────────────────────────────────────────
    const eP    = () => ({material:"",batchNo:"",qty:"",unit:"",signedBy:"",signedAt:"",signedShift:""});
    const ePOut = () => ({material:"",batchNo:"",qty:"",unit:"",meters:"",time:"",signedBy:"",signedAt:"",signedShift:""});
    const eI    = () => ({inkCode:"",description:"",inkType:"",batchNo:"",supplier:"",qty:"",returned:"",signedBy:"",signedAt:"",signedShift:""});
    const eSv   = () => ({solvent:"",supplier:"",batchNo:"",qty:"",returned:"",signedBy:"",signedAt:"",signedShift:""});

    function ProductionForm({onSave,onReset,users=[],lists={}}){
      const [hdr,setHdr]=useState(()=>({date:todayStr(),shift:getShiftFromTime(),jobNo:"",customer:"",productName:"",substrate:"",width:"",length:"",speed:"",operator:"",supervisor:""}));
      const [rawIn,setRawIn]=useState([eP()]); const [rawOut,setRawOut]=useState([ePOut()]);
      const [returnBopp,setReturnBopp]=useState([{material:"",batchNo:"",qty:"",unit:"",signedBy:"",signedAt:"",signedShift:""}]);
      const [inks,setInks]=useState([eI()]); const [solvents,setSolv]=useState([eSv()]);
      const [boppWaste,setBoppWaste]=useState([{printingBopp:"",printingComment:"",rawBopp:"",rawComment:"",signedBy:"",signedAt:"",signedShift:""}]);
      const [remarks,setRemarks]=useState(""); const [saved,setSaved]=useState(false);
      const opNames=(lists.operator||[]).length>0?(lists.operator||[]).map(String).filter(Boolean):users.filter(u=>u.role==="operator").map(u=>u.name);
      const {errors:fErr,validate,clear:clrErr}=useFormValidation();
      const h=(k,v)=>{ clrErr(k); setHdr(p=>({...p,[k]:v})); };
      const as=(fn,i,k,v)=>fn(a=>a.map((r,x)=>x===i?{...r,[k]:v}:r));
      const asSign=(fn,i,sig)=>fn(a=>a.map((r,x)=>x===i?{...r,...sig}:r));
      const ad=(fn,i)=>fn(a=>a.filter((_,x)=>x!==i));
      if(saved) return <Done label="Production Sheet" reset={onReset} />;
      const save=async()=>{
        if(!validate({shift:{value:hdr.shift,label:"Shift"},jobNo:{value:hdr.jobNo,label:"Job Card Number"},customer:{value:hdr.customer,label:"Customer"},substrate:{value:hdr.substrate,label:"Substrate"},operator:{value:hdr.operator,label:"Operator"}})) return;
        const now=new Date();
        const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
        const finalRawOut=rawOut.map((row,xi)=>xi===rawOut.length-1&&!row.time?{...row,time:timeStr}:row);
        const normBopp=boppWaste.map(r=>({...r,printingBopp:r.printingBopp===""?"0":r.printingBopp,rawBopp:r.rawBopp===""?"0":r.rawBopp}));
        await onSave({type:"production",title:`Production · ${hdr.jobNo||"(no job)"} · ${hdr.date}`,data:{header:hdr,rawIn,rawOut:finalRawOut,returnBopp,boppWaste:normBopp,inks,solvents,remarks}}); setSaved(true);
      };
      return <div>
        <PH title="Daily Production Sheet Printing" sub="Record job details, materials, inks and solvents" />
        {Object.keys(fErr).length>0&&<div style={{background:C.danger+"22",border:`1px solid ${C.danger}`,borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:C.danger,fontWeight:600}}>⚠ Please complete all required fields before saving.</div>}
        <SC title="Job Details">
          <Grid cols={4}>
            <F label="Date"><TI type="date" value={hdr.date} onChange={v=>h("date",v)} /></F>
            <F label="Shift">
              <div style={{...S.input,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"default"}}>
                <span>{hdr.shift}</span>
                <span style={{fontSize:10,color:C.success}}>⏱ auto</span>
              </div>
            </F>
            <F label="Job Card Number"><TI value={hdr.jobNo} onChange={v=>h("jobNo",v)} placeholder="CPK-0001" /><ErrMsg msg={fErr.jobNo} /></F>
            <F label="Customer"><TS value={hdr.customer} onChange={v=>{ h("customer",v); setHdr(p=>({...p,customer:v,productName:""})); }} options={(lists.customer||[]).map(String).filter(Boolean)} /><ErrMsg msg={fErr.customer} /></F>
            <F label="Product Name"><TS value={hdr.productName} onChange={v=>h("productName",v)} options={getProductsForCustomer(hdr.customer,lists,"product_name_printing")} /></F>
            <F label="Substrate"><TS value={hdr.substrate} onChange={v=>h("substrate",v)} options={(lists.substrate||["BOPP","BOPP MAT","PET","PET MAT"]).map(String).filter(Boolean)} /><ErrMsg msg={fErr.substrate} /></F>
            <F label="Width (mm)"><TS value={hdr.width} onChange={v=>h("width",v)} options={(lists.width||[]).map(String).filter(Boolean)} /></F>
            <F label="Length (m)"><TI type="number" value={hdr.length} onChange={v=>h("length",v)} /></F>
            <F label="Speed (m/min)"><TI type="number" value={hdr.speed} onChange={v=>h("speed",v)} /></F>
            <F label="Operator"><TS value={hdr.operator} onChange={v=>h("operator",v)} options={opNames} /><ErrMsg msg={fErr.operator} /></F>
            <F label="Supervisor"><TS value={hdr.supervisor} onChange={v=>h("supervisor",v)} options={(lists.supervisor||[]).map(String).filter(Boolean)} /></F>
          </Grid>
        </SC>
        <SC title="Raw Material Input">
          <THead cols={["Material","Batch No.","Qty","Unit",""]} widths={["2fr","1.5fr","1fr","1fr","40px"]} />
          {rawIn.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TI value={r.material} onChange={v=>as(setRawIn,i,"material",v)} placeholder="Material" />
                <TI value={r.batchNo}  onChange={v=>as(setRawIn,i,"batchNo",v)} />
                <TI type="number" value={r.qty}  onChange={v=>as(setRawIn,i,"qty",v)} />
                <TS value={r.unit} onChange={v=>as(setRawIn,i,"unit",v)} options={(lists.unit||["kg","g","L","mL","m","mm","rolls","sheets"]).map(String).filter(Boolean)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setRawIn,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>asSign(setRawIn,i,sig)} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setRawIn(a=>[...a,eP()])}>+ Add Row</button>
        </SC>
        <SC title="Raw Material Output (Printing Reels)">
          <THead cols={["Material","Batch No.","Qty","Unit","Meters","Time",""]} widths={["2fr","1.5fr","1fr","1fr","1fr","70px","40px"]} />
          {rawOut.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 1fr 70px 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TI value={r.material} onChange={v=>as(setRawOut,i,"material",v)} placeholder="Material" />
                <TI value={r.batchNo}  onChange={v=>as(setRawOut,i,"batchNo",v)} />
                <TI type="number" value={r.qty}    onChange={v=>as(setRawOut,i,"qty",v)} />
                <TS value={r.unit} onChange={v=>as(setRawOut,i,"unit",v)} options={(lists.unit||["kg","g","L","mL","m","mm","rolls","sheets"]).map(String).filter(Boolean)} />
                <TI type="number" value={r.meters||""} onChange={v=>as(setRawOut,i,"meters",v)} placeholder="0" />
                <div style={{fontSize:11,color:r.time?C.success:C.muted,fontWeight:r.time?600:400,padding:"6px 4px",textAlign:"center"}}>{r.time||"—"}</div>
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setRawOut,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>{
                const now=new Date();
                const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
                setRawOut(a=>a.map((x,xi)=>xi===i?{...x,...sig,time:x.time||timeStr}:x));
              }} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>{
            const now=new Date();
            const timeStr=now.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
            setRawOut(a=>{
              const updated=a.map((row,xi)=>xi===a.length-1&&!row.time?{...row,time:timeStr}:row);
              return [...updated,ePOut()];
            });
          }}>+ Add Row</button>
        </SC>
        <SC title="Return Raw BOPP (When Job is Complete)">
          <div style={{fontSize:11,color:C.muted,marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>
            Complete this section when the job is finished and raw BOPP is being returned to the warehouse.
          </div>
          <THead cols={["Material","Batch No.","Qty","Unit",""]} widths={["2fr","1.5fr","1fr","1fr","40px"]} />
          {returnBopp.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TI value={r.material} onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,material:v}:x))} placeholder="Material" />
                <TI value={r.batchNo}  onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,batchNo:v}:x))} />
                <TI type="number" value={r.qty}  onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,qty:v}:x))} />
                <TS value={r.unit} onChange={v=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,unit:v}:x))} options={(lists.unit||["kg","g","L","mL","m","mm","rolls","sheets"]).map(String).filter(Boolean)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>setReturnBopp(a=>a.filter((_,xi)=>xi!==i))}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off return" onConfirm={sig=>setReturnBopp(a=>a.map((x,xi)=>xi===i?{...x,...sig}:x))} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setReturnBopp(a=>[...a,{material:"",batchNo:"",qty:"",unit:"",signedBy:"",signedAt:"",signedShift:""}])}>+ Add Row</button>
        </SC>
        <SC title="BOPP Waste">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.06em"}}>PRINTING BOPP WASTE (KG)</div>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.06em"}}>RAW BOPP FILM WASTE (KG)</div>
          </div>
          {boppWaste.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:6}}>
                  <TI type="number" value={r.printingBopp} onChange={v=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,printingBopp:v}:x))} placeholder="0" />
                  <input style={{...S.input,fontSize:12}} value={r.printingComment||""} onChange={e=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,printingComment:e.target.value}:x))} placeholder="Comment…" />
                </div>
                <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:6}}>
                  <TI type="number" value={r.rawBopp} onChange={v=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,rawBopp:v}:x))} placeholder="0" />
                  <input style={{...S.input,fontSize:12}} value={r.rawComment||""} onChange={e=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,rawComment:e.target.value}:x))} placeholder="Comment…" />
                </div>
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>setBoppWaste(a=>a.filter((_,xi)=>xi!==i))}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>setBoppWaste(a=>a.map((x,xi)=>xi===i?{...x,...sig}:x))} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:2,fontSize:11})} onClick={()=>setBoppWaste(a=>[...a,{printingBopp:"",printingComment:"",rawBopp:"",rawComment:"",signedBy:"",signedAt:"",signedShift:""}])}>+ Add Row</button>
        </SC>
        <SC title="Ink Input">
          <THead cols={["Ink Code","Type","Batch No.","Supplier","Qty (kg)","Returned (kg)",""]} widths={["2.5fr","1fr","1.2fr","1.5fr","1fr","1fr","40px"]} />
          {inks.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"2.5fr 1fr 1.2fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <select style={S.input} value={r.inkCode} onChange={e=>{
                  const code=e.target.value;
                  setInks(prev=>prev.map((row,x)=>x===i?{...row,inkCode:code,description:((lists.ink_code||[]).find(ink=>ink.code===code)||{}).description||""}:row));
                }}>
                  <option value="">— Select —</option>
                  {getInksForProduct(hdr.productName,lists).map(x=>{
                    const code=x.code||x; const desc=(x.description||"").trim();
                    return <option key={code} value={code}>{desc?`${code} — ${desc}`:code}</option>;
                  })}
                </select>
                <select style={S.input} value={r.inkType||""} onChange={e=>as(setInks,i,"inkType",e.target.value)}>
                  <option value="">— Type —</option>
                  <option value="Fresh">Fresh</option>
                  <option value="Press Return">Press Return</option>
                </select>
                <TI value={r.batchNo||""} onChange={v=>as(setInks,i,"batchNo",v)} placeholder="Batch No." />
                <TS value={r.supplier} onChange={v=>as(setInks,i,"supplier",v)} options={(lists.ink_supplier||[]).map(String).filter(Boolean)} />
                <TI type="number" value={r.qty}      onChange={v=>as(setInks,i,"qty",v)} />
                <TI type="number" value={r.returned} onChange={v=>as(setInks,i,"returned",v)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setInks,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>asSign(setInks,i,sig)} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setInks(a=>[...a,eI()])}>+ Add Row</button>
        </SC>
        <SC title="Solvent Input">
          <THead cols={["Solvent","Supplier","Batch Code","Qty (L)","Returned (L)",""]} widths={["1.5fr","1.5fr","1.5fr","1fr","1fr","40px"]} />
          {solvents.map((r,i)=>(
            <div key={i} style={{marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8,border:`1px solid ${r.signedBy?C.success:C.border}`}}>
              <div style={{display:"grid",gridTemplateColumns:"1.5fr 1.5fr 1.5fr 1fr 1fr 40px",gap:6,marginBottom:6,alignItems:"center"}}>
                <TS value={r.solvent}  onChange={v=>as(setSolv,i,"solvent",v)}   options={(lists.solvent||[]).map(String).filter(Boolean)} />
                <TS value={r.supplier} onChange={v=>as(setSolv,i,"supplier",v)}  options={(lists.solvent_supplier||[]).map(String).filter(Boolean)} />
                <TI value={r.batchNo}  onChange={v=>as(setSolv,i,"batchNo",v)}   placeholder="Batch Code" />
                <TI type="number" value={r.qty}      onChange={v=>as(setSolv,i,"qty",v)} />
                <TI type="number" value={r.returned} onChange={v=>as(setSolv,i,"returned",v)} />
                <button style={S.btn("danger",{padding:"4px 8px",fontSize:12})} onClick={()=>ad(setSolv,i)}>✕</button>
              </div>
              {r.signedBy?<SignedBadge row={r} />:<PinPrompt label="Sign off this entry" onConfirm={sig=>asSign(setSolv,i,sig)} />}
            </div>
          ))}
          <button style={S.btn("ghost",{marginTop:6,fontSize:11})} onClick={()=>setSolv(a=>[...a,eSv()])}>+ Add Row</button>
        </SC>
        <SC title="Remarks"><textarea style={{...S.input,minHeight:80,resize:"vertical"}} value={remarks} onChange={e=>setRemarks(e.target.value)} /></SC>

    const BagMakingQCForm = (p) => <GenericQCForm {...p} type={`bagmaking${p.machine}qc`} title={`Bag Making ${p.machine} QC`} productListKey="product_name_bagmaking" checksKey="bagmaking_qc_checks" />;

    // ── Excel Export ──────────────────────────────────────────────────────────
    function exportToExcel(records){
      const wb=XLSX.utils.book_new();
      const summaryData=[
        ["Concord Packaging Traceability — Export"],
        ["Generated:",new Date().toLocaleString()],
        ["Total Records:",records.length],
        [],
        ["ID","Type","Title","Completed By","Date & Time"],
        ...records.map(r=>[r.id,r.type,r.title,r.created_by,new Date(r.created_at).toLocaleString()])
      ];
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summaryData),"Summary");

      const prodRecs=records.filter(r=>r.type==="production");
      if(prodRecs.length){
        const rows=[["Completed By","Date","Shift","Job Card Number","Continuation Of","Customer","Substrate","Width","Length","Speed","Operator","Supervisor","Remarks"]];
        prodRecs.forEach(r=>{
          const h=r.data?.header||{};
          rows.push([r.created_by,h.date,h.shift,h.jobNo,h.continuationOf||"",h.customer,h.substrate,h.width,h.length,h.speed,h.operator,h.supervisor,r.data?.remarks||""]);
          if(r.data?.rawIn?.length){
            rows.push([]); rows.push(["  RAW MATERIAL INPUT","Material","Batch No.","Qty","Unit","Signed By","Shift","Time"]);
            r.data.rawIn.forEach(x=>rows.push(["",x.material,x.batchNo,x.qty,x.unit,x.signedBy||"",x.signedShift||"",x.signedAt||""]));
            const totalQty=r.data.rawIn.reduce((a,x)=>a+parseFloat(x.qty||0),0);
            rows.push(["","","TOTAL",totalQty||"","","","",""]);
          }
          if(r.data?.rawOut?.length){
            rows.push([]); rows.push(["  RAW MATERIAL OUTPUT (PRINTING REELS)","Material","Batch No.","Qty","Unit","Meters","Time","Signed By","Shift","Sign Time"]);
            r.data.rawOut.forEach(x=>rows.push(["",x.material,x.batchNo,x.qty,x.unit,x.meters||"",x.time||"",x.signedBy||"",x.signedShift||"",x.signedAt||""]));
            const totalQty=r.data.rawOut.reduce((a,x)=>a+parseFloat(x.qty||0),0);
            const totalMeters=r.data.rawOut.reduce((a,x)=>a+parseFloat(x.meters||0),0);
            rows.push(["","","TOTAL",totalQty||"","",totalMeters||"","","","",""]);
          }
          if(r.data?.returnBopp?.length&&r.data.returnBopp.some(x=>x.material||x.qty)){
            rows.push([]); rows.push(["  RETURN RAW BOPP (JOB COMPLETE)","Material","Batch No.","Qty","Unit","Signed By","Shift","Time"]);
            r.data.returnBopp.forEach(x=>rows.push(["",x.material,x.batchNo,x.qty,x.unit,x.signedBy||"",x.signedShift||"",x.signedAt||""]));
            const totalQty=r.data.returnBopp.reduce((a,x)=>a+parseFloat(x.qty||0),0);
            rows.push(["","","TOTAL",totalQty||"","","","",""]);
          }
          if(r.data?.boppWaste){ const bwRows=Array.isArray(r.data.boppWaste)?r.data.boppWaste:[r.data.boppWaste]; if(bwRows.some(x=>x.printingBopp||x.rawBopp)){ rows.push([]); rows.push(["  BOPP WASTE","Printing BOPP (kg)","Print Comment","Raw BOPP (kg)","Raw Comment","Signed By","Shift","Time"]); bwRows.forEach(x=>rows.push(["",x.printingBopp||"0",x.printingComment||"",x.rawBopp||"0",x.rawComment||"",x.signedBy||"",x.signedShift||"",x.signedAt||""])); const tP=bwRows.reduce((a,x)=>a+parseFloat(x.printingBopp||0),0); const tR=bwRows.reduce((a,x)=>a+parseFloat(x.rawBopp||0),0); rows.push(["","TOTAL","",tP||"","","","",""]); } }
          if(r.data?.inks?.length){
            rows.push([]); rows.push(["  INK INPUT","Ink Code","Description","Type","Batch No.","Supplier","Qty (kg)","Returned (kg)","Signed By","Shift","Time"]);
            r.data.inks.forEach(x=>rows.push(["",x.inkCode,x.description||x.shade||"",x.inkType||"",x.batchNo||"",x.supplier,x.qty,x.returned,x.signedBy||"",x.signedShift||"",x.signedAt||""]));
            const totalQty=r.data.inks.reduce((a,x)=>a+parseFloat(x.qty||0),0);
            const totalRet=r.data.inks.reduce((a,x)=>a+parseFloat(x.returned||0),0);
            rows.push(["","","","","","TOTAL",totalQty||"",totalRet||"","","",""]);
          }
          if(r.data?.solvents?.length){
            rows.push([]); rows.push(["  SOLVENT INPUT","Solvent","Supplier","Batch Code","Qty (L)","Returned (L)","Signed By","Shift","Time"]);
            r.data.solvents.forEach(x=>rows.push(["",x.solvent,x.supplier,x.batchNo,x.qty,x.returned,x.signedBy||"",x.signedShift||"",x.signedAt||""]));
            const totalQty=r.data.solvents.reduce((a,x)=>a+parseFloat(x.qty||0),0);
            const totalRet=r.data.solvents.reduce((a,x)=>a+parseFloat(x.returned||0),0);
            rows.push(["","","","TOTAL",totalQty||"",totalRet||"","","",""]);
          }
          rows.push(["---"]);
        });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Production");
      }

      const viscRecs=records.filter(r=>r.type==="viscosity");
      if(viscRecs.length){
        const rows=[["Completed By","Date","Shift","Job Card Number","Press","Operator","Ink Name","Ink Type","Target","Unit","Slots..."]];
        viscRecs.forEach(r=>{
          const h=r.data?.header||{}; const rSlots=getSlotsForShift(h.shift);
          (r.data?.readings||[]).forEach((row,i)=>{
            rows.push([i===0?r.created_by:"",i===0?h.date:"",i===0?h.shift:"",i===0?h.jobNo:"",i===0?h.press:"",i===0?h.operator:"",row.ink,row.type||"",row.target,row.unit,...rSlots.map(t=>row.times?.[t]||"")]);
          });
          rows.push(["---"]);
        });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Viscosity QC");
      }

      const qcRecs=records.filter(r=>r.type==="printingqc");
      if(qcRecs.length){
        const rows=[["Completed By","Date","Shift","Job Card Number","Customer","Press","Operator","Inspector","Overall Result","#","Check Item","Result","Comment"]];
        qcRecs.forEach(r=>{
          const h=r.data?.header||{};
          (r.data?.checks||[]).forEach((c,i)=>{ rows.push([i===0?r.created_by:"",i===0?h.date:"",i===0?h.shift:"",i===0?h.jobNo:"",i===0?h.customer:"",i===0?h.press:"",i===0?h.operator:"",i===0?h.inspector:"",i===0?(r.data?.overallResult||""):"",i+1,c.label,c.result,c.comment]); });
          rows.push(["---"]);
        });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Printing QC");
      }

      const lamRecs=records.filter(r=>r.type==="lamination");
      if(lamRecs.length){
        const rows=[];
        lamRecs.forEach(r=>{
          const h=r.data?.header||{};
          rows.push(["Date","Shift","Job Card Number","Customer","Product Name","Operator"]);
          rows.push([h.date,h.shift,h.jobNo,h.customerProduct,h.productName||"",h.operator]);
          rows.push([]);
          if((r.data?.filmRows||[]).length){ rows.push(["-- Film Input --","Material","Film batch no.","KG","Meters"]); (r.data.filmRows||[]).forEach(x=>rows.push(["",x.adhesiveCarrierFilm,x.filmBatchNo,x.filmKg,x.filmSpec])); }
          if((r.data?.outputRows||[]).length){ rows.push(["-- Output Stock --","Material","Film batch no.","KG","Meters"]); (r.data.outputRows||[]).forEach(x=>rows.push(["",x.laminatedRollName,x.filmBatchNo||"",x.kg||"",x.laminatedMetryKg])); }
          if((r.data?.adhesiveRows||[]).length){ rows.push(["-- Adhesive Input --","Carrier KG","Adhesive Name","Adhesive A Code","Batch A","Adhesive B Code","Batch B"]); (r.data.adhesiveRows||[]).forEach(x=>rows.push(["",x.adhesiveCarrierKg,x.adhesiveName,x.adhesiveAProductCode||"",x.adhesiveBatchA||"",x.adhesiveBProductCode||"",x.adhesiveBatchB||""])); }
          if((r.data?.qcRows||[]).length){ rows.push(["-- Adhesive Specs --","Adhesive Amount","GSM","Waste"]); (r.data.qcRows||[]).forEach(x=>rows.push(["",x.adhesiveAmount,x.gsm,x.waste])); }
          rows.push(["---"]);
        });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Lamination");
      }

      const addQCSheet=(type,sheetName)=>{
        const recs=records.filter(r=>r.type===type);
        if(!recs.length) return;
        const rows=[["Completed By","Date","Shift","Job No.","Customer","Product","Operator","Inspector","#","Check Item","Result","Comment","Overall"]];
        recs.forEach(r=>{ const h=r.data?.header||{}; (r.data?.checks||[]).forEach((c,i)=>{ rows.push([i===0?r.created_by:"",i===0?h.date:"",i===0?h.shift:"",i===0?h.jobNo:"",i===0?h.customer:"",i===0?h.productName:"",i===0?h.operator:"",i===0?h.inspector:"",i+1,c.label,c.result,c.comment||"",i===0?r.data?.overallResult:""]); }); rows.push(["---"]); });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),sheetName);
      };
      addQCSheet("laminationqc","Lamination QC");
      [1,2].forEach(m=>{
        const extRecs=records.filter(r=>r.type===`extruder${m}`);
        if(extRecs.length){
          const rows=[];
          extRecs.forEach(r=>{ const h=r.data?.header||{}; rows.push(["Date","Shift","Job No.","Customer","Product","Material Spec","Operator","Supervisor","Remarks"]); rows.push([h.date,h.shift,h.jobNo,h.customer,h.productName,h.materialSpec,h.operator,h.supervisor,r.data?.remarks||""]); rows.push([]); if((r.data?.rmaRows||[]).length){ rows.push(["-- Raw Material A --","Brand","Batch No","KG"]); (r.data.rmaRows||[]).forEach(x=>rows.push(["",x.brand,x.batchNo,x.kg])); } if((r.data?.rmbRows||[]).length){ rows.push(["-- Raw Material B --","Brand","Batch No","KG"]); (r.data.rmbRows||[]).forEach(x=>rows.push(["",x.brand,x.batchNo,x.kg])); } if((r.data?.rollRows||[]).length){ rows.push(["-- Roll Output --","Roll No","Metres","KG"]); (r.data.rollRows||[]).forEach(x=>rows.push(["",x.rollNo,x.metres,x.kg])); } rows.push(["---"]); });
          XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),`Extruder ${m}`);
        }
        addQCSheet(`extruder${m}qc`,`Extruder ${m} QC`);
        const slitRecs=records.filter(r=>r.type===`slitting${m}`);
        if(slitRecs.length){
          const rows=[];
          slitRecs.forEach(r=>{ const h=r.data?.header||{}; rows.push(["Date","Time","Shift","Job No.","Customer","Product"]); rows.push([h.date,h.time,h.shift,h.jobNo,h.customer,h.productName]); rows.push([]); if((r.data?.inputRows||[]).length){ rows.push(["-- Input Stock --","Batch No","Metry","KG"]); (r.data.inputRows||[]).forEach(x=>rows.push(["",x.batchNo,x.metry,x.kg])); } if((r.data?.rollRows||[]).length){ rows.push(["-- Rolls After Slitting --","Roll No","Metry","KG"]); (r.data.rollRows||[]).forEach(x=>rows.push(["",x.rollNo,x.metry,x.kg])); } if((r.data?.outputRows||[]).length){ rows.push(["-- Output Stock --","Pallet Code","Metry","KG"]); (r.data.outputRows||[]).forEach(x=>rows.push(["",x.palletCode,x.metry,x.kg])); } rows.push(["---"]); });
          XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),`Slitting ${m}`);
        }
        addQCSheet(`slitting${m}qc`,`Slitting ${m} QC`);
      });
      [1,2,3,4].forEach(m=>{
        const bmRecs=records.filter(r=>r.type===`bagmaking${m}`);
        if(bmRecs.length){
          const rows=[];
          bmRecs.forEach(r=>{ const h=r.data?.header||{}; rows.push(["Date","Time","Shift","Job No.","Customer","Product","Operator","Batch Code","PCS/Box"]); rows.push([h.date,h.time,h.shift,h.jobNo,h.customer,h.productName,h.operator,h.bagMakingBatchCode,h.pcsPerBox]); rows.push([]); if((r.data?.unwindARows||[]).length){ rows.push(["-- Unwind A --","Batch No","KG","Metres"]); (r.data.unwindARows||[]).forEach(x=>rows.push(["",x.batchNo,x.kg,x.metres])); } if((r.data?.unwindBRows||[]).length){ rows.push(["-- Unwind B --","Batch No","KG","Metres"]); (r.data.unwindBRows||[]).forEach(x=>rows.push(["",x.batchNo,x.kg,x.metres])); } if((r.data?.batchRows||[]).length){ rows.push(["-- Batch Codes --","Batch Code","Boxes Produced"]); (r.data.batchRows||[]).forEach(x=>rows.push(["",x.batchCode,x.boxesProduced])); } if((r.data?.outputRows||[]).length){ rows.push(["-- Output Stock --","Pallet Code","Qty"]); (r.data.outputRows||[]).forEach(x=>rows.push(["",x.palletCode,x.qty])); } rows.push(["---"]); });
          XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),`Bag Making ${m}`);
        }
        addQCSheet(`bagmaking${m}qc`,`Bag Making ${m} QC`);
      });
      XLSX.writeFile(wb,`Concord-Traceability-${new Date().toISOString().split("T")[0]}.xlsx`);
    }

    // ── Records ───────────────────────────────────────────────────────────────
    function Records({records,session,onDelete,onSave}){
      const [filter,setFilter]=useState("all"); const [search,setSearch]=useState("");
      const [exp,setExp]=useState(null); const [editing,setEditing]=useState(null);
      const [selected,setSelected]=useState(new Set());
      const filtered=records.filter(r=>(filter==="all"||r.type===filter)&&(search===""||r.title.toLowerCase().includes(search.toLowerCase())));
      const isAdmin=session.role==="admin";
      const toggleSel=(e,id)=>{ e.stopPropagation(); const next=new Set(selected); if(next.has(id)) next.delete(id); else next.add(id); setSelected(next); };
      const toExport=selected.size>0?filtered.filter(r=>selected.has(r.id)):filtered;
      const filterLabels={"all":"All","production":"Printing","viscosity":"Viscosity QC","printingqc":"Printing QC","lamination":"Lamination","laminationqc":"Lam QC","extruder1":"Extruder 1","extruder1qc":"Ext 1 QC","extruder2":"Extruder 2","extruder2qc":"Ext 2 QC","slitting1":"Slitting 1","slitting1qc":"Slit 1 QC","slitting2":"Slitting 2","slitting2qc":"Slit 2 QC","bagmaking1":"Bag 1","bagmaking1qc":"Bag 1 QC","bagmaking2":"Bag 2","bagmaking2qc":"Bag 2 QC","bagmaking3":"Bag 3","bagmaking3qc":"Bag 3 QC","bagmaking4":"Bag 4","bagmaking4qc":"Bag 4 QC"};
      return <div>
        <PH title="All Records" sub={`${records.length} records shared across all devices`} />
        <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {Object.keys(filterLabels).map(f=>(
              <button key={f} onClick={()=>{ setFilter(f); setSelected(new Set()); }} style={S.btn(filter===f?"accent":"ghost",{padding:"5px 12px",fontSize:10})}>{filterLabels[f]}</button>
            ))}
          </div>
          <input style={{...S.input,width:220,padding:"6px 12px"}} value={search} placeholder="Search…" onChange={e=>setSearch(e.target.value)} />
          <div style={{flex:1}} />
          {selected.size>0&&<button style={S.btn("ghost",{padding:"6px 16px",fontSize:11})} onClick={()=>setSelected(new Set())}>Clear Selection</button>}
          <button style={{...S.btn("accent",{padding:"6px 16px",fontSize:11}),background:C.success}} onClick={()=>exportToExcel(toExport)}>↓ Export to Excel ({toExport.length})</button>
        </div>
        {filtered.length===0&&<div style={{color:C.muted,fontSize:13}}>No records found.</div>}
        {filtered.map(r=>{
          const typeColor={production:C.accent,viscosity:C.blue,printingqc:C.success,lamination:"#9b59b6",laminationqc:"#27ae60",extruder1:"#e67e22",extruder1qc:"#d35400",extruder2:"#16a085",extruder2qc:"#1abc9c",slitting1:"#8e44ad",slitting1qc:"#6c3483",slitting2:"#2471a3",slitting2qc:"#1a5276",bagmaking1:"#c0392b",bagmaking1qc:"#922b21",bagmaking2:"#d68910",bagmaking2qc:"#b7770d",bagmaking3:"#1e8bc3",bagmaking3qc:"#1a6fa0",bagmaking4:"#27ae60",bagmaking4qc:"#1e8449"};
          const color=typeColor[r.type]||C.muted;
          const isExp=exp===r.id; const isEdit=editing===r.id;
          return <div key={r.id} style={{...S.card,marginBottom:8,border:selected.has(r.id)?`1px solid ${C.success}`:`1px solid ${C.border}`}}>
            <div style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>{ setExp(isExp?null:r.id); setEditing(null); }}>
              <div onClick={e=>toggleSel(e,r.id)} style={{width:18,height:18,border:`1px solid ${selected.has(r.id)?C.success:C.muted}`,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",background:selected.has(r.id)?C.success:C.bg,color:"#fff",fontSize:12,flexShrink:0}}>
                {selected.has(r.id)&&"✔"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:C.text,fontWeight:600}}>{r.title}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:3,display:"flex",gap:12,flexWrap:"wrap"}}>
                  <span>📋 Completed by: <span style={{color:C.accent,fontWeight:700}}>{r.created_by}</span></span>
                  {(r.data?.header?.customer||r.data?.header?.customerProduct)&&(
                    <span>🏢 <span style={{color:C.text}}>{r.data.header.customer||r.data.header.customerProduct}</span></span>
                  )}
                  {r.data?.header?.productName&&(
                    <span>📦 <span style={{color:C.text}}>{r.data.header.productName}</span></span>
                  )}
                  {r.data?.header?.continuationOf&&(
                    <span style={{color:C.warn,fontWeight:600}}>🔗 Cont. of {r.data.header.continuationOf}</span>
                  )}
                  <span>🕐 {new Date(r.created_at).toLocaleString()}</span>
                </div>
              </div>
              <span style={{fontSize:10,color}}>{isExp?"▲":"▼"}</span>
              {isAdmin&&<>
                <button style={S.btn("ghost",{padding:"4px 10px",fontSize:11,color:C.blue,outline:`1px solid ${C.blue}`})}
                  onClick={e=>{ e.stopPropagation(); setExp(r.id); setEditing(isEdit?null:r.id); }}>{isEdit?"Cancel Edit":"✎ Edit"}</button>
                <button style={S.btn("danger",{padding:"4px 10px",fontSize:11})}
                  onClick={e=>{ e.stopPropagation(); if(window.confirm("Delete this record?")) onDelete(r.id); }}>Delete</button>
              </>}
            </div>
            {isExp&&!isEdit&&<RecDetail r={r} createdBy={r.created_by} />}
            {isExp&&isEdit&&<RecEdit r={r} onSave={async(data)=>{ await onSave(r.id,data); setEditing(null); }} onCancel={()=>setEditing(null)} />}
          </div>;
        })}
      </div>;
    }

    function RecDetail({r,createdBy}){
      const d=r.data||{};
      return <div style={{marginTop:16,paddingTop:16,borderTop:`1px solid ${C.border}`,fontSize:12}}>
        <div style={{marginBottom:12,padding:"8px 12px",background:C.bg,borderRadius:6,display:"inline-block"}}>
          <span style={{color:C.muted}}>Completed by: </span><span style={{color:C.accent,fontWeight:700}}>{createdBy}</span>
          <span style={{color:C.muted,marginLeft:12}}>on {new Date(r.created_at).toLocaleString()}</span>
        </div>
        {r.type==="production"?<ProdD d={d}/>:r.type==="viscosity"?<ViscD d={d}/>:r.type.endsWith("qc")?<QCD d={d}/>:<GenericD d={d}/>}
      </div>;
    }

    function RecEdit({r,onSave,onCancel}){
      const [data,setData]=useState(JSON.parse(JSON.stringify(r.data||{})));
      const setH=(k,v)=>setData(d=>({...d,header:{...d.header,[k]:v}}));
      const setArr=(key,i,k,v)=>setData(d=>({...d,[key]:d[key].map((x,xi)=>xi===i?{...x,[k]:v}:x)}));
      const addArr=(key,empty)=>setData(d=>({...d,[key]:[...(d[key]||[]),empty]}));
      const delArr=(key,i)=>setData(d=>({...d,[key]:d[key].filter((_,xi)=>xi!==i)}));
      return <div style={{marginTop:16,paddingTop:16,borderTop:`2px solid ${C.accent}`,fontSize:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.accent,letterSpacing:"0.08em",marginBottom:14}}>EDITING RECORD — ADMIN MODE</div>
        {r.type==="production"&&<EditProd data={data} setH={setH} setArr={setArr} addArr={addArr} delArr={delArr} setData={setData} />}
        {r.type==="viscosity"&&<EditVisc data={data} setH={setH} setArr={setArr} addArr={addArr} delArr={delArr} setData={setData} />}
        {r.type.endsWith("qc")&&<EditQC data={data} setH={setH} setArr={setArr} addArr={addArr} delArr={delArr} setData={setData} />}
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button style={S.btn("accent",{padding:"8px 24px"})} onClick={()=>onSave(data)}>Save Changes</button>
          <button style={S.btn("ghost",{padding:"8px 24px"})} onClick={onCancel}>Cancel</button>
        </div>
      </div>;
    }

            <F key={k} label={label}><TI type={type} value={h[k]||""} onChange={v=>setH(k,v)} /></F>

    function ProdD({d}){
      const h=d.header||{};
      return <div>
        {h.continuationOf&&(

          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}}>
          {[["Date",h.date],["Shift",h.shift],["Job Card Number",h.jobNo],["Customer",h.customer],["Product Name",h.productName],["Substrate",h.substrate],["Width",h.width],["Length",h.length],["Speed",h.speed],["Operator",h.operator],["Supervisor",h.supervisor]].map(([k,v])=>(
            <div key={k}><div style={{fontSize:10,color:C.muted}}>{k}</div><div style={{color:C.text}}>{v||"—"}</div></div>
          ))}
        </div>
        <DT title="Raw Material Input"  rows={d.rawIn}  cols={["material","batchNo","qty","unit","signedBy","signedShift","signedAt"]} sumCols={["qty"]} />
        <DT title="Raw Material Output (Printing Reels)" rows={d.rawOut} cols={["material","batchNo","qty","unit","meters","time","signedBy","signedShift","signedAt"]} sumCols={["qty","meters"]} />
        <DT title="Return Raw BOPP (When Job is Complete)" rows={d.returnBopp} cols={["material","batchNo","qty","unit","signedBy","signedShift","signedAt"]} sumCols={["qty"]} />
        {(()=>{
          const bw=d.boppWaste;
          if(!bw) return null;
          const rows=Array.isArray(bw)?bw:[bw];
          if(!rows.some(r=>r.printingBopp||r.rawBopp)) return null;
          const sumPrinting=rows.reduce((a,r)=>a+parseFloat(r.printingBopp||0),0);
          const sumRaw=rows.reduce((a,r)=>a+parseFloat(r.rawBopp||0),0);
          return <div style={{marginBottom:12}}>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:6}}>BOPP WASTE</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:4}}>
              <div style={{fontSize:10,color:C.muted}}>Printing BOPP Waste</div>
              <div style={{fontSize:10,color:C.muted}}>Raw BOPP Film Waste</div>
            </div>
            {rows.map((r,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,padding:"6px 0",borderTop:`1px solid ${C.border}`}}>
                <div>
                  <div style={{color:C.text,fontWeight:600}}>{r.printingBopp||"0"} kg</div>
                  {r.printingComment&&<div style={{color:C.muted,fontSize:11,marginTop:2}}>{r.printingComment}</div>}
                </div>
                <div>
                  <div style={{color:C.text,fontWeight:600}}>{r.rawBopp||"0"} kg</div>
                  {r.rawComment&&<div style={{color:C.muted,fontSize:11,marginTop:2}}>{r.rawComment}</div>}
                </div>
              </div>
            ))}
            {rows.length>1&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,padding:"5px 0",borderTop:`2px solid ${C.border}`,marginTop:2}}>
                <div style={{color:C.accent,fontWeight:700,fontSize:11}}>Σ {sumPrinting%1===0?sumPrinting:sumPrinting.toFixed(3)} kg</div>
                <div style={{color:C.accent,fontWeight:700,fontSize:11}}>Σ {sumRaw%1===0?sumRaw:sumRaw.toFixed(3)} kg</div>
              </div>
            )}
          </div>;
        })()}
        <DT title="Ink Input" rows={(d.inks||[]).map(i=>({...i,inkLabel:i.inkCode?(i.description||i.shade?`${i.inkCode} — ${i.description||i.shade}`:i.inkCode):""}))} cols={["inkLabel","inkType","batchNo","supplier","qty","returned","signedBy","signedShift","signedAt"]} sumCols={["qty","returned"]} />
        <DT title="Solvent Input" rows={d.solvents} cols={["solvent","supplier","batchNo","qty","returned","signedBy","signedShift","signedAt"]} sumCols={["qty","returned"]} />
        {d.remarks&&<div style={{marginTop:10}}><span style={{color:C.muted}}>Remarks: </span>{d.remarks}</div>}
      </div>;
    }
