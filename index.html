    // ── Change Password ───────────────────────────────────────────────────────
    function ChangePassword({session,flash}){
      const [current,setCurrent]=useState(""); const [newPw,setNewPw]=useState(""); const [confirm,setConfirm]=useState(""); const [err,setErr]=useState("");
      const [pin,setPin]=useState(""); const [pinConfirm,setPinConfirm]=useState(""); const [pinErr,setPinErr]=useState("");
      const save=async()=>{
        setErr("");
        const {data}=await sb.from("users").select("password").eq("id",session.id).single();
        if(!data||data.password!==current){ setErr("Current password is incorrect."); return; }
        if(!newPw.trim()){ setErr("New password cannot be empty."); return; }
        if(newPw!==confirm){ setErr("New passwords do not match."); return; }
        if(newPw.length<4){ setErr("Password must be at least 4 characters."); return; }
        const {error}=await sb.from("users").update({password:newPw}).eq("id",session.id);
        if(error){ setErr("Failed to update: "+error.message); return; }
        setCurrent(""); setNewPw(""); setConfirm(""); flash("Password changed successfully!");
      };
      const savePin=async()=>{
        setPinErr("");
        if(!pin.trim()){ setPinErr("PIN cannot be empty."); return; }
        if(!/^\d{4,6}$/.test(pin)){ setPinErr("PIN must be 4 to 6 digits."); return; }
        if(pin!==pinConfirm){ setPinErr("PINs do not match."); return; }
        const {error}=await sb.from("users").update({pin}).eq("id",session.id);
        if(error){ setPinErr("Failed to update: "+error.message); return; }
        setPin(""); setPinConfirm(""); flash("PIN updated successfully!");
      };
      return <div>
        <PH title="Change Password & PIN" sub={`Account settings for: ${session.name}`} />
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <div style={S.card}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:16}}>CHANGE PASSWORD</div>
            <label style={S.label}>Current Password</label>
            <input type="password" style={{...S.input,marginBottom:14}} value={current} onChange={e=>setCurrent(e.target.value)} />
            <label style={S.label}>New Password</label>
            <input type="password" style={{...S.input,marginBottom:14}} value={newPw} onChange={e=>setNewPw(e.target.value)} />
            <label style={S.label}>Confirm New Password</label>
            <input type="password" style={{...S.input,marginBottom:16}} value={confirm} onChange={e=>setConfirm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} />
            {err&&<div style={{color:C.danger,fontSize:12,marginBottom:12}}>{err}</div>}
            <button style={{...S.btn("accent"),width:"100%",padding:10}} onClick={save}>Update Password</button>
          </div>
          <div style={S.card}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:8}}>SET PRODUCTION PIN</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:14,padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>
              Your PIN is used to sign off individual entries on production sheets. Must be 4–6 digits.
            </div>
            <label style={S.label}>New PIN (4–6 digits)</label>
            <input type="password" inputMode="numeric" pattern="[0-9]*" style={{...S.input,marginBottom:14,letterSpacing:"0.3em",fontSize:18}} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="••••" />
            <label style={S.label}>Confirm PIN</label>
            <input type="password" inputMode="numeric" pattern="[0-9]*" style={{...S.input,marginBottom:16,letterSpacing:"0.3em",fontSize:18}} value={pinConfirm} onChange={e=>setPinConfirm(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="••••" onKeyDown={e=>e.key==="Enter"&&savePin()} />
            {pinErr&&<div style={{color:C.danger,fontSize:12,marginBottom:12}}>{pinErr}</div>}
            <button style={{...S.btn("accent"),width:"100%",padding:10}} onClick={savePin}>Update PIN</button>
          </div>
        </div>
      </div>;
    }

    // ── Login Log ─────────────────────────────────────────────────────────────
    function LoginLog({loginLog}){
      const [search,setSearch]=useState(""); const [filterRole,setFilterRole]=useState("all");
      const filtered=loginLog.filter(e=>(!search||e.name?.toLowerCase().includes(search.toLowerCase())||e.username?.toLowerCase().includes(search.toLowerCase()))&&(filterRole==="all"||e.role===filterRole));
      const rc=r=>r==="admin"?C.accent2:r==="manager"?C.accent:r==="qc"?C.blue:r==="viewer"?C.muted:C.success;
      const fmt=iso=>{ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"})+"  "+d.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); };
      return <div>
        <PH title="Login Log" sub="A record of every login — who, date and time. Admin access only." />
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
          <input style={{...S.input,flex:1,maxWidth:280}} placeholder="Search by name or username…" value={search} onChange={e=>setSearch(e.target.value)} />
          <select style={{...S.input,width:"auto",paddingRight:12}} value={filterRole} onChange={e=>setFilterRole(e.target.value)}>
            <option value="all">All roles</option>
            <option value="admin">Admin</option><option value="manager">Manager</option>
            <option value="operator">Operator</option><option value="qc">QC Officer</option><option value="viewer">Viewer</option>
          </select>
          <span style={{color:C.muted,fontSize:12,marginLeft:"auto"}}>{filtered.length} entr{filtered.length!==1?"ies":"y"}</span>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:C.panel,borderBottom:`2px solid ${C.border}`}}>
              {["#","Full Name","Username","Role","Date & Time"].map(h=>(
                <th key={h} style={{padding:"10px 14px",textAlign:"left",color:C.muted,fontWeight:700,fontSize:11,whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={5} style={{padding:"40px",textAlign:"center",color:C.muted}}>{loginLog.length===0?"No logins recorded yet.":"No results for your search."}</td></tr>}
              {filtered.map((e,i)=>(
                <tr key={e.id||i} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"transparent":C.panel+"66"}}>
                  <td style={{padding:"10px 14px",color:C.muted,fontSize:11}}>{i+1}</td>
                  <td style={{padding:"10px 14px",color:C.text,fontWeight:600}}>{e.name}</td>
                  <td style={{padding:"10px 14px",color:C.muted,fontFamily:"'IBM Plex Mono',monospace",fontSize:12}}>{e.username}</td>
                  <td style={{padding:"10px 14px"}}><span style={{fontSize:10,padding:"2px 9px",borderRadius:4,background:rc(e.role)+"33",color:rc(e.role),fontWeight:700}}>{(e.role||"").toUpperCase()}</span></td>
                  <td style={{padding:"10px 14px",color:C.text,fontFamily:"'IBM Plex Mono',monospace",fontSize:12,whiteSpace:"nowrap"}}>{fmt(e.logged_in_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>;
    }

    // ── Trash Bin ─────────────────────────────────────────────────────────────
    function TrashBin({trashed,onRestore,onPermDelete}){
      const [search,setSearch]=useState(""); const [confirmId,setConfirmId]=useState(null);
      const filtered=trashed.filter(r=>r.title?.toLowerCase().includes(search.toLowerCase())||r.deleted_by?.toLowerCase().includes(search.toLowerCase())||r.type?.toLowerCase().includes(search.toLowerCase()));
      return <div>
        <PH title="Trash Bin" sub="Deleted records — restore or permanently remove. Only admins can view this." />
        <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center"}}>
          <input style={{...S.input,flex:1,maxWidth:320}} placeholder="Search trash…" value={search} onChange={e=>setSearch(e.target.value)} />
          <span style={{color:C.muted,fontSize:12}}>{filtered.length} item{filtered.length!==1?"s":""}</span>
        </div>
        {filtered.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:C.muted,fontSize:13}}><div style={{fontSize:40,marginBottom:8}}>🗑</div>{trashed.length===0?"Trash is empty.":"No results for your search."}</div>}
        {filtered.map(r=>(
          <div key={r.id} style={{borderBottom:`1px solid ${C.border}`,padding:"14px 0"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:200}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:C.accent+"33",color:C.accent,fontWeight:700}}>{r.type?.toUpperCase()}</span>
                  <span style={{color:C.text,fontWeight:600,fontSize:13}}>{r.title}</span>
                </div>
                <div style={{fontSize:11,color:C.muted}}>Created by <span style={{color:C.text}}>{r.created_by}</span> · {r.created_at?new Date(r.created_at).toLocaleString():""}</div>
                <div style={{fontSize:11,color:C.danger,marginTop:2}}>🗑 Deleted by <span style={{color:C.text}}>{r.deleted_by}</span> · {r.deleted_at?new Date(r.deleted_at).toLocaleString():""}</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
                <button style={S.btn("ghost",{padding:"5px 14px",fontSize:12,color:C.success,outline:`1px solid ${C.success}`})} onClick={()=>onRestore(r)}>↩ Restore</button>
                {confirmId===r.id?(
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <span style={{fontSize:11,color:C.danger}}>Sure?</span>
                    <button style={S.btn("danger",{padding:"5px 12px",fontSize:12})} onClick={()=>{ onPermDelete(r.id); setConfirmId(null); }}>Yes, Delete</button>
                    <button style={S.btn("ghost",{padding:"5px 10px",fontSize:12})} onClick={()=>setConfirmId(null)}>Cancel</button>
                  </div>
                ):(
                  <button style={S.btn("danger",{padding:"5px 14px",fontSize:12})} onClick={()=>setConfirmId(r.id)}>✕ Remove</button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>;
    }

    // ── Efficiency Report ─────────────────────────────────────────────────────
    function EfficiencyReport({records,appLists}){
      const [dateFrom,setDateFrom]=useState(()=>{ const d=new Date(); d.setDate(d.getDate()-30); return d.toISOString().split("T")[0]; });
      const [dateTo,setDateTo]=useState(todayStr());
      const [filterShift,setFilterShift]=useState("all");
      const [filterOperator,setFilterOperator]=useState("all");
      const [filterCustomer,setFilterCustomer]=useState("all");
      const [viewMode,setViewMode]=useState("shift"); // "shift" | "job" | "operator"

      // Build productSpeeds — DB entries win (user changes respected), defaults fill gaps
      const productSpeeds=(()=>{
        const db=Array.isArray(appLists.product_speeds)?appLists.product_speeds:[];
        if(db.length===0) return DEFAULT_PRODUCT_SPEEDS;
        // Start with DB entries
        const merged=[...db.filter(e=>e.customer&&e.product&&e.runSpeed)];
        // Add defaults that don't exist in DB
        DEFAULT_PRODUCT_SPEEDS.forEach(def=>{
          const exists=merged.find(d=>
            d.customer?.toLowerCase().trim()===def.customer?.toLowerCase().trim()&&
            d.product?.toLowerCase().trim()===def.product?.toLowerCase().trim()
          );
          if(!exists) merged.push(def);
        });
        return merged;
      })();
      const shiftTimes=(appLists.shift_times&&typeof appLists.shift_times==="object"&&!Array.isArray(appLists.shift_times))?appLists.shift_times:DEFAULT_SHIFT_TIMES;

      // Shift duration in minutes
      const parseTime=t=>{ const [h,m]=(t||"00:00").split(":").map(Number); return h*60+(m||0); };
      const dayMins  =parseTime(shiftTimes.dayEnd||"19:00")-parseTime(shiftTimes.dayStart||"07:00");
      const nightMins=(parseTime(shiftTimes.nightEnd||"07:00")+1440-parseTime(shiftTimes.nightStart||"19:00"))%1440||720;

      const allProd=records.filter(r=>r.type==="production");
      const allOperators=[...new Set(allProd.map(r=>r.data?.header?.operator).filter(Boolean))].sort();
      const allCustomers=[...new Set(allProd.map(r=>r.data?.header?.customer).filter(Boolean))].sort();
      const allJobs=[...new Set(allProd.map(r=>r.data?.header?.jobNo).filter(Boolean))].sort();

      const setPreset=(days)=>{ const d=new Date(); d.setDate(d.getDate()-days); setDateFrom(d.toISOString().split("T")[0]); setDateTo(todayStr()); };

      const filtered=allProd.filter(r=>{
        const d=r.data?.header?.date||"";
        if(d<dateFrom||d>dateTo) return false;
        if(filterShift!=="all"&&r.data?.header?.shift!==filterShift) return false;
        if(filterOperator!=="all"&&r.data?.header?.operator!==filterOperator) return false;
        if(filterCustomer!=="all"&&r.data?.header?.customer!==filterCustomer) return false;
        return true;
      });

      const effColor=e=>e>=90?C.success:e>=70?C.warn:C.danger;

      // ── Helper: find best speed entry for a group of sheets ──────────────────
      const getBestSpeed=(sheets)=>{
        let bestEntry=null,bestMeters=0;
        sheets.forEach(r=>{
          const h=r.data?.header||{};
          const m=(r.data?.rawOut||[]).reduce((a,x)=>a+parseFloat(x.meters||0),0);
          if(m>=bestMeters){
            bestMeters=m;
            const custL=(h.customer||"").toLowerCase().trim();
            const prodL=(h.productName||"").toLowerCase().trim();
            // 1. Try exact customer + product match
            let found=productSpeeds.find(s=>
              s.customer?.toLowerCase().trim()===custL&&
              s.product?.toLowerCase().trim()===prodL
            );
            // 2. Fallback: try product-only match (handles customer name variations like LFC Meule vs LFC Milling)
            if(!found&&prodL){
              found=productSpeeds.find(s=>s.product?.toLowerCase().trim()===prodL);
            }
            if(found) bestEntry=found;
          }
        });
        return bestEntry;
      };

      // ── OEE constants (defined early so all build functions can use them) ─────
      const oeeParamsCfg = (appLists.oee_params&&typeof appLists.oee_params==="object"&&!Array.isArray(appLists.oee_params))
        ? appLists.oee_params
        : {maxSpeed:200,loadingFactor:70,downtimeProvision:20};
      const OEE_SPEED = Math.round((oeeParamsCfg.maxSpeed||200) * ((oeeParamsCfg.loadingFactor||70)/100));
      const OEE_AVAIL = (100-(oeeParamsCfg.downtimeProvision||20))/100;

      // ── BUILD SHIFT ROWS ─────────────────────────────────────────────────────
      const buildShiftRows=(recs)=>{
        const map={};
        recs.forEach(r=>{
          const h=r.data?.header||{};
          const entries=r.data?.rawOut||[];
          const hasSignedDates=entries.some(x=>x.signedDate);
          if(hasSignedDates){
            // New records — group each entry by its own signedDate+signedShift
            entries.forEach(x=>{
              const entryDate=x.signedDate||h.date||"";
              const hr=parseInt((x.signedAt||x.time||"12:00").split(":")[0]||12);
              const entryShift=x.signedShift||((hr>=7&&hr<19)?"Day Shift":"Night Shift");
              const key=`${entryDate}__${entryShift}`;
              if(!map[key]) map[key]={date:entryDate,shift:entryShift,operators:new Set(),customers:new Set(),products:new Set(),jobNos:new Set(),sheets:[],actualMeters:0,isOldRecord:false};
              const g=map[key];
              if(x.signedBy) g.operators.add(x.signedBy);
              else if(h.operator) g.operators.add(h.operator);
              if(h.customer) g.customers.add(h.customer);
              if(h.productName) g.products.add(h.productName);
              if(h.jobNo) g.jobNos.add(h.jobNo);
              if(!g.sheets.find(s=>s.id===r.id)) g.sheets.push(r);
              g.actualMeters+=parseFloat(x.meters||0);
            });
          } else {
            // Old records — use header date+shift, flag as unreliable
            const key=`${h.date||""}__${h.shift||""}`;
            if(!map[key]) map[key]={date:h.date||"",shift:h.shift||"",operators:new Set(),customers:new Set(),products:new Set(),jobNos:new Set(),sheets:[],actualMeters:0,isOldRecord:true};
            const g=map[key];
            if(h.operator) g.operators.add(h.operator);
            if(h.customer) g.customers.add(h.customer);
            if(h.productName) g.products.add(h.productName);
            if(h.jobNo) g.jobNos.add(h.jobNo);
            g.sheets.push(r);
            entries.forEach(x=>{ g.actualMeters+=parseFloat(x.meters||0); });
          }
        });
        return Object.values(map).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(g=>{
          const shiftMins=g.shift==="Night Shift"?nightMins:dayMins;
          // Weighted target: each job contributes proportionally based on meters it produced
          // Target = Σ (jobMeters/totalMeters × shiftMins × jobSpeed / jobDowntime)
          // This gives a fair blended target when multiple products ran in the same shift
          let weightedTarget=null;
          if(g.actualMeters>0){
            let totalWeighted=0;
            let hasAnySpeed=false;
            g.sheets.forEach(r=>{
              const h=r.data?.header||{};
              // Only count meters from entries that belong to this shift
              const sheetMeters=g.isOldRecord
                ?(r.data?.rawOut||[]).reduce((a,x)=>a+parseFloat(x.meters||0),0)
                :(r.data?.rawOut||[]).filter(x=>{
                    if(!x.signedDate) return false;
                    const hr=parseInt((x.signedAt||x.time||"12:00").split(":")[0]||12);
                    const sh=x.signedShift||((hr>=7&&hr<19)?"Day Shift":"Night Shift");
                    return x.signedDate===g.date&&sh===g.shift;
                  }).reduce((a,x)=>a+parseFloat(x.meters||0),0);
              if(sheetMeters<=0) return;
              const custL=(h.customer||"").toLowerCase().trim();
              const prodL=(h.productName||"").toLowerCase().trim();
              let se=productSpeeds.find(s=>s.customer?.toLowerCase().trim()===custL&&s.product?.toLowerCase().trim()===prodL);
              if(!se&&prodL) se=productSpeeds.find(s=>s.product?.toLowerCase().trim()===prodL);
              if(se?.runSpeed&&se?.downtime){
                const weight=sheetMeters/Math.max(g.actualMeters,1);
                totalWeighted+=weight*(se.runSpeed*shiftMins/se.downtime);
                hasAnySpeed=true;
              }
            });
            if(totalWeighted>0) weightedTarget=Math.round(totalWeighted);
          }
          let displaySpeed=null,displayDowntime=null;
          if(g.sheets.length===1){
            const best=getBestSpeed(g.sheets);
            displaySpeed=best?.runSpeed||null;
            displayDowntime=best?.downtime||null;
          }
          // Old records without signedDate — show no efficiency
          const efficiency=(weightedTarget&&g.actualMeters>0&&!g.isOldRecord)
            ?Math.min(Math.round((g.actualMeters/weightedTarget)*100),999):null;
          return {...g,shiftMins,runSpeed:displaySpeed,downtime:displayDowntime,targetMeters:weightedTarget,efficiency,
            operatorList:[...g.operators].join(", "),customerList:[...g.customers].join(", "),
            productList:[...g.products].join(", "),jobList:[...g.jobNos].join(", ")};
        });
      };

      // ── BUILD JOB ROWS ───────────────────────────────────────────────────────
      const buildJobRows=(recs)=>{
        const map={};
        recs.forEach(r=>{
          const h=r.data?.header||{};
          const key=h.jobNo||"(no job)";
          if(!map[key]) map[key]={jobNo:key,dates:new Set(),shifts:new Set(),shiftSlots:new Set(),hasSignedDates:false,operators:new Set(),customers:new Set(),products:new Set(),sheets:[],actualMeters:0,fallbackShift:h.shift||"Day Shift",fallbackDate:h.date||""};
          const g=map[key];
          if(h.operator) g.operators.add(h.operator);
          if(h.customer) g.customers.add(h.customer);
          if(h.productName) g.products.add(h.productName);
          if(h.date) g.dates.add(h.date);
          g.sheets.push(r);
          (r.data?.rawOut||[]).forEach(x=>{
            g.actualMeters+=parseFloat(x.meters||0);
            if(x.signedDate){
              g.hasSignedDates=true;
              const hr=parseInt((x.signedAt||x.time||"12:00").split(":")[0]||12);
              const sh=x.signedShift||((hr>=7&&hr<19)?"Day Shift":"Night Shift");
              g.shiftSlots.add(`${x.signedDate}__${sh}`);
              g.dates.add(x.signedDate);
              g.shifts.add(sh);
            }
          });
        });

        return Object.values(map).sort((a,b)=>{
          const da=[...a.dates].sort().pop()||"";
          const db=[...b.dates].sort().pop()||"";
          return da<db?1:da>db?-1:0;
        }).map(g=>{
          const best=getBestSpeed(g.sheets);
          const runSpeed=best?.runSpeed||null;
          const downtime=best?.downtime||null;
          const fallbackShiftMins=(g.fallbackShift==="Night Shift"?nightMins:dayMins);

          let totalShiftMins=0;
          let numShifts=0;

          if(g.hasSignedDates){
            // Accurate: use actual date+shift stamps
            numShifts=g.shiftSlots.size;
            g.shiftSlots.forEach(slot=>{ const sh=slot.split("__")[1]||""; totalShiftMins+=(sh==="Night Shift"?nightMins:dayMins); });
          } else {
            // Old record — no signedDate, efficiency will show as null (no data)
            numShifts=0;
            totalShiftMins=0;
          }

          const targetMeters=(runSpeed&&downtime&&totalShiftMins)?Math.round((runSpeed*totalShiftMins)/downtime):null;
          // Only show efficiency for records with accurate signedDate stamps
          // Old records without signedDate show null (no data) — no guessing
          const efficiency=(targetMeters&&g.actualMeters>0&&g.hasSignedDates)?Math.min(Math.round((g.actualMeters/targetMeters)*100),999):null;
          const isEstimated=false; // no longer used
          const sortedDates=[...g.dates].sort();
          const dateRange=sortedDates.length>1?`${sortedDates[0]} → ${sortedDates[sortedDates.length-1]}`:(sortedDates[0]||"—");
          return {...g,numShifts,totalShiftMins,runSpeed,downtime,targetMeters,efficiency,isEstimated,dateRange,
            operatorList:[...g.operators].join(", "),customerList:[...g.customers].join(", "),
            productList:[...g.products].join(", "),dateList:sortedDates.join(", ")};
        });
      };

      // ── BUILD OPERATOR ROWS ──────────────────────────────────────────────────
      // Groups entries by signedDate + signedShift + signedBy
      // Each operator on each shift gets their own row with their own meters
      const buildOperatorRows=(recs)=>{
        const map={};
        recs.forEach(r=>{
          const h=r.data?.header||{};
          (r.data?.rawOut||[]).forEach(x=>{
            const meters=parseFloat(x.meters||0);
            if(!meters) return; // skip entries with no meters
            // Determine date and shift from sign-off data
            const entryDate = x.signedDate || h.date || "";
            const entryShift = x.signedShift || (()=>{
              const hr=parseInt((x.signedAt||x.time||"12:00").split(":")[0]||12);
              return (hr>=7&&hr<19)?"Day Shift":"Night Shift";
            })();
            const operator = x.signedBy || h.operator || "Unknown";
            const key=`${entryDate}__${entryShift}__${operator}`;
            if(!map[key]) map[key]={
              date:entryDate, shift:entryShift, operator,
              customers:new Set(), products:new Set(), jobNos:new Set(),
              sheets:[], actualMeters:0,
            };
            const g=map[key];
            if(h.customer) g.customers.add(h.customer);
            if(h.productName) g.products.add(h.productName);
            if(h.jobNo) g.jobNos.add(h.jobNo);
            if(!g.sheets.includes(r)) g.sheets.push(r);
            g.actualMeters+=meters;
          });
        });
        return Object.values(map)
          .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.operator<b.operator?-1:1)
          .map(g=>{
            const shiftMins=g.shift==="Night Shift"?nightMins:dayMins;
            const best=getBestSpeed(g.sheets);
            const runSpeed=best?.runSpeed||null;
            const downtime=best?.downtime||null;
            const targetMeters=(runSpeed&&downtime&&shiftMins)?Math.round((runSpeed*shiftMins)/downtime):null;
            const efficiency=(targetMeters&&g.actualMeters>0)?Math.min(Math.round((g.actualMeters/targetMeters)*100),999):null;
            const rowAvail=Math.round(OEE_SPEED*shiftMins*OEE_AVAIL);
            const oeeRow=(rowAvail>0&&g.actualMeters>0)?Math.min(Math.round((g.actualMeters/rowAvail)*100),999):null;
            return {...g,shiftMins,runSpeed,downtime,targetMeters,efficiency,rowAvail,oeeRow,
              customerList:[...g.customers].join(", "),
              productList:[...g.products].join(", "),
              jobList:[...g.jobNos].join(", ")};
          });
      };
      const shiftRows=buildShiftRows(filtered);
      const jobRows=buildJobRows(filtered);
      const operatorRows=buildOperatorRows(filtered);
      const rows=viewMode==="job"?jobRows:viewMode==="operator"?operatorRows:shiftRows;

      const totalActual=rows.reduce((a,x)=>a+x.actualMeters,0);
      const totalTarget=rows.reduce((a,x)=>a+(x.targetMeters||0),0);
      const avgEff=(totalTarget>0&&totalActual>0)?Math.min(Math.round((totalActual/totalTarget)*100),999):null;

      // ── OEE — Available Meters calculation ───────────────────────────────────
      // (OEE_SPEED and OEE_AVAIL defined above near build functions)

      const workDays = new Set(
        ((shiftTimes&&shiftTimes.workDays)||["Monday","Tuesday","Wednesday","Thursday","Friday"])
        .map(d=>String(d).toLowerCase())
        .filter(d=>d!=="saturday"&&d!=="sunday") // always exclude weekends
      );
      const DAY_NAMES = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

      const countWorkingDaysInMonth = (year, month) => {
        let count = 0;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for(let d = 1; d <= daysInMonth; d++){
          const dayName = DAY_NAMES[new Date(year, month, d).getDay()];
          if(dayName!=="saturday"&&dayName!=="sunday"&&workDays.has(dayName)) count++;
        }
        return count;
      };

      // Count working days across all calendar months in the date range
      let totalWorkingDays = 0;
      try {
        const fromDate = new Date(dateFrom+"T12:00:00");
        const toDate   = new Date(dateTo+"T12:00:00");
        const fromY=fromDate.getFullYear(), fromM=fromDate.getMonth();
        const toY=toDate.getFullYear(),   toM=toDate.getMonth();
        let y=fromY, m=fromM;
        while(y<toY||(y===toY&&m<=toM)){
          totalWorkingDays+=countWorkingDaysInMonth(y,m);
          m++; if(m>11){m=0;y++;}
        }
      } catch(e){ totalWorkingDays=22; }
      if(totalWorkingDays===0) totalWorkingDays=22; // safe fallback

      const avgShiftMins = (dayMins + nightMins) / 2;
      const totalAvailableMeters = Math.round(OEE_SPEED * avgShiftMins * OEE_AVAIL * totalWorkingDays * 2);
      const oee = (totalAvailableMeters > 0 && totalActual > 0)
        ? Math.min(Math.round((totalActual / totalAvailableMeters) * 100), 999)
        : null;

      // ── Excel Export ──────────────────────────────────────────────────────────
      const exportEfficiency=()=>{
        const wb=XLSX.utils.book_new();
        const now=new Date().toLocaleString();
        const mode=viewMode==="job"?"Per Job":viewMode==="operator"?"Per Operator":"Per Shift";

        // ── Colour palette (hex, no #) ──
        const COL = {
          darkBg:   "0D1117", panel:    "161B22", border:   "30363D",
          accent:   "F0A500", success:  "3FB950", danger:   "F85149",
          warn:     "D29922", blue:     "58A6FF", muted:    "8B949E",
          white:    "E6EDF3", black:    "000000",
        };

        const effBg = (e) => e==null?"FFFFFF":e>=90?"3FB950":e>=70?"D29922":"F85149";
        const effFg = (e) => e==null?"8B949E":"FFFFFF";

        // ── Style factories ──
        const st = (opts={}) => ({
          font:      {name:"Calibri",sz:opts.sz||11,bold:!!opts.bold,color:{rgb:opts.fc||COL.black}},
          fill:      opts.bg?{patternType:"solid",fgColor:{rgb:opts.bg}}:{patternType:"none"},
          alignment: {horizontal:opts.align||"left",vertical:"center",wrapText:!!opts.wrap},
          border: {
            top:    {style:"thin",color:{rgb:COL.border}},
            bottom: {style:"thin",color:{rgb:COL.border}},
            left:   {style:"thin",color:{rgb:COL.border}},
            right:  {style:"thin",color:{rgb:COL.border}},
          },
        });

        const cell=(v,opts={})=>({v,t:opts.t||"s",s:st(opts)});
        const num =(v,opts={})=>({v:v||0,t:"n",s:st({...opts,align:opts.align||"right"})});
        const pct =(v,opts={})=>({v:v!=null?v+"%":"—",t:"s",s:st({...opts,align:"center",bold:true,fc:effFg(v),bg:effBg(v)})});

        // ── Helper: write a worksheet from a 2D array of cell objects ──
        const makeSheet=(rows2d,colWidths)=>{
          const ws={};
          let maxR=0,maxC=0;
          rows2d.forEach((row,r)=>{
            row.forEach((c,col)=>{
              if(!c) return;
              const addr=XLSX.utils.encode_cell({r,c:col});
              ws[addr]=c;
              if(r>maxR) maxR=r;
              if(col>maxC) maxC=col;
            });
          });
          ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});
          if(colWidths) ws["!cols"]=colWidths.map(w=>({wch:w}));
          return ws;
        };

        // ════════════════════════════════════════════════════════════
        // SHEET 1 — SUMMARY
        // ════════════════════════════════════════════════════════════
        const titleSt  ={sz:16,bold:true,fc:COL.accent,bg:COL.darkBg};
        const subSt    ={sz:11,fc:COL.muted,bg:COL.darkBg};
        const kSt      ={sz:11,bold:true,fc:COL.muted,bg:COL.panel};
        const vSt      ={sz:11,fc:COL.white,bg:COL.panel};

        const summaryRows=[
          [cell("CONCORD PACKAGING — EFFICIENCY REPORT",{...titleSt,align:"center"}),null,null],
          [cell(`Generated: ${now}`,{...subSt}),null,null],
          [null],
          [cell("Period",kSt),   cell(`${dateFrom}  →  ${dateTo}`,vSt)],
          [cell("View Mode",kSt),cell(mode,vSt)],
          [cell("Shift Filter",kSt), cell(filterShift==="all"?"All Shifts":filterShift,vSt)],
          [cell("Operator",kSt), cell(filterOperator==="all"?"All Operators":filterOperator,vSt)],
          [cell("Customer",kSt), cell(filterCustomer==="all"?"All Customers":filterCustomer,vSt)],
          [null],
          [cell("RESULTS",{sz:12,bold:true,fc:COL.accent,bg:COL.darkBg}),null],
          [cell(viewMode==="job"?"Jobs Analysed":"Shifts Analysed",kSt), num(rows.length,{fc:COL.blue,bg:COL.panel,align:"left"})],
          [cell("Total Actual Meters",kSt), num(Math.round(totalActual),{fc:COL.white,bg:COL.panel,align:"left"})],
          [cell("Total Target Meters",kSt), num(totalTarget||0,{fc:COL.muted,bg:COL.panel,align:"left"})],
          [cell("Available Meters (OEE base)",kSt), num(totalAvailableMeters,{fc:COL.blue,bg:COL.panel,align:"left"})],
          [cell("Working Days in Period",kSt), num(totalWorkingDays,{fc:COL.muted,bg:COL.panel,align:"left"})],
          [cell("OEE Formula",{...kSt}), cell("140 m/min × 80% uptime × shifts",{...vSt,fc:COL.muted})],
          [cell("Efficiency (vs Target)",{...kSt,bold:true}), pct(avgEff)],
          [cell("OEE (vs Available)",{...kSt,bold:true}), pct(oee)],
        ];

        const sumWs=makeSheet(summaryRows,[30,28]);
        // Merge title row
        sumWs["!merges"]=[{s:{r:0,c:0},e:{r:0,c:2}}];
        XLSX.utils.book_append_sheet(wb,sumWs,"Summary");

        // ════════════════════════════════════════════════════════════
        // SHEET 2 — DETAIL (Per Shift or Per Job)
        // ════════════════════════════════════════════════════════════
        const hdrSt={sz:10,bold:true,fc:COL.white,bg:COL.darkBg,align:"center"};
        const hdrRt={sz:10,bold:true,fc:COL.white,bg:COL.darkBg,align:"right"};
        const rowEv={sz:11,fc:COL.white,bg:COL.panel};
        const rowOd={sz:11,fc:COL.white,bg:"1C2128"};
        const rowRt=(bg)=>({sz:11,fc:COL.white,bg,align:"right"});
        const totSt={sz:11,bold:true,fc:COL.accent,bg:COL.darkBg};
        const totRt={sz:11,bold:true,fc:COL.accent,bg:COL.darkBg,align:"right"};

        if(viewMode==="shift"){
          const hdr=[
            cell("Date",hdrSt),cell("Shift",hdrSt),cell("Job No(s)",hdrSt),
            cell("Customer",hdrSt),cell("Product(s)",hdrSt),cell("Operator(s)",hdrSt),
            cell("Run Speed",hdrRt),cell("Downtime",hdrRt),
            cell("Target (m)",hdrRt),cell("Available (m)",hdrRt),cell("Actual (m)",hdrRt),cell("Efficiency",{...hdrSt,align:"center"}),cell("OEE",{...hdrSt,align:"center"}),
          ];
          const dataRows=[hdr];
          shiftRows.forEach((g,i)=>{
            const bg=i%2===0?rowEv.bg:rowOd.bg;
            const r={sz:11,fc:COL.white,bg};
            const rr={sz:11,fc:COL.white,bg,align:"right"};
            const rowAvail=Math.round(OEE_SPEED*(g.shift==="Night Shift"?nightMins:dayMins)*OEE_AVAIL);
            const rowOee=(rowAvail>0&&g.actualMeters>0)?Math.min(Math.round((g.actualMeters/rowAvail)*100),999):null;
            dataRows.push([
              cell(g.date,{...r,bold:true,fc:COL.accent}),
              cell(g.shift==="Night Shift"?"🌙 Night":"☀ Day",{...r,fc:g.shift==="Night Shift"?COL.blue:COL.accent}),
              cell(g.jobList||"—",{...r,fc:COL.accent}),
              cell(g.customerList||"—",r),
              cell(g.productList||"—",{...r,fc:COL.muted}),
              cell(g.operatorList||"—",{...r,fc:COL.muted}),
              g.runSpeed?num(g.runSpeed,rr):cell("⚠ not set",{...r,fc:COL.warn,align:"right"}),
              g.downtime?num(g.downtime,rr):cell("—",{...r,align:"right"}),
              g.targetMeters!=null?num(g.targetMeters,rr):cell("—",{...r,align:"right"}),
              num(rowAvail,{...rr,fc:COL.blue}),
              num(Math.round(g.actualMeters)||0,{...rr,bold:true}),
              pct(g.efficiency),
              pct(rowOee),
            ]);
          });
          dataRows.push(Array(13).fill(null));
          dataRows.push([
            cell("TOTALS / OVERALL",totSt),null,null,null,null,null,null,null,
            num(totalTarget||0,totRt),
            num(totalAvailableMeters,{...totRt,fc:COL.blue}),
            num(Math.round(totalActual),{...totRt,fc:COL.white}),
            pct(avgEff),pct(oee),
          ]);
          const detWs=makeSheet(dataRows,[12,12,18,22,30,22,12,10,12,12,12,12,10]);
          XLSX.utils.book_append_sheet(wb,detWs,"Per Shift");

        } else {
          const hdr=[
            cell("Job No",hdrSt),cell("Date Range",hdrSt),cell("Shifts",hdrRt),
            cell("Customer",hdrSt),cell("Product(s)",hdrSt),cell("Operator(s)",hdrSt),
            cell("Run Speed",hdrRt),cell("Downtime",hdrRt),
            cell("Target (m)",hdrRt),cell("Available (m)",hdrRt),cell("Actual (m)",hdrRt),cell("Efficiency",{...hdrSt,align:"center"}),cell("OEE",{...hdrSt,align:"center"}),
          ];
          const dataRows=[hdr];
          jobRows.forEach((g,i)=>{
            const bg=i%2===0?rowEv.bg:rowOd.bg;
            const r={sz:11,fc:COL.white,bg};
            const rr={sz:11,fc:COL.white,bg,align:"right"};
            const rowAvail=Math.round(OEE_SPEED*g.totalShiftMins*OEE_AVAIL);
            const rowOee=(rowAvail>0&&g.actualMeters>0)?Math.min(Math.round((g.actualMeters/rowAvail)*100),999):null;
            dataRows.push([
              cell(g.jobNo,{...r,bold:true,fc:COL.accent}),
              cell(g.dateRange||"—",{...r,fc:COL.blue}),
              num(g.numShifts,rr),
              cell(g.customerList||"—",r),
              cell(g.productList||"—",{...r,fc:COL.muted}),
              cell(g.operatorList||"—",{...r,fc:COL.muted}),
              g.runSpeed?num(g.runSpeed,rr):cell("⚠ not set",{...r,fc:COL.warn,align:"right"}),
              g.downtime?num(g.downtime,rr):cell("—",{...r,align:"right"}),
              g.targetMeters!=null?num(g.targetMeters,rr):cell("—",{...r,align:"right"}),
              num(rowAvail,{...rr,fc:COL.blue}),
              num(Math.round(g.actualMeters)||0,{...rr,bold:true}),
              pct(g.efficiency),
              pct(rowOee),
            ]);
          });
          dataRows.push(Array(13).fill(null));
          dataRows.push([
            cell("TOTALS / OVERALL",totSt),null,null,null,null,null,null,null,
            num(totalTarget||0,totRt),
            num(totalAvailableMeters,{...totRt,fc:COL.blue}),
            num(Math.round(totalActual),{...totRt,fc:COL.white}),
            pct(avgEff),pct(oee),
          ]);
          const detWs=makeSheet(dataRows,[16,18,8,22,30,22,12,10,12,12,12,12,10]);
          XLSX.utils.book_append_sheet(wb,detWs,"Per Job");
        }
        if(viewMode==="operator"){
          const hdr=[
            cell("Date",hdrSt),cell("Shift",hdrSt),cell("Operator",hdrSt),
            cell("Job(s)",hdrSt),cell("Customer",hdrSt),cell("Product(s)",hdrSt),
            cell("Run Speed",hdrRt),cell("Downtime",hdrRt),
            cell("Target (m)",hdrRt),cell("Available (m)",hdrRt),cell("Actual (m)",hdrRt),cell("Efficiency",{...hdrSt,align:"center"}),cell("OEE",{...hdrSt,align:"center"}),
          ];
          const dataRows=[hdr];
          operatorRows.forEach((g,i)=>{
            const bg=i%2===0?rowEv.bg:rowOd.bg;
            const r={sz:11,fc:COL.white,bg};
            const rr={sz:11,fc:COL.white,bg,align:"right"};
            dataRows.push([
              cell(g.date,{...r,bold:true,fc:COL.accent}),
              cell(g.shift==="Night Shift"?"🌙 Night":"☀ Day",{...r,fc:g.shift==="Night Shift"?COL.blue:COL.accent}),
              cell(g.operator,{...r,bold:true,fc:"3FB950"}),
              cell(g.jobList||"—",{...r,fc:COL.accent}),
              cell(g.customerList||"—",r),
              cell(g.productList||"—",{...r,fc:COL.muted}),
              g.runSpeed?num(g.runSpeed,rr):cell("⚠ not set",{...r,fc:COL.warn,align:"right"}),
              g.downtime?num(g.downtime,rr):cell("—",{...r,align:"right"}),
              g.targetMeters!=null?num(g.targetMeters,rr):cell("—",{...r,align:"right"}),
              num(g.rowAvail||0,{...rr,fc:COL.blue}),
              num(Math.round(g.actualMeters)||0,{...rr,bold:true}),
              pct(g.efficiency),
              pct(g.oeeRow),
            ]);
          });
          dataRows.push(Array(13).fill(null));
          dataRows.push([
            cell("TOTALS / OVERALL",totSt),null,null,null,null,null,null,null,
            num(totalTarget||0,totRt),
            num(totalAvailableMeters,{...totRt,fc:COL.blue}),
            num(Math.round(totalActual),{...totRt,fc:COL.white}),
            pct(avgEff),pct(oee),
          ]);
          const detWs=makeSheet(dataRows,[12,12,18,16,22,30,12,10,12,12,12,12,10]);
          XLSX.utils.book_append_sheet(wb,detWs,"Per Operator");
        }

        XLSX.writeFile(wb,`Efficiency-Report-${dateFrom}-to-${dateTo}-${mode.replace(" ","-")}.xlsx`);
      };

      const TH2=(label,right=false)=>(
        <th style={{padding:"8px 10px",textAlign:right?"right":"left",color:C.muted,fontSize:10,fontWeight:700,letterSpacing:"0.06em",whiteSpace:"nowrap",borderBottom:`2px solid ${C.border}`,background:C.bg}}>{label}</th>
      );

      return <div>
        <PH title="Efficiency Report" sub="Printing press efficiency vs target speed" />

        {/* ── Detailed debug ── */}
        {(()=>{
          const dbPS=Array.isArray(appLists.product_speeds);
          const psLen=dbPS?appLists.product_speeds.length:0;
          const sample=allProd[0]?.data?.header||{};
          const exactMatch=productSpeeds.find(s=>s.customer?.toLowerCase().trim()===sample.customer?.toLowerCase().trim()&&s.product?.toLowerCase().trim()===sample.productName?.toLowerCase().trim());
          const prodMatch=productSpeeds.find(s=>s.product?.toLowerCase().trim()===sample.productName?.toLowerCase().trim());
          return <div style={{background:"#1a1a2e",border:"1px solid #444",borderRadius:6,padding:"10px 14px",marginBottom:12,fontSize:10,color:"#aaa",fontFamily:"monospace"}}>
            <div>DB product_speeds: <strong style={{color:dbPS?"#3fb950":"#f85149"}}>{dbPS?`YES (${psLen} entries)`:"NO — using defaults"}</strong></div>
            <div>Sample record: customer=<strong style={{color:"#58a6ff"}}>"{sample.customer}"</strong> product=<strong style={{color:"#58a6ff"}}>"{sample.productName}"</strong></div>
            <div>Exact match: <strong style={{color:exactMatch?"#3fb950":"#f85149"}}>{exactMatch?`✔ ${exactMatch.runSpeed}m/min`:"✕ none"}</strong></div>
            <div>Product-only match: <strong style={{color:prodMatch?"#3fb950":"#f85149"}}>{prodMatch?`✔ ${prodMatch.runSpeed}m/min (customer: ${prodMatch.customer})`:"✕ none"}</strong></div>
            {dbPS&&psLen>0&&<div>First DB entry: customer="{appLists.product_speeds[0]?.customer}" product="{appLists.product_speeds[0]?.product}" speed={appLists.product_speeds[0]?.runSpeed}</div>}
          </div>;
        })()}
        {(()=>{
          const unmatched=new Map();
          allProd.forEach(r=>{
            const h=r.data?.header||{};
            if(!h.customer||!h.productName) return;
            const key=`${h.customer}||${h.productName}`;
            if(!unmatched.has(key)){
              const custL=h.customer.toLowerCase().trim();
              const prodL=h.productName.toLowerCase().trim();
              let found=productSpeeds.find(s=>
                s.customer?.toLowerCase().trim()===custL&&
                s.product?.toLowerCase().trim()===prodL
              );
              if(!found&&prodL) found=productSpeeds.find(s=>s.product?.toLowerCase().trim()===prodL);
              if(!found) unmatched.set(key,{customer:h.customer,product:h.productName});
            }
          });
          if(unmatched.size===0) return null;
          return <div style={{background:C.warn+"11",border:`1px solid ${C.warn}33`,borderRadius:6,padding:"10px 14px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:C.warn,marginBottom:6}}>⚠ {unmatched.size} customer/product combination{unmatched.size>1?"s":""} not found in Product Speeds — add them in Lists / Settings → Product Speeds:</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {[...unmatched.values()].map(({customer,product})=>(
                <div key={customer+product} style={{fontSize:10,padding:"3px 8px",background:C.warn+"22",borderRadius:4,color:C.warn}}>
                  {customer} / {product}
                </div>
              ))}
            </div>
          </div>;
        })()}

        {/* ── Filters ── */}
        <div style={S.card}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:10}}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em"}}>FILTERS</div>
            <div style={{display:"flex",gap:6}}>
              {[["shift","Per Shift","☀"],["job","Per Job","📋"],["operator","Per Operator","👤"]].map(([mode,label,icon])=>(
                <button key={mode} onClick={()=>setViewMode(mode)} style={{
                  padding:"6px 16px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700,
                  background:viewMode===mode?C.accent:C.panel,color:viewMode===mode?"#fff":C.muted,
                  outline:viewMode===mode?"none":`1px solid ${C.border}`,transition:"all 0.12s"
                }}>{icon} {label}</button>
              ))}
            </div>
          </div>

          {/* Quick presets */}
          <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:C.muted,alignSelf:"center",marginRight:4}}>Quick:</span>
            {[["Today",0],["Last 7 days",7],["Last 14 days",14],["Last 30 days",30],["Last 90 days",90]].map(([label,days])=>(
              <button key={label} style={S.btn("ghost",{padding:"4px 12px",fontSize:11})} onClick={()=>days===0?(setDateFrom(todayStr()),setDateTo(todayStr())):setPreset(days)}>{label}</button>
            ))}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:10}}>
            <F label="Date From"><input type="date" style={{...S.input,background:"#e8eaed",color:"#1a1a1a",colorScheme:"light"}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)} /></F>
            <F label="Date To"><input type="date" style={{...S.input,background:"#e8eaed",color:"#1a1a1a",colorScheme:"light"}} value={dateTo} onChange={e=>setDateTo(e.target.value)} /></F>
            <F label="Shift">
              <select style={S.input} value={filterShift} onChange={e=>setFilterShift(e.target.value)}>
                <option value="all">All Shifts</option>
                <option value="Day Shift">Day Shift</option>
                <option value="Night Shift">Night Shift</option>
              </select>
            </F>
            <F label="Operator">
              <select style={S.input} value={filterOperator} onChange={e=>setFilterOperator(e.target.value)}>
                <option value="all">All Operators</option>
                {allOperators.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </F>
            <F label="Customer">
              <select style={S.input} value={filterCustomer} onChange={e=>setFilterCustomer(e.target.value)}>
                <option value="all">All Customers</option>
                {allCustomers.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </F>
          </div>
        </div>

        {/* ── Summary cards ── */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10,marginBottom:16}}>
          {[
            {label:viewMode==="job"?"JOBS":viewMode==="operator"?"OPERATOR SHIFTS":"SHIFTS",     value:rows.length,                              color:C.blue},
            {label:"ACTUAL METERS",                       value:Math.round(totalActual).toLocaleString()+" m", color:C.text},
            {label:"TARGET METERS",                       value:totalTarget?totalTarget.toLocaleString()+" m":"—", color:C.muted},
            {label:"AVAILABLE METERS",  value:totalAvailableMeters.toLocaleString()+" m", color:C.blue, tip:`${totalWorkingDays} working days × 2 shifts × ${OEE_SPEED} m/min × ${Math.round(OEE_AVAIL*100)}% uptime`},
            {label:"EFFICIENCY (vs Target)", value:avgEff!==null?avgEff+"%":"—", color:avgEff!==null?effColor(avgEff):C.muted},
            {label:"OEE (vs Available)",     value:oee!==null?oee+"%":"—",       color:oee!==null?effColor(oee):C.muted, tip:`Actual ÷ Available (${totalWorkingDays} working days, ${dateFrom} to ${dateTo})`},
          ].map(({label,value,color,tip})=>(
            <div key={label} style={{...S.card,textAlign:"center",padding:14,marginBottom:0}} title={tip||""}>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.08em",marginBottom:6}}>{label}</div>
              <div style={{fontSize:22,fontWeight:800,color}}>{value}</div>
            </div>
          ))}
        </div>

        {/* ── Overall bars ── */}
        {(avgEff!==null||oee!==null)&&(
          <div style={{...S.card,marginBottom:16,padding:14}}>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {avgEff!==null&&<div style={{display:"flex",alignItems:"center",gap:14}}>
                <div style={{fontSize:10,color:C.muted,fontWeight:600,flexShrink:0,width:120}}>EFFICIENCY (TARGET)</div>
                <div style={{flex:1,height:16,background:C.border,borderRadius:8,overflow:"hidden"}}>
                  <div style={{width:`${Math.min(avgEff,100)}%`,height:"100%",background:effColor(avgEff),borderRadius:8,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:6,transition:"width 0.5s"}}>
                    {avgEff>=15&&<span style={{fontSize:10,fontWeight:700,color:"#fff"}}>{avgEff}%</span>}
                  </div>
                </div>
                {avgEff<15&&<span style={{fontSize:14,fontWeight:800,color:effColor(avgEff),minWidth:44}}>{avgEff}%</span>}
              </div>}
              {oee!==null&&<div style={{display:"flex",alignItems:"center",gap:14}}>
                <div style={{fontSize:10,color:C.muted,fontWeight:600,flexShrink:0,width:120}}>OEE (AVAILABLE)</div>
                <div style={{flex:1,height:16,background:C.border,borderRadius:8,overflow:"hidden"}}>
                  <div style={{width:`${Math.min(oee,100)}%`,height:"100%",background:effColor(oee),borderRadius:8,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:6,transition:"width 0.5s"}}>
                    {oee>=15&&<span style={{fontSize:10,fontWeight:700,color:"#fff"}}>{oee}%</span>}
                  </div>
                </div>
                {oee<15&&<span style={{fontSize:14,fontWeight:800,color:effColor(oee),minWidth:44}}>{oee}%</span>}
              </div>}
              <div style={{fontSize:10,color:C.muted,paddingTop:4,borderTop:`1px solid ${C.border}`}}>
                <span style={{color:C.success}}>■</span> ≥90% &nbsp;
                <span style={{color:C.warn}}>■</span> ≥70% &nbsp;
                <span style={{color:C.danger}}>■</span> &lt;70% &nbsp;&nbsp;
                Available meters: {totalWorkingDays} working days ({dateFrom} → {dateTo}) × 2 shifts × {OEE_SPEED} m/min × {Math.round(OEE_AVAIL*100)}% uptime
              </div>
            </div>
          </div>
        )}

        {/* ── Table ── */}
        {rows.length===0
          ?<div style={{...S.card,textAlign:"center",padding:40,color:C.muted}}>No production records found for the selected filters.</div>
          :<div style={S.card}>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
              <button style={{...S.btn("accent",{padding:"7px 18px",fontSize:12}),background:C.success}} onClick={exportEfficiency}>↓ Export to Excel</button>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr>
                    {viewMode==="shift"?<>
                      {TH2("Date")}{TH2("Shift")}{TH2("Job(s)")}{TH2("Customer")}{TH2("Product(s)")}{TH2("Operator(s)")}{TH2("Speed",true)}{TH2("DT",true)}{TH2("Target (m)",true)}{TH2("Available (m)",true)}{TH2("Actual (m)",true)}{TH2("Efficiency")}{TH2("OEE")}
                    </>:viewMode==="operator"?<>
                      {TH2("Date")}{TH2("Shift")}{TH2("Operator")}{TH2("Job(s)")}{TH2("Customer")}{TH2("Product(s)")}{TH2("Speed",true)}{TH2("DT",true)}{TH2("Target (m)",true)}{TH2("Available (m)",true)}{TH2("Actual (m)",true)}{TH2("Efficiency")}{TH2("OEE")}
                    </>:<>
                      {TH2("Job No")}{TH2("Date Range")}{TH2("Shifts",true)}{TH2("Customer")}{TH2("Product(s)")}{TH2("Operator(s)")}{TH2("Speed",true)}{TH2("DT",true)}{TH2("Target (m)",true)}{TH2("Available (m)",true)}{TH2("Actual (m)",true)}{TH2("Efficiency")}{TH2("OEE")}
                    </>}
                  </tr>
                </thead>
                <tbody>
                  {viewMode==="shift"
                    ?shiftRows.map((g,i)=>{
                      const rowAvail=Math.round(OEE_SPEED*(g.shift==="Night Shift"?nightMins:dayMins)*OEE_AVAIL);
                      // OEE = actual vs theoretical machine ceiling (never shows >100% as it's a ceiling)
                      const rowOee=(rowAvail>0&&g.actualMeters>0)?Math.min(Math.round((g.actualMeters/rowAvail)*100),999):null;
                      return (
                      <tr key={g.date+g.shift+(g.isOldRecord?"_old":"")} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"transparent":C.panel+"44"}}>
                        <td style={{padding:"8px 10px",color:C.text,whiteSpace:"nowrap",fontWeight:600}}>{g.date}</td>
                        <td style={{padding:"8px 10px",whiteSpace:"nowrap"}}>
                          <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:g.shift==="Night Shift"?C.blue+"33":C.accent+"33",color:g.shift==="Night Shift"?C.blue:C.accent,fontWeight:700}}>
                            {g.shift==="Night Shift"?"🌙 Night":"☀ Day"}
                          </span>
                        </td>
                        <td style={{padding:"8px 10px",color:C.accent,fontSize:11}}>{g.jobList||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.text,fontSize:11}}>{g.customerList||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.muted,fontSize:11,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={g.productList}>{g.productList||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.muted,fontSize:11}}>{g.operatorList||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.text,textAlign:"right",whiteSpace:"nowrap"}}>
                          {g.sheets.length>1?<span style={{color:C.blue,fontSize:10}}>weighted</span>:g.runSpeed?`${g.runSpeed} m/min`:<span style={{color:C.warn,fontSize:10}}>⚠ not set</span>}
                        </td>
                        <td style={{padding:"8px 10px",color:C.text,textAlign:"right"}}>{g.sheets.length>1?"—":g.downtime||"—"}</td>
                        <td style={{padding:"8px 10px",color:C.muted,textAlign:"right"}}>{g.targetMeters!=null?g.targetMeters.toLocaleString():"—"}</td>
                        <td style={{padding:"8px 10px",color:C.blue,textAlign:"right",fontWeight:600}}>{rowAvail.toLocaleString()}</td>
                        <td style={{padding:"8px 10px",color:C.text,fontWeight:700,textAlign:"right"}}>{g.actualMeters>0?Math.round(g.actualMeters).toLocaleString():"—"}</td>
                        <td style={{padding:"8px 10px",minWidth:110}}>{g.efficiency!==null
                          ?<div style={{display:"flex",alignItems:"center",gap:6}}>
                              <div style={{flex:1,height:8,background:C.border,borderRadius:4,overflow:"hidden"}}>
                                <div style={{width:`${Math.min(g.efficiency,100)}%`,height:"100%",background:effColor(g.efficiency),borderRadius:4}} />
                              </div>
                              <span style={{color:effColor(g.efficiency),fontWeight:800,fontSize:12,minWidth:40,textAlign:"right"}}>{g.efficiency}%</span>
                            </div>
                          :g.isOldRecord
                            ?<span style={{color:C.muted,fontSize:10}}>— no sign-off data</span>
                            :<div><div style={{color:C.warn,fontSize:10,fontWeight:600}}>⚠ no speed data</div><div style={{color:C.muted,fontSize:9,marginTop:2}}>{[...g.customers].map((c,ci)=>{ const prod=[...g.products][ci]||[...g.products][0]||""; return <div key={ci}>"{c}" / "{prod}"</div>; })}</div></div>
                        }</td>
                        <td style={{padding:"8px 10px",minWidth:100}}>{rowOee!==null
                          ?<div style={{display:"flex",alignItems:"center",gap:6}}>
                              <div style={{flex:1,height:8,background:C.border,borderRadius:4,overflow:"hidden"}}>
                                <div style={{width:`${Math.min(rowOee,100)}%`,height:"100%",background:effColor(rowOee),borderRadius:4}} />
                              </div>
                              <span style={{color:effColor(rowOee),fontWeight:800,fontSize:12,minWidth:40,textAlign:"right"}}>{rowOee}%</span>
                            </div>
                          :<span style={{color:C.muted,fontSize:10}}>—</span>
                        }</td>
                      </tr>
                      );
                    })
                    :viewMode==="operator"
                    ?operatorRows.map((g,i)=>(
                      <tr key={g.date+g.shift+g.operator} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"transparent":C.panel+"44"}}>
                        <td style={{padding:"8px 10px",color:C.text,whiteSpace:"nowrap",fontWeight:600}}>{g.date}</td>
                        <td style={{padding:"8px 10px",whiteSpace:"nowrap"}}>
                          <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:g.shift==="Night Shift"?C.blue+"33":C.accent+"33",color:g.shift==="Night Shift"?C.blue:C.accent,fontWeight:700}}>
                            {g.shift==="Night Shift"?"🌙 Night":"☀ Day"}
                          </span>
                        </td>
                        <td style={{padding:"8px 10px",color:C.success,fontWeight:700,whiteSpace:"nowrap"}}>{g.operator}</td>
                        <td style={{padding:"8px 10px",color:C.accent,fontSize:11}}>{g.jobList||"—"}</td>

    // ── Approval PIN Prompt ───────────────────────────────────────────────────
    function ApprovalPinPrompt({label,onConfirm,btnColor="accent"}){
      const [un,setUn]=useState(""); const [pin,setPin]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
      const go=async()=>{
        if(!un.trim()||!pin.trim()){ setErr("Username and PIN required."); return; }
        setBusy(true); setErr("");
        const res=await verifyPin(un.trim(),pin.trim());
        setBusy(false);
        if(!res.ok){ setErr(res.msg); return; }
        onConfirm(res.name);
        setUn(""); setPin(""); setErr("");
      };
      return <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginTop:8}}>
        <NoFillInput style={{...S.input,width:130,padding:"5px 8px",fontSize:11}} value={un} onChange={e=>setUn(e.target.value)} placeholder="Username" onKeyDown={e=>e.key==="Enter"&&go()} />
        <NoFillInput secret inputMode="numeric" style={{...S.input,width:80,padding:"5px 8px",fontSize:11}} value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN" onKeyDown={e=>e.key==="Enter"&&go()} />
        <button style={S.btn(btnColor,{padding:"5px 14px",fontSize:11})} onClick={go} disabled={busy}>{busy?"…":label}</button>
        {err&&<span style={{fontSize:11,color:C.danger,fontWeight:600}}>{err}</span>}
      </div>;
    }
