    function DT({title,rows,cols,sumCols=[]}){
      if(!rows?.length) return null;
      const colLabels={material:"Material",batchNo:"Batch No.",qty:"Qty",unit:"Unit",meters:"Meters",inkLabel:"Ink Code",inkType:"Type",batchNo:"Batch No.",supplier:"Supplier",returned:"Returned",solvent:"Solvent"};
      const totals={};
      if(sumCols.length){
        sumCols.forEach(col=>{
          const sum=rows.reduce((acc,r)=>acc+parseFloat(r[col]||0),0);
          totals[col]=sum%1===0?sum:parseFloat(sum.toFixed(3));
        });
      }
      return <div style={{marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:6}}>{title.toUpperCase()}</div>
        <div style={{display:"flex",gap:4,marginBottom:4}}>{cols.map(c=><div key={c} style={{flex:1,fontSize:10,color:C.muted,textTransform:"capitalize"}}>{c.replace(/([A-Z])/g," $1")}</div>)}</div>
        {rows.map((r,i)=><div key={i} style={{display:"flex",gap:4,padding:"3px 0",borderTop:`1px solid ${C.border}`}}>
          {cols.map(c=><div key={c} style={{flex:1,color:C.text}}>{r[c]||"—"}</div>)}
        </div>)}
        {sumCols.length>0&&(
          <div style={{display:"flex",gap:4,padding:"5px 0",borderTop:`2px solid ${C.border}`,marginTop:2}}>
            {cols.map(c=>(
              <div key={c} style={{flex:1,color:sumCols.includes(c)?C.accent:C.muted,fontWeight:sumCols.includes(c)?700:400,fontSize:11}}>
                {sumCols.includes(c)?`Σ ${totals[c]}`:""}
              </div>
            ))}
          </div>
        )}
      </div>;
    }

    // ── User Management ───────────────────────────────────────────────────────
    const SHEET_OPTIONS=[
      {id:"dashboard",label:"Dashboard"},{id:"production",label:"Daily Production Printing"},
      {id:"viscosity",label:"Viscosity QC"},{id:"printingqc",label:"Printing QC"},
      {id:"lamination",label:"Lamination"},{id:"laminationqc",label:"Lamination QC"},
      {id:"extruder1",label:"Extruder 1"},{id:"extruder1qc",label:"Extruder 1 QC"},
      {id:"extruder2",label:"Extruder 2"},{id:"extruder2qc",label:"Extruder 2 QC"},
      {id:"slitting1",label:"Slitting 1"},{id:"slitting1qc",label:"Slitting 1 QC"},
      {id:"slitting2",label:"Slitting 2"},{id:"slitting2qc",label:"Slitting 2 QC"},
      {id:"bagmaking1",label:"Bag Making 1"},{id:"bagmaking1qc",label:"Bag Making 1 QC"},
      {id:"bagmaking2",label:"Bag Making 2"},{id:"bagmaking2qc",label:"Bag Making 2 QC"},
      {id:"bagmaking3",label:"Bag Making 3"},{id:"bagmaking3qc",label:"Bag Making 3 QC"},
      {id:"bagmaking4",label:"Bag Making 4"},{id:"bagmaking4qc",label:"Bag Making 4 QC"},
      {id:"records",label:"All Records"},{id:"lists",label:"Lists / Settings"},{id:"password",label:"Change Password"},
    ];

    function UserMgmt({users,session,reload,flash}){
      const [form,setForm]=useState({username:"",password:"",name:"",role:"operator"});
      const [err,setErr]=useState("");
      const [editId,setEditId]=useState(null); const [editPerms,setEditPerms]=useState({});
      const [resetId,setResetId]=useState(null); const [resetPw,setResetPw]=useState("");
      const f=(k,v)=>setForm(p=>({...p,[k]:v}));
      const add=async()=>{
        if(!form.username||!form.password||!form.name){ setErr("All fields required."); return; }
        if(users.find(u=>u.username===form.username)){ setErr("Username taken."); return; }
        const perms=form.role==="admin"?null:(ROLE_DEFAULTS[form.role]||["dashboard","records"]);
        const {error}=await dbAddUser({username:form.username,password:form.password,name:form.name,role:form.role,permissions:perms});
        if(error){ setErr("Error: "+error.message); return; }
        setForm({username:"",password:"",name:"",role:"operator"}); setErr(""); await reload(); flash("User added.");
      };
      const del=async id=>{ if(id===session.id){ alert("Cannot delete yourself."); return; } await dbDelUser(id); await reload(); flash("User deleted."); };
      const startEdit=(u)=>{ setEditId(u.id); const perms=u.permissions||ROLE_DEFAULTS[u.role]||["dashboard","records"]; setEditPerms(Object.fromEntries(perms.map(p=>[p,true]))); };
      const savePerms=async(u)=>{ const perms=SHEET_OPTIONS.map(s=>s.id).filter(id=>editPerms[id]); await sb.from("users").update({permissions:perms}).eq("id",u.id); await reload(); setEditId(null); flash("Permissions updated."); };
      const doReset=async(u)=>{ if(!resetPw.trim()){ flash("Password cannot be empty.","danger"); return; } await sb.from("users").update({password:resetPw}).eq("id",u.id); setResetId(null); setResetPw(""); await reload(); flash(`Password reset for ${u.name}.`); };
      const togglePerm=(id)=>setEditPerms(p=>({...p,[id]:!p[id]}));
      const rc=r=>r==="admin"?C.accent2:r==="manager"?C.accent:r==="qc"?C.blue:r==="viewer"?C.muted:C.success;
      return <div>
        <PH title="User Management" sub="Control user roles and which sheets each user can access" />
        <SC title="Add New User">
          <Grid cols={4}>
            <F label="Full Name"><TI value={form.name}     onChange={v=>f("name",v)} /></F>
            <F label="Username"><TI value={form.username}  onChange={v=>f("username",v)} /></F>
            <F label="Password"><TI value={form.password}  onChange={v=>f("password",v)} /></F>
            <F label="Role"><TS value={form.role} onChange={v=>f("role",v)} options={["admin","manager","operator","qc","viewer"]} /></F>
          </Grid>
          {err&&<div style={{color:C.danger,fontSize:12,marginTop:8}}>{err}</div>}
          <button style={{...S.btn("accent"),marginTop:12}} onClick={add}>Add User</button>
        </SC>
        <SC title="Current Users & Permissions">
          {users.map(u=>(
            <div key={u.id} style={{borderBottom:`1px solid ${C.border}`,padding:"14px 0"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:160}}>
                  <div style={{color:C.text,fontWeight:600,fontSize:13}}>{u.name}</div>
                  <div style={{color:C.muted,fontSize:11,marginTop:2}}>{u.username}</div>
                </div>
                <span style={{fontSize:10,padding:"2px 10px",borderRadius:4,background:rc(u.role)+"33",color:rc(u.role),fontWeight:700}}>{u.role.toUpperCase()}</span>
                {u.role!=="admin"&&<button style={S.btn("ghost",{padding:"4px 12px",fontSize:11,color:C.blue,outline:`1px solid ${C.blue}`})} onClick={()=>editId===u.id?setEditId(null):startEdit(u)}>{editId===u.id?"Cancel":"✎ Edit Permissions"}</button>}
                {u.id!==session.id&&<button style={S.btn("ghost",{padding:"4px 12px",fontSize:11,color:C.warn,outline:`1px solid ${C.warn}`})} onClick={()=>{ setResetId(resetId===u.id?null:u.id); setResetPw(""); }}>{resetId===u.id?"Cancel":"🔑 Reset Password"}</button>}
                {u.id!==session.id&&<button style={S.btn("danger",{padding:"4px 10px",fontSize:11})} onClick={()=>del(u.id)}>Delete</button>}
              </div>
              {resetId===u.id&&(
                <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",padding:12,background:C.bg,borderRadius:6,border:`1px solid ${C.warn}`}}>
                  <span style={{fontSize:11,color:C.warn,fontWeight:600,flexShrink:0}}>New password for {u.name}:</span>
                  <input style={{...S.input,maxWidth:220,padding:"5px 10px"}} type="text" value={resetPw} placeholder="Enter new password" onChange={e=>setResetPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doReset(u)} />
                  <button style={{...S.btn("accent",{padding:"5px 16px",fontSize:12}),background:C.warn}} onClick={()=>doReset(u)}>Save</button>
                </div>
              )}
              {editId!==u.id&&u.role!=="admin"&&(
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
                  {(u.permissions||ROLE_DEFAULTS[u.role]||[]).map(p=>{ const tab=ALL_TABS.find(t=>t.id===p); return tab?<span key={p} style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:`${C.accent}22`,color:C.accent}}>{tab.icon} {tab.label}</span>:null; })}
                </div>
              )}
              {editId===u.id&&(
                <div style={{marginTop:12,padding:14,background:C.bg,borderRadius:8,border:`1px solid ${C.border}`}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:10}}>SELECT ACCESSIBLE SHEETS</div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
                    {SHEET_OPTIONS.map(s=>(
                      <button key={s.id} onClick={()=>togglePerm(s.id)} style={{padding:"6px 14px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,background:editPerms[s.id]?C.accent:C.panel,color:editPerms[s.id]?"#fff":C.muted,outline:editPerms[s.id]?"none":`1px solid ${C.border}`,transition:"all 0.12s"}}>{s.label}</button>
                    ))}
                  </div>
                  <button style={S.btn("accent",{padding:"6px 20px",fontSize:12})} onClick={()=>savePerms(u)}>Save Permissions</button>
                </div>
              )}
            </div>
          ))}
        </SC>
      </div>;
    }

    // ── Lists Manager ─────────────────────────────────────────────────────────
    function ListsManager({appLists,reload,flash}){
      const [activeList,setActiveList]=useState("substrate");
      const [items,setItems]=useState([]);
      const [newVal,setNewVal]=useState(""); const [newCode,setNewCode]=useState("");
      const [saving,setSaving]=useState(false);
      const isInkCode=activeList==="ink_code";
      const isChecklist=["printing_qc_checks","lamination_qc_checks","extruder_qc_checks","slitting_qc_checks","bagmaking_qc_checks"].includes(activeList);
      const isCustomerProducts=activeList==="customer_products";
      const isProductInkCodes=activeList==="product_ink_codes";

      // Customer Products state
      const [cpEntries,setCpEntries]=useState([]); // [{customer,products:[]}]
      const [cpSelected,setCpSelected]=useState(""); // which customer is expanded
      const [cpNewProd,setCpNewProd]=useState("");
      const [cpNewCustomer,setCpNewCustomer]=useState("");

      // Product Ink Codes state
      const [piEntries,setPiEntries]=useState([]); // [{product, inks:[...codes]}]
      const [piSelected,setPiSelected]=useState("");
      const [piNewInk,setPiNewInk]=useState("");
      const [piNewProduct,setPiNewProduct]=useState("");

      React.useEffect(()=>{
        if(isCustomerProducts){
          const raw=appLists.customer_products||[];
          setCpEntries(Array.isArray(raw)?raw:[]);
          return;
        }
        if(isProductInkCodes){
          const raw=appLists.product_ink_codes||[];
          setPiEntries(Array.isArray(raw)?raw:[]);
          return;
        }
        const raw=appLists[activeList]||[];
        if(isInkCode){ setItems(raw.map(x=>typeof x==="object"?x:{code:String(x),description:""})); }
        else { setItems(raw.map(x=>typeof x==="object"?(x.val||x.code||String(x)):String(x)).map(v=>({val:v}))); }
        setNewVal(""); setNewCode("");
      },[activeList,appLists]);

      const addItem=()=>{
        if(isInkCode){ if(!newCode.trim()) return; setItems(prev=>[...prev,{code:newCode.trim(),description:""}]); setNewCode(""); }
        else { if(!newVal.trim()) return; setItems(prev=>[...prev,{val:newVal.trim()}]); setNewVal(""); }
      };
      const removeItem=i=>setItems(prev=>prev.filter((_,x)=>x!==i));
      const editItem=(i,field,val)=>setItems(prev=>prev.map((item,x)=>x===i?{...item,[field]:val}:item));
      const moveItem=(i,dir)=>{ const next=[...items]; const swap=i+dir; if(swap<0||swap>=next.length) return; [next[i],next[swap]]=[next[swap],next[i]]; setItems(next); };
      const saveList=async()=>{
        setSaving(true);
        const toSave=isInkCode?items.map(x=>({code:x.code||"",description:x.description||""})).filter(x=>x.code):items.map(x=>x.val||"").filter(Boolean);
        await dbUpsertList(activeList,JSON.stringify(toSave)); await reload(); flash("List saved!"); setSaving(false);
      };

      // Customer Products helpers
      const cpSave=async(entries)=>{
        setSaving(true);
        await dbUpsertList("customer_products",JSON.stringify(entries));
        await reload(); flash("Customer products saved!"); setSaving(false);
      };
      const cpAddCustomer=()=>{
        const name=cpNewCustomer.trim();
        if(!name) return;
        if(cpEntries.find(e=>e.customer===name)){ flash("Customer already exists.","danger"); return; }
        const next=[...cpEntries,{customer:name,products:[]}];
        setCpEntries(next); setCpNewCustomer(""); setCpSelected(name);
      };
      const cpRemoveCustomer=(customer)=>{ const next=cpEntries.filter(e=>e.customer!==customer); setCpEntries(next); if(cpSelected===customer) setCpSelected(""); };
      const cpAddProduct=(customer)=>{
        if(!cpNewProd.trim()) return;
        const next=cpEntries.map(e=>e.customer===customer?{...e,products:[...e.products,cpNewProd.trim()]}:e);
        setCpEntries(next); setCpNewProd("");
      };
      const cpRemoveProduct=(customer,pi)=>{
        const next=cpEntries.map(e=>e.customer===customer?{...e,products:e.products.filter((_,xi)=>xi!==pi)}:e);
        setCpEntries(next);
      };
      const cpEditProduct=(customer,pi,val)=>{
        const next=cpEntries.map(e=>e.customer===customer?{...e,products:e.products.map((p,xi)=>xi===pi?val:p)}:e);
        setCpEntries(next);
      };
      const cpMoveProduct=(customer,pi,dir)=>{
        const next=cpEntries.map(e=>{
          if(e.customer!==customer) return e;
          const prods=[...e.products]; const swap=pi+dir;
          if(swap<0||swap>=prods.length) return e;
          [prods[pi],prods[swap]]=[prods[swap],prods[pi]];
          return {...e,products:prods};
        });
        setCpEntries(next);
      };

      const allListKeys=Object.keys(LIST_LABELS);

      // Product Ink Codes helpers
      const piSave=async(entries)=>{
        setSaving(true);
        await dbUpsertList("product_ink_codes",JSON.stringify(entries));
        await reload(); flash("Product ink codes saved!"); setSaving(false);
      };
      const piAddProduct=()=>{
        const name=piNewProduct.trim();
        if(!name) return;
        if(piEntries.find(e=>e.product===name)){ flash("Product already exists in this list.","danger"); return; }
        const next=[...piEntries,{product:name,inks:[]}];
        setPiEntries(next); setPiNewProduct(""); setPiSelected(name);
      };
      const piRemoveProduct=(product)=>{ const next=piEntries.filter(e=>e.product!==product); setPiEntries(next); if(piSelected===product) setPiSelected(""); };
      const piAddInk=(product)=>{
        if(!piNewInk.trim()) return;
        const next=piEntries.map(e=>e.product===product?{...e,inks:[...e.inks,piNewInk.trim()]}:e);
        setPiEntries(next); setPiNewInk("");
      };
      const piRemoveInk=(product,ii)=>{
        const next=piEntries.map(e=>e.product===product?{...e,inks:e.inks.filter((_,xi)=>xi!==ii)}:e);
        setPiEntries(next);
      };

      return <div>
        <PH title="Lists / Settings" sub="Manage dropdown options and QC check items" />

        {/* Tab strip */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20}}>
          <button onClick={()=>setActiveList("customer_products")} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:activeList==="customer_products"?C.blue:C.panel,color:activeList==="customer_products"?"#fff":C.muted,outline:activeList==="customer_products"?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>🏢 Customer Products</button>
          <button onClick={()=>setActiveList("product_ink_codes")} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:activeList==="product_ink_codes"?C.blue:C.panel,color:activeList==="product_ink_codes"?"#fff":C.muted,outline:activeList==="product_ink_codes"?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>🎨 Product Ink Codes</button>
          {allListKeys.map(k=>(
            <button key={k} onClick={()=>setActiveList(k)} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:activeList===k?C.accent:C.panel,color:activeList===k?"#fff":C.muted,outline:activeList===k?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>{LIST_LABELS[k]}</button>
          ))}
        </div>

        {/* ── Customer Products editor ── */}
        {isCustomerProducts&&<div>
          <SC title="Customer Products">
            <div style={{fontSize:12,color:C.muted,marginBottom:16,padding:"10px 14px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>
              Add each customer and assign their specific products. On production sheets, when a customer is selected, only their products appear in the dropdown.
            </div>

            {/* Add new customer */}
            <div style={{display:"flex",gap:8,marginBottom:20,alignItems:"center"}}>
              <input style={{...S.input,maxWidth:280}} value={cpNewCustomer} onChange={e=>setCpNewCustomer(e.target.value)} placeholder="New customer name…" onKeyDown={e=>e.key==="Enter"&&cpAddCustomer()} />
              <button style={S.btn("accent",{padding:"8px 18px",fontSize:12})} onClick={cpAddCustomer}>+ Add Customer</button>
            </div>

            {cpEntries.length===0&&<div style={{color:C.muted,fontSize:12}}>No customers yet — add one above.</div>}

            {cpEntries.map(entry=>{
              const isOpen=cpSelected===entry.customer;
              return <div key={entry.customer} style={{marginBottom:10,border:`1px solid ${isOpen?C.blue:C.border}`,borderRadius:8,overflow:"hidden"}}>
                {/* Customer header */}
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:isOpen?C.blue+"22":C.bg,cursor:"pointer"}} onClick={()=>setCpSelected(isOpen?"":entry.customer)}>
                  <div style={{fontSize:13,fontWeight:700,color:isOpen?C.blue:C.text,flex:1}}>🏢 {entry.customer}</div>
                  <span style={{fontSize:11,color:C.muted}}>{entry.products.length} product{entry.products.length!==1?"s":""}</span>
                  <span style={{fontSize:12,color:C.muted}}>{isOpen?"▲":"▼"}</span>
                  <button style={S.btn("danger",{padding:"3px 8px",fontSize:11})} onClick={e=>{ e.stopPropagation(); if(window.confirm(`Remove ${entry.customer} and all their products?`)) cpRemoveCustomer(entry.customer); }}>✕</button>
                </div>

                {/* Product list */}
                {isOpen&&<div style={{padding:"12px 14px",borderTop:`1px solid ${C.border}`}}>
                  {entry.products.length===0&&<div style={{color:C.muted,fontSize:12,marginBottom:10}}>No products yet — add some below.</div>}
                  {entry.products.map((prod,pi)=>(
                    <div key={pi} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                      <span style={{color:C.muted,fontSize:11,minWidth:22,textAlign:"center",flexShrink:0}}>{pi+1}.</span>
                      <input style={{...S.input,flex:1,padding:"4px 8px",fontSize:12,background:"transparent",border:`1px solid transparent`}} value={prod} onChange={e=>cpEditProduct(entry.customer,pi,e.target.value)} onFocus={e=>e.target.style.border=`1px solid ${C.border}`} onBlur={e=>e.target.style.border="1px solid transparent"} />
                      <div style={{display:"flex",gap:3,flexShrink:0}}>
                        <button style={S.btn("ghost",{padding:"2px 7px",fontSize:11,opacity:pi===0?0.25:1})} onClick={()=>cpMoveProduct(entry.customer,pi,-1)} disabled={pi===0}>↑</button>
                        <button style={S.btn("ghost",{padding:"2px 7px",fontSize:11,opacity:pi===entry.products.length-1?0.25:1})} onClick={()=>cpMoveProduct(entry.customer,pi,1)} disabled={pi===entry.products.length-1}>↓</button>
                      </div>
                      <button style={S.btn("danger",{padding:"2px 8px",fontSize:11,flexShrink:0})} onClick={()=>cpRemoveProduct(entry.customer,pi)}>✕</button>
                    </div>
                  ))}
                  {/* Add product row */}
                  <div style={{display:"flex",gap:8,marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
                    <input style={{...S.input,flex:1,padding:"6px 10px",fontSize:12}} value={cpNewProd} onChange={e=>setCpNewProd(e.target.value)} placeholder="Add product…" onKeyDown={e=>e.key==="Enter"&&cpAddProduct(entry.customer)} />
                    <button style={S.btn("accent",{padding:"6px 14px",fontSize:12,flexShrink:0})} onClick={()=>cpAddProduct(entry.customer)}>+ Add</button>
                  </div>
                  {/* Load from global list */}
                  <button style={{...S.btn("ghost",{padding:"5px 12px",fontSize:11,marginTop:8}),color:C.muted}} onClick={()=>{
                    const existing=new Set(entry.products);
                    const toAdd=baseProductNames.filter(p=>!existing.has(p));
                    const next=cpEntries.map(e=>e.customer===entry.customer?{...e,products:[...e.products,...toAdd]}:e);
                    setCpEntries(next);
                  }}>➕ Load all default products ({baseProductNames.length})</button>
                </div>}
              </div>;
            })}
          </SC>
          <button style={{...S.btn("accent"),padding:"12px 32px",fontSize:14}} onClick={()=>cpSave(cpEntries)} disabled={saving}>{saving?"Saving…":"💾 Save Customer Products"}</button>
          <div style={{color:C.muted,fontSize:11,marginTop:8}}>When a customer has products assigned here, their production sheets will only show those products.</div>
        </div>}

        {/* ── Product Ink Codes editor ── */}
        {isProductInkCodes&&<div>
          <SC title="Product Ink Codes">
            <div style={{fontSize:12,color:C.muted,marginBottom:16,padding:"10px 14px",background:C.bg,borderRadius:6,border:`1px solid ${C.warn}22`}}>
              <span style={{color:C.warn,fontWeight:700}}>🎨 Future feature — </span>
              assign specific ink codes to each product. Currently all inks are available on all products. Set <code style={{color:C.accent,background:C.bg,padding:"1px 4px",borderRadius:3}}>FILTER_INKS_BY_PRODUCT = true</code> in the code to activate filtering.
            </div>

            {/* Add new product entry */}
            <div style={{display:"flex",gap:8,marginBottom:20,alignItems:"center"}}>
              <select style={{...S.input,maxWidth:320}} value={piNewProduct} onChange={e=>setPiNewProduct(e.target.value)}>
                <option value="">— Select a product to add —</option>
                {baseProductNames.filter(p=>!piEntries.find(e=>e.product===p)).map(p=><option key={p} value={p}>{p}</option>)}
              </select>
              <button style={S.btn("accent",{padding:"8px 18px",fontSize:12})} onClick={piAddProduct}>+ Add Product</button>
            </div>

            {piEntries.length===0&&<div style={{color:C.muted,fontSize:12}}>No products configured yet — add one above.</div>}

            {piEntries.map(entry=>{
              const isOpen=piSelected===entry.product;
              return <div key={entry.product} style={{marginBottom:10,border:`1px solid ${isOpen?C.accent:C.border}`,borderRadius:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:isOpen?C.accent+"22":C.bg,cursor:"pointer"}} onClick={()=>setPiSelected(isOpen?"":entry.product)}>
                  <div style={{fontSize:13,fontWeight:700,color:isOpen?C.accent:C.text,flex:1}}>📦 {entry.product}</div>
                  <span style={{fontSize:11,color:C.muted}}>{entry.inks.length} ink{entry.inks.length!==1?"s":""}</span>
                  <span style={{fontSize:12,color:C.muted}}>{isOpen?"▲":"▼"}</span>
                  <button style={S.btn("danger",{padding:"3px 8px",fontSize:11})} onClick={e=>{ e.stopPropagation(); if(window.confirm(`Remove ${entry.product} from ink mappings?`)) piRemoveProduct(entry.product); }}>✕</button>
                </div>
                {isOpen&&<div style={{padding:"12px 14px",borderTop:`1px solid ${C.border}`}}>
                  {entry.inks.length===0&&<div style={{color:C.muted,fontSize:12,marginBottom:10}}>No inks assigned yet — add from the dropdown below.</div>}
                  {entry.inks.map((inkCode,ii)=>{
                    const inkObj=(appLists.ink_code||[]).find(x=>(x.code||x)===inkCode)||{};
                    const desc=(inkObj.description||"").trim();
                    return <div key={ii} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5,padding:"5px 8px",background:C.panel,borderRadius:6}}>
                      <span style={{flex:1,fontSize:12,color:C.accent,fontWeight:700}}>{inkCode}{desc&&<span style={{color:C.muted,fontWeight:400}}> — {desc}</span>}</span>
                      <button style={S.btn("danger",{padding:"2px 8px",fontSize:11})} onClick={()=>piRemoveInk(entry.product,ii)}>✕</button>
                    </div>;
                  })}
                  {/* Add ink row */}
                  <div style={{display:"flex",gap:8,marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
                    <select style={{...S.input,flex:1}} value={piNewInk} onChange={e=>setPiNewInk(e.target.value)}>
                      <option value="">— Select ink code to add —</option>
                      {(appLists.ink_code||[]).filter(x=>!entry.inks.includes(x.code||x)).map(x=>{
                        const code=x.code||x; const desc=(x.description||"").trim();
                        return <option key={code} value={code}>{desc?`${code} — ${desc}`:code}</option>;
                      })}
                    </select>
                    <button style={S.btn("accent",{padding:"6px 14px",fontSize:12,flexShrink:0})} onClick={()=>piAddInk(entry.product)}>+ Add</button>
                  </div>
                </div>}
              </div>;
            })}
          </SC>
          <button style={{...S.btn("accent"),padding:"12px 32px",fontSize:14}} onClick={()=>piSave(piEntries)} disabled={saving}>{saving?"Saving…":"💾 Save Product Ink Codes"}</button>
          <div style={{color:C.muted,fontSize:11,marginTop:8}}>These mappings are saved but inactive until <code style={{color:C.accent}}>FILTER_INKS_BY_PRODUCT</code> is set to <code style={{color:C.accent}}>true</code>.</div>
        </div>}

        {/* ── Regular list editor ── */}
        {!isCustomerProducts&&!isProductInkCodes&&<div>
          <SC title={LIST_LABELS[activeList]}>
            {items.length===0&&<div style={{color:C.muted,fontSize:12,marginBottom:12}}>No items yet — add some below.</div>}
            {items.map((item,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,padding:"4px 8px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>
                {isChecklist&&<span style={{color:C.muted,fontSize:11,minWidth:22,textAlign:"center",flexShrink:0}}>{i+1}.</span>}
                {isInkCode?(
                  <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
                    <input style={{...S.input,maxWidth:160,padding:"4px 8px",fontSize:12,background:"transparent",color:C.accent,fontWeight:700,border:`1px solid transparent`}} value={item.code} onChange={e=>editItem(i,"code",e.target.value)} placeholder="Code" onFocus={e=>e.target.style.border=`1px solid ${C.border}`} onBlur={e=>e.target.style.border="1px solid transparent"} />
                    {item.description&&<span style={{fontSize:11,color:C.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>— {item.description}</span>}
                  </div>
                ):(
                  <input style={{...S.input,padding:"4px 8px",fontSize:12,background:"transparent",color:C.text,border:`1px solid transparent`,flex:1}} value={item.val||""} onChange={e=>editItem(i,"val",e.target.value)} placeholder="Edit item…" onFocus={e=>e.target.style.border=`1px solid ${C.border}`} onBlur={e=>e.target.style.border="1px solid transparent"} />
                )}
                {isChecklist&&(
                  <div style={{display:"flex",gap:3,flexShrink:0}}>
                    <button style={S.btn("ghost",{padding:"2px 7px",fontSize:11,opacity:i===0?0.25:1})} onClick={()=>moveItem(i,-1)} disabled={i===0}>↑</button>
                    <button style={S.btn("ghost",{padding:"2px 7px",fontSize:11,opacity:i===items.length-1?0.25:1})} onClick={()=>moveItem(i,1)} disabled={i===items.length-1}>↓</button>
                  </div>
                )}
                <button style={S.btn("danger",{padding:"2px 8px",fontSize:11,flexShrink:0})} onClick={()=>removeItem(i)}>✕</button>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:14,alignItems:"flex-end",paddingTop:10,borderTop:`1px solid ${C.border}`}}>
              {isInkCode?(
                <F label="Ink Code"><TI value={newCode} onChange={v=>setNewCode(v)} placeholder="e.g. 5HTG31856/SCP" onKeyDown={e=>e.key==="Enter"&&addItem()} /></F>
              ):(
                <F label={isChecklist?"New check item":"New item"}>
                  <TI value={newVal} onChange={v=>setNewVal(v)} placeholder={isChecklist?"e.g. Adhesive spread checked":`Add ${LIST_LABELS[activeList]} option…`} onKeyDown={e=>e.key==="Enter"&&addItem()} />
                </F>
              )}
              <button style={{...S.btn("accent"),padding:"8px 18px",fontSize:12,flexShrink:0}} onClick={addItem}>+ Add</button>
            </div>
          </SC>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <button style={{...S.btn("accent"),padding:"12px 32px",fontSize:14}} onClick={saveList} disabled={saving}>{saving?"Saving…":"💾 Save List"}</button>
            {activeList.startsWith("product_name")&&<button style={S.btn("ghost",{padding:"12px 16px",fontSize:12})} onClick={()=>{ const newProds=DEFAULT_LISTS[activeList].filter(p=>!items.find(i=>i.val===p)); setItems(prev=>[...prev,...newProds.map(p=>({val:p}))]); }}>➕ Load Default Products ({DEFAULT_LISTS[activeList].length})</button>}
          </div>
          <div style={{color:C.muted,fontSize:11,marginTop:8}}>Click any item above to edit it. Changes take effect for all users after saving.</div>
        </div>}
      </div>;
    }

    // ── Change Password ───────────────────────────────────────────────────────
    function ChangePassword({session,flash}){
      const [current,setCurrent]=useState(""); const [newPw,setNewPw]=useState(""); const [confirm,setConfirm]=useState(""); const [err,setErr]=useState("");
      const [pin,setPin]=useState(""); const [pinConfirm,setPinConfirm]=useState(""); const [pinErr,setPinErr]=useState("");
      const save=async()=>{
        setErr("");
        const {data}=await sb.from("users").select("password").eq("id",session.id).single();
        if(!data||data.password!==current){ setErr("Current password is incorrect."); return; }
        if(!newPw.trim()){ setErr("New password cannot be empty."); return; }
        if(newPw!==confirm){ setErr("New passwords do not match."); return; }
        if(newPw.length<4){ setErr("Password must be at least 4 characters."); return; }
        const {error}=await sb.from("users").update({password:newPw}).eq("id",session.id);
        if(error){ setErr("Failed to update: "+error.message); return; }
        setCurrent(""); setNewPw(""); setConfirm(""); flash("Password changed successfully!");
      };
      const savePin=async()=>{
        setPinErr("");
        if(!pin.trim()){ setPinErr("PIN cannot be empty."); return; }
        if(!/^\d{4,6}$/.test(pin)){ setPinErr("PIN must be 4 to 6 digits."); return; }
        if(pin!==pinConfirm){ setPinErr("PINs do not match."); return; }
        const {error}=await sb.from("users").update({pin}).eq("id",session.id);
        if(error){ setPinErr("Failed to update: "+error.message); return; }
        setPin(""); setPinConfirm(""); flash("PIN updated successfully!");
      };
      return <div>
        <PH title="Change Password & PIN" sub={`Account settings for: ${session.name}`} />
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <div style={S.card}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:16}}>CHANGE PASSWORD</div>
            <label style={S.label}>Current Password</label>
            <input type="password" style={{...S.input,marginBottom:14}} value={current} onChange={e=>setCurrent(e.target.value)} />
            <label style={S.label}>New Password</label>
            <input type="password" style={{...S.input,marginBottom:14}} value={newPw} onChange={e=>setNewPw(e.target.value)} />
            <label style={S.label}>Confirm New Password</label>
            <input type="password" style={{...S.input,marginBottom:16}} value={confirm} onChange={e=>setConfirm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} />
            {err&&<div style={{color:C.danger,fontSize:12,marginBottom:12}}>{err}</div>}
            <button style={{...S.btn("accent"),width:"100%",padding:10}} onClick={save}>Update Password</button>
          </div>
          <div style={S.card}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:8}}>SET PRODUCTION PIN</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:14,padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>
              Your PIN is used to sign off individual entries on production sheets. Must be 4–6 digits.
            </div>
            <label style={S.label}>New PIN (4–6 digits)</label>
            <input type="password" inputMode="numeric" pattern="[0-9]*" style={{...S.input,marginBottom:14,letterSpacing:"0.3em",fontSize:18}} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="••••" />
            <label style={S.label}>Confirm PIN</label>
            <input type="password" inputMode="numeric" pattern="[0-9]*" style={{...S.input,marginBottom:16,letterSpacing:"0.3em",fontSize:18}} value={pinConfirm} onChange={e=>setPinConfirm(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="••••" onKeyDown={e=>e.key==="Enter"&&savePin()} />
            {pinErr&&<div style={{color:C.danger,fontSize:12,marginBottom:12}}>{pinErr}</div>}
            <button style={{...S.btn("accent"),width:"100%",padding:10}} onClick={savePin}>Update PIN</button>
          </div>
        </div>
      </div>;
    }

    // ── Login Log ─────────────────────────────────────────────────────────────
    function LoginLog({loginLog}){
      const [search,setSearch]=useState(""); const [filterRole,setFilterRole]=useState("all");
      const filtered=loginLog.filter(e=>(!search||e.name?.toLowerCase().includes(search.toLowerCase())||e.username?.toLowerCase().includes(search.toLowerCase()))&&(filterRole==="all"||e.role===filterRole));
      const rc=r=>r==="admin"?C.accent2:r==="manager"?C.accent:r==="qc"?C.blue:r==="viewer"?C.muted:C.success;
      const fmt=iso=>{ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"})+"  "+d.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); };
      return <div>
        <PH title="Login Log" sub="A record of every login — who, date and time. Admin access only." />
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
          <input style={{...S.input,flex:1,maxWidth:280}} placeholder="Search by name or username…" value={search} onChange={e=>setSearch(e.target.value)} />
          <select style={{...S.input,width:"auto",paddingRight:12}} value={filterRole} onChange={e=>setFilterRole(e.target.value)}>
            <option value="all">All roles</option>
            <option value="admin">Admin</option><option value="manager">Manager</option>
            <option value="operator">Operator</option><option value="qc">QC Officer</option><option value="viewer">Viewer</option>
          </select>
          <span style={{color:C.muted,fontSize:12,marginLeft:"auto"}}>{filtered.length} entr{filtered.length!==1?"ies":"y"}</span>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:C.panel,borderBottom:`2px solid ${C.border}`}}>
              {["#","Full Name","Username","Role","Date & Time"].map(h=>(
                <th key={h} style={{padding:"10px 14px",textAlign:"left",color:C.muted,fontWeight:700,fontSize:11,whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={5} style={{padding:"40px",textAlign:"center",color:C.muted}}>{loginLog.length===0?"No logins recorded yet.":"No results for your search."}</td></tr>}
              {filtered.map((e,i)=>(
                <tr key={e.id||i} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"transparent":C.panel+"66"}}>
                  <td style={{padding:"10px 14px",color:C.muted,fontSize:11}}>{i+1}</td>
                  <td style={{padding:"10px 14px",color:C.text,fontWeight:600}}>{e.name}</td>
                  <td style={{padding:"10px 14px",color:C.muted,fontFamily:"'IBM Plex Mono',monospace",fontSize:12}}>{e.username}</td>
                  <td style={{padding:"10px 14px"}}><span style={{fontSize:10,padding:"2px 9px",borderRadius:4,background:rc(e.role)+"33",color:rc(e.role),fontWeight:700}}>{(e.role||"").toUpperCase()}</span></td>
                  <td style={{padding:"10px 14px",color:C.text,fontFamily:"'IBM Plex Mono',monospace",fontSize:12,whiteSpace:"nowrap"}}>{fmt(e.logged_in_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>;
    }

    // ── Trash Bin ─────────────────────────────────────────────────────────────
    function TrashBin({trashed,onRestore,onPermDelete}){
      const [search,setSearch]=useState(""); const [confirmId,setConfirmId]=useState(null);
      const filtered=trashed.filter(r=>r.title?.toLowerCase().includes(search.toLowerCase())||r.deleted_by?.toLowerCase().includes(search.toLowerCase())||r.type?.toLowerCase().includes(search.toLowerCase()));
      return <div>
        <PH title="Trash Bin" sub="Deleted records — restore or permanently remove. Only admins can view this." />
        <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center"}}>
          <input style={{...S.input,flex:1,maxWidth:320}} placeholder="Search trash…" value={search} onChange={e=>setSearch(e.target.value)} />
          <span style={{color:C.muted,fontSize:12}}>{filtered.length} item{filtered.length!==1?"s":""}</span>
        </div>
        {filtered.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:C.muted,fontSize:13}}><div style={{fontSize:40,marginBottom:8}}>🗑</div>{trashed.length===0?"Trash is empty.":"No results for your search."}</div>}
        {filtered.map(r=>(
          <div key={r.id} style={{borderBottom:`1px solid ${C.border}`,padding:"14px 0"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:200}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:C.accent+"33",color:C.accent,fontWeight:700}}>{r.type?.toUpperCase()}</span>
                  <span style={{color:C.text,fontWeight:600,fontSize:13}}>{r.title}</span>
                </div>
                <div style={{fontSize:11,color:C.muted}}>Created by <span style={{color:C.text}}>{r.created_by}</span> · {r.created_at?new Date(r.created_at).toLocaleString():""}</div>
                <div style={{fontSize:11,color:C.danger,marginTop:2}}>🗑 Deleted by <span style={{color:C.text}}>{r.deleted_by}</span> · {r.deleted_at?new Date(r.deleted_at).toLocaleString():""}</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
                <button style={S.btn("ghost",{padding:"5px 14px",fontSize:12,color:C.success,outline:`1px solid ${C.success}`})} onClick={()=>onRestore(r)}>↩ Restore</button>
                {confirmId===r.id?(
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <span style={{fontSize:11,color:C.danger}}>Sure?</span>
                    <button style={S.btn("danger",{padding:"5px 12px",fontSize:12})} onClick={()=>{ onPermDelete(r.id); setConfirmId(null); }}>Yes, Delete</button>
                    <button style={S.btn("ghost",{padding:"5px 10px",fontSize:12})} onClick={()=>setConfirmId(null)}>Cancel</button>
                  </div>
                ):(
                  <button style={S.btn("danger",{padding:"5px 14px",fontSize:12})} onClick={()=>setConfirmId(r.id)}>✕ Remove</button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>;
    }

    // ── Debug Panel ───────────────────────────────────────────────────────────
    function DebugPanel({records,users,session}){
      const [copied,setCopied]=useState(false);
      const buildReport=()=>{
        const lines=[];
        lines.push("=== CONCORD TRACEABILITY — DEBUG REPORT ===");
        lines.push(`Generated: ${new Date().toLocaleString()}`);
        lines.push(`Logged in as: ${session.name} (${session.role})`);
        lines.push(`Supabase URL: ${SUPABASE_URL}`);
        lines.push("");
        lines.push(`--- USERS (${users.length} total) ---`);
        users.forEach(u=>lines.push(`  [${u.role}] ${u.name} — username: ${u.username}`));
        lines.push("");
        lines.push(`--- RECORDS (${records.length} total) ---`);
        const types={};
        records.forEach(r=>{ types[r.type]=(types[r.type]||0)+1; });
        Object.entries(types).forEach(([t,c])=>lines.push(`  ${t}: ${c}`));
        lines.push("");
        lines.push("--- LAST 5 RECORDS ---");
        records.slice(0,5).forEach((r,i)=>{ lines.push(`\n[${i+1}] ${r.title}`); lines.push(`  Type: ${r.type}`); lines.push(`  Completed by: ${r.created_by}`); lines.push(`  Created at: ${r.created_at}`); });
        lines.push("\n=== END OF REPORT ===");
        return lines.join("\n");
      };
      const report=buildReport();
      const copy=()=>{ navigator.clipboard.writeText(report).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2500); }); };
      return <div>
        <PH title="Debug / AI Help" sub="Copy this report and paste it into Claude or any AI to get help" />
        <div style={{...S.card,marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:12}}>HOW TO USE</div>
          <div style={{fontSize:13,color:C.text,lineHeight:2}}>1. Click <span style={{color:C.accent,fontWeight:700}}>Copy Report</span> below<br />2. Open a new chat at <span style={{color:C.accent}}>claude.ai</span><br />3. Paste the report and describe your problem</div>
        </div>
        <div style={S.card}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em"}}>REPORT PREVIEW</div>
            <button style={{...S.btn(copied?"ghost":"accent"),background:copied?C.success:C.accent,color:"#fff",padding:"6px 18px",fontSize:12}} onClick={copy}>{copied?"✔ Copied!":"Copy Report"}</button>
          </div>
          <pre style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,padding:16,fontSize:11,color:C.muted,overflowX:"auto",maxHeight:480,overflowY:"auto",lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{report}</pre>
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
