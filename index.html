    // ── Excel Export ──────────────────────────────────────────────────────────
    function exportToExcel(records, appLists={}){
      const wb=XLSX.utils.book_new();
      const isoG=appLists.iso_global||{companyName:"Golden Tree Holdings (Pty) Ltd t/a Concord Packaging",manualTitle:"Food Safety Management Manual",reviewedBy:"Food Safety Officer",approvedBy:"Managing Director",issueDate:"02 March 2021"};
      const isoD=appLists.iso_docs||{};

      // ── Apply a thin border grid to a rectangular block of cells, filling in
      // any blank cells so the whole block reads as a proper bordered table
      // (not just the ones that already had content written to them).
      const addGridBorders=(ws,r1,r2,c1,c2)=>{
        const gBorder={style:"thin",color:{rgb:"000000"}};
        const gAll={top:gBorder,bottom:gBorder,left:gBorder,right:gBorder};
        for(let r=r1;r<=r2;r++){
          for(let c=c1;c<=c2;c++){
            const addr=XLSX.utils.encode_cell({r,c});
            if(!ws[addr]) ws[addr]={t:"s",v:""};
            ws[addr].s={...(ws[addr].s||{}),border:gAll};
          }
        }
      };

      // ── Build ISO header with full borders on every cell ─────────────────────
      const makeIsoHeader=(type,ws,rowOffset=0)=>{
        const doc=isoD[type]||{title:"",docNo:"",revNo:"01",revisedDate:"",reviewedBy:"",approvedBy:""};
        const border={style:"thin",color:{rgb:"000000"}};
        const bAll={top:border,bottom:border,left:border,right:border};

        // Helper — set cell with border + optional extra style
        const sc=(r,c,v,s={})=>{
          const addr=XLSX.utils.encode_cell({r:rowOffset+r,c});
          ws[addr]={t:typeof v==="number"?"n":"s",v:v||"",s:{border:bAll,...s}};
        };

        // Fill ALL cells in the 4-row × 9-col block with borders first
        for(let r=0;r<4;r++) for(let c=0;c<9;c++) sc(r,c,"");

        // Row 0
        sc(0,0,isoG.companyName,{font:{bold:true,sz:11},alignment:{wrapText:true,vertical:"center",horizontal:"center",shrinkToFit:false}});

        ws["!rows"][rowOffset+2]={hpt:30};

      const prodRecs=records.filter(r=>r.type==="production");

          if(r.data?.inks?.length){

            rows.push(["","","","TOTAL",totalQty||"",totalRet||"","","",""]);
          }
          rows.push(["---"]);
        });
        const prodWs=XLSX.utils.aoa_to_sheet(rows);
        makeIsoHeader("production",prodWs,0);
        // Set column widths
        prodWs["!cols"]=[{wch:22.1},{wch:23.7},{wch:14.1},{wch:14.6},{wch:15.6},{wch:29},{wch:15.3},{wch:12},{wch:16},{wch:16},{wch:28},{wch:10}];
        XLSX.utils.book_append_sheet(wb,prodWs,"Production");

      const viscRecs=records.filter(r=>r.type==="viscosity");
      if(viscRecs.length){

        viscRecs.forEach(r=>{

            rows.push([i===0?r.created_by:"",i===0?h.date:"",i===0?h.shift:"",i===0?h.jobNo:"",i===0?h.press:"",i===0?h.operator:"",row.ink,row.type||"",row.target,row.unit,...rSlots.map(t=>row.times?.[t]||"")]);

      if(qcRecs.length){

        qcRecs.forEach(r=>{

          (r.data?.checks||[]).forEach((c,i)=>{ rows.push([i===0?r.created_by:"",i===0?h.date:"",i===0?h.shift:"",i===0?h.jobNo:"",i===0?h.customer:"",i===0?h.press:"",i===0?h.operator:"",i===0?h.inspector:"",i===0?(r.data?.overallResult||""):"",i+1,c.label,c.result,c.comment]); });
          rows.push(["---"]);

        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Printing QC");
      }

      const lamRecs=records.filter(r=>r.type==="lamination");
      if(lamRecs.length){
        const rows=[];
        lamRecs.forEach(r=>{
          const h=r.data?.header||{};
          rows.push(["Date","Shift","Job Card Number","Customer","Product Name","Operator"]);
          rows.push([h.date,h.shift,h.jobNo,h.customerProduct,h.productName||"",h.operator]);
          rows.push([]);
          if((r.data?.filmRows||[]).length){ rows.push(["-- Film Input --","Material","Film batch no.","KG","Meters"]); (r.data.filmRows||[]).forEach(x=>rows.push(["",x.adhesiveCarrierFilm,x.filmBatchNo,x.filmKg,x.filmSpec])); }
          if((r.data?.outputRows||[]).length){ rows.push(["-- Output Stock --","Material","Film batch no.","KG","Meters"]); (r.data.outputRows||[]).forEach(x=>rows.push(["",x.laminatedRollName,x.filmBatchNo||"",x.kg||"",x.laminatedMetryKg])); }
          if((r.data?.adhesiveRows||[]).length){ rows.push(["-- Adhesive Input --","Carrier KG","Adhesive Name","Adhesive A Code","Batch A","Adhesive B Code","Batch B"]); (r.data.adhesiveRows||[]).forEach(x=>rows.push(["",x.adhesiveCarrierKg,x.adhesiveName,x.adhesiveAProductCode||"",x.adhesiveBatchA||"",x.adhesiveBProductCode||"",x.adhesiveBatchB||""])); }
          if((r.data?.qcRows||[]).length){ rows.push(["-- Adhesive Specs --","Adhesive Amount","GSM","Waste"]); (r.data.qcRows||[]).forEach(x=>rows.push(["",x.adhesiveAmount,x.gsm,x.waste])); }
          rows.push(["---"]);
        });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Lamination");
      }

      const addQCSheet=(type,sheetName)=>{
        const recs=records.filter(r=>r.type===type);
        if(!recs.length) return;
        const rows=[["Completed By","Date","Shift","Job No.","Customer","Product","Operator","Inspector","#","Check Item","Result","Comment","Overall"]];
        recs.forEach(r=>{ const h=r.data?.header||{}; (r.data?.checks||[]).forEach((c,i)=>{ rows.push([i===0?r.created_by:"",i===0?h.date:"",i===0?h.shift:"",i===0?h.jobNo:"",i===0?h.customer:"",i===0?h.productName:"",i===0?h.operator:"",i===0?h.inspector:"",i+1,c.label,c.result,c.comment||"",i===0?r.data?.overallResult:""]); }); rows.push(["---"]); });
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),sheetName);
      };
      addQCSheet("laminationqc","Lamination QC");
      [1,2].forEach(m=>{

        if(extRecs.length){
          const rows=[];
          extRecs.forEach(r=>{ const h=r.data?.header||{}; rows.push(["Date","Shift","Job No.","Customer","Product","Material Spec","Operator","Supervisor","Remarks"]); rows.push([h.date,h.shift,h.jobNo,h.customer,h.productName,h.materialSpec,h.operator,h.supervisor,r.data?.remarks||""]); rows.push([]); if((r.data?.rmaRows||[]).length){ rows.push(["-- Raw Material A --","Brand","Batch No","KG"]); (r.data.rmaRows||[]).forEach(x=>rows.push(["",x.brand,x.batchNo,x.kg])); } if((r.data?.rmbRows||[]).length){ rows.push(["-- Raw Material B --","Brand","Batch No","KG"]); (r.data.rmbRows||[]).forEach(x=>rows.push(["",x.brand,x.batchNo,x.kg])); } if((r.data?.rollRows||[]).length){ rows.push(["-- Roll Output --","Roll No","Metres","KG"]); (r.data.rollRows||[]).forEach(x=>rows.push(["",x.rollNo,x.metres,x.kg])); } rows.push(["---"]); });
          XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),`Extruder ${m}`);
        }

    // ── Records ───────────────────────────────────────────────────────────────
    function Records({records,session,onDelete,onSave,onReject,onApprove,appLists={}}){
      const [filter,setFilter]=useState("all"); const [search,setSearch]=useState("");
      const [exp,setExp]=useState(null); const [editing,setEditing]=useState(null);
      const [selected,setSelected]=useState(new Set());
      const [deleting,setDeleting]=useState(false);
      const [filterYear,setFilterYear]=useState("all");
      const [filterMonth,setFilterMonth]=useState("all");

      // Build year/month options from all records
      const allYears=[...new Set(records.map(r=>r.data?.header?.date?.substring(0,4)||r.created_at?.substring(0,4)).filter(Boolean))].sort().reverse();
      const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

      const filtered=records.filter(r=>{
        if(filter!=="all"&&r.type!==filter) return false;
        if(search!==""&&!r.title.toLowerCase().includes(search.toLowerCase())) return false;
        const recDate=r.data?.header?.date||r.created_at?.substring(0,10)||"";
        if(filterYear!=="all"&&!recDate.startsWith(filterYear)) return false;
        if(filterMonth!=="all"){
          const mo=recDate.substring(5,7);
          if(mo!==filterMonth) return false;
        }
        return true;
      });

      const isAdmin=session.role==="admin";
      const canMaster=isAdmin||getTabs(session).some(t=>t.id==="records_reject");
      const allSelected=filtered.length>0&&filtered.every(r=>selected.has(r.id));
      const toggleSel=(e,id)=>{ e.stopPropagation(); const next=new Set(selected); if(next.has(id)) next.delete(id); else next.add(id); setSelected(next); };
      const toggleAll=()=>{ if(allSelected){ setSelected(new Set()); } else { setSelected(new Set(filtered.map(r=>r.id))); } };
      const deleteSelected=async()=>{
        if(selected.size===0) return;
        if(!window.confirm(`Permanently delete ${selected.size} record${selected.size>1?"s":""}? This cannot be undone.`)) return;
        setDeleting(true);
        for(const id of selected){ await onDelete(id); }
        setSelected(new Set());
        setDeleting(false);
      };
      const toExport=selected.size>0?filtered.filter(r=>selected.has(r.id)):filtered;
      const filterLabels={"all":"All","production":"Printing","viscosity":"Viscosity QC","printingqc":"Printing QC","lamination":"Lamination","laminationqc":"Lam QC","extruder1":"Extruder 1","extruder1qc":"Ext 1 QC","extruder2":"Extruder 2","extruder2qc":"Ext 2 QC","slitting1":"Slitting 1","slitting1qc":"Slit 1 QC","slitting2":"Slitting 2","slitting2qc":"Slit 2 QC","bagmaking1":"Bag 1","bagmaking1qc":"Bag 1 QC","bagmaking2":"Bag 2","bagmaking2qc":"Bag 2 QC","bagmaking3":"Bag 3","bagmaking3qc":"Bag 3 QC","bagmaking4":"Bag 4","bagmaking4qc":"Bag 4 QC"};
      return <div>
        <PH title="All Records" sub={`${records.length} total · ${filtered.length} shown`} />
        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {Object.keys(filterLabels).map(f=>(
              <button key={f} onClick={()=>{ setFilter(f); setSelected(new Set()); }} style={S.btn(filter===f?"accent":"ghost",{padding:"5px 12px",fontSize:10})}>{filterLabels[f]}</button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
          <input style={{...S.input,width:220,padding:"6px 12px"}} value={search} placeholder="Search job no, title…" onChange={e=>setSearch(e.target.value)} />
          <select style={{...S.input,width:120}} value={filterYear} onChange={e=>{ setFilterYear(e.target.value); setSelected(new Set()); }}>
            <option value="all">All Years</option>
            {allYears.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select style={{...S.input,width:140}} value={filterMonth} onChange={e=>{ setFilterMonth(e.target.value); setSelected(new Set()); }}>
            <option value="all">All Months</option>
            {MONTHS.map((m,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{m}</option>)}
          </select>
          {(filterYear!=="all"||filterMonth!=="all"||search)&&(
            <button style={S.btn("ghost",{padding:"6px 12px",fontSize:11})} onClick={()=>{ setFilterYear("all"); setFilterMonth("all"); setSearch(""); setSelected(new Set()); }}>✕ Clear Filters</button>
          )}
          <div style={{flex:1}} />
          {isAdmin&&<div style={{display:"flex",alignItems:"center",gap:8}}>
            <div onClick={toggleAll} style={{width:18,height:18,border:`1px solid ${allSelected?C.success:C.muted}`,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",background:allSelected?C.success:C.bg,color:"#fff",fontSize:12,cursor:"pointer",flexShrink:0}}>
              {allSelected&&"✔"}
            </div>
            <span style={{fontSize:11,color:C.muted,cursor:"pointer"}} onClick={toggleAll}>
              {allSelected?"Deselect All":`Select All (${filtered.length})`}
            </span>
          </div>}
          {selected.size>0&&<span style={{fontSize:11,color:C.accent,fontWeight:600}}>{selected.size} selected</span>}
          {selected.size>0&&isAdmin&&(
            <button style={S.btn("danger",{padding:"6px 16px",fontSize:11})} onClick={deleteSelected} disabled={deleting}>
              {deleting?`Deleting…`:`🗑 Delete Selected (${selected.size})`}
            </button>
          )}
          {selected.size>0&&<button style={S.btn("ghost",{padding:"6px 16px",fontSize:11})} onClick={()=>setSelected(new Set())}>Clear Selection</button>}
          <button style={{...S.btn("accent",{padding:"6px 16px",fontSize:11}),background:C.success}} onClick={()=>exportToExcel(toExport,appLists)}>↓ Export to Excel ({toExport.length})</button>
        </div>
        {filtered.length===0&&<div style={{color:C.muted,fontSize:13}}>No records found.</div>}
        {filtered.map(r=>{

                {selected.has(r.id)&&"✔"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:C.text,fontWeight:600}}>{r.title}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:3,display:"flex",gap:12,flexWrap:"wrap"}}>
                  <span>📋 Completed by: <span style={{color:C.accent,fontWeight:700}}>{r.created_by}</span></span>
                  {r.data?.closedBy&&(
                    <span>✔ Closed by: <span style={{color:C.success,fontWeight:700}}>{r.data.closedBy}</span></span>
                  )}
                  {(r.data?.header?.customer||r.data?.header?.customerProduct)&&(

              </div>

              <span style={{fontSize:10,color}}>{isExp?"▲":"▼"}</span>

                <button style={S.btn("ghost",{padding:"4px 10px",fontSize:11,color:C.blue,outline:`1px solid ${C.blue}`})}
                  onClick={e=>{ e.stopPropagation(); setExp(r.id); setEditing(isEdit?null:r.id); }}>{isEdit?"Cancel Edit":"✎ Edit"}</button>
              </>}
              {canMaster&&<>
                {(appLists?.approval_settings||{production:true})[r.type]!==true&&r.approval_status==="rejected"&&<button style={S.btn("ghost",{padding:"4px 10px",fontSize:11,color:C.success,outline:`1px solid ${C.success}`})}
                  onClick={async e=>{ e.stopPropagation(); if(window.confirm("Master approve this record? (it is stuck in rejected)")) await onApprove(r.id,session.name); }}>✔ Approve</button>}
                {(appLists?.approval_settings||{production:true})[r.type]===true&&r.approval_status&&r.approval_status!=="rejected"&&<button style={S.btn("ghost",{padding:"4px 10px",fontSize:11,color:C.warn,outline:`1px solid ${C.warn}`})}

              </>}

                  onClick={e=>{ e.stopPropagation(); if(window.confirm("Delete this record?")) onDelete(r.id); }}>Delete</button>}

    function RecDetail({r,createdBy}){
      const d=r.data||{};
      return <div style={{marginTop:16,paddingTop:16,borderTop:`1px solid ${C.border}`,fontSize:12}}>
        <div style={{marginBottom:12,padding:"8px 12px",background:C.bg,borderRadius:6,display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{color:C.muted}}>Completed by: </span><span style={{color:C.accent,fontWeight:700}}>{createdBy}</span>
          <span style={{color:C.muted}}>on {new Date(r.created_at).toLocaleString()}</span>
          {d.closedBy&&<>
            <span style={{color:C.muted}}>· Closed by: </span><span style={{color:C.success,fontWeight:700}}>{d.closedBy}</span>
            {d.closedDate&&<span style={{color:C.muted}}>· {d.closedDate} {d.closedAt}</span>}

          <ApprovalBadge record={r} />

        <ApprovalHistory record={r} />
      </div>;
    }

    function RecEdit({r,onSave,onCancel}){
      const [data,setData]=useState(JSON.parse(JSON.stringify(r.data||{})));
      const setH=(k,v)=>setData(d=>({...d,header:{...d.header,[k]:v}}));
      const setArr=(key,i,k,v)=>setData(d=>({...d,[key]:d[key].map((x,xi)=>xi===i?{...x,[k]:v}:x)}));
      const addArr=(key,empty)=>setData(d=>({...d,[key]:[...(d[key]||[]),empty]}));
      const delArr=(key,i)=>setData(d=>({...d,[key]:d[key].filter((_,xi)=>xi!==i)}));
      return <div style={{marginTop:16,paddingTop:16,borderTop:`2px solid ${C.accent}`,fontSize:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.accent,letterSpacing:"0.08em",marginBottom:14}}>EDITING RECORD — ADMIN MODE</div>
        {r.type==="production"&&<EditProd data={data} setH={setH} setArr={setArr} addArr={addArr} delArr={delArr} setData={setData} />}
        {r.type==="viscosity"&&<EditVisc data={data} setH={setH} setArr={setArr} addArr={addArr} delArr={delArr} setData={setData} />}
        {r.type.endsWith("qc")&&<EditQC data={data} setH={setH} setArr={setArr} addArr={addArr} delArr={delArr} setData={setData} />}
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button style={S.btn("accent",{padding:"8px 24px"})} onClick={()=>onSave(data)}>Save Changes</button>
          <button style={S.btn("ghost",{padding:"8px 24px"})} onClick={onCancel}>Cancel</button>
        </div>
      </div>;
    }

    function EditProd({data,setH,setArr,addArr,delArr,setData}){
      const h=data.header||{};
      return <div>
        <div style={{fontSize:10,fontWeight:700,color:C.muted,marginBottom:8}}>JOB DETAILS</div>
        <Grid cols={4}>
          {[["date","Date","date"],["shift","Shift","text"],["jobNo","Job Card Number","text"],["customer","Customer","text"],["substrate","Substrate","text"],["widthA","Width A (mm)","text"],["widthB","Width B (mm)","text"],["lengthA","Length A (m)","number"],["lengthB","Length B (m)","number"],["speed","Speed","number"],["operator","Operator","text"],["supervisor","Supervisor","text"]].map(([k,label,type])=>(
            <F key={k} label={label}><TI type={type} value={h[k]||""} onChange={v=>setH(k,v)} /></F>
          ))}
        </Grid>
        {[["rawIn","Raw Material Input",["material","batchNo","qty","unit"],"2fr 1.5fr 1fr 1fr 36px",{material:"",batchNo:"",qty:"",unit:""}],["rawOut","Raw Material Output (Printing Reels)",["material","batchNo","qty","unit","meters","time"],"2fr 1.5fr 1fr 1fr 1fr 80px 36px",{material:"",batchNo:"",qty:"",unit:"",meters:"",time:""}],["inks","Ink Input",["inkCode","inkType","batchNo","supplier","qty","returned"],"2fr 1fr 1.2fr 1.5fr 1fr 1fr 36px",{inkCode:"",description:"",inkType:"",batchNo:"",supplier:"",qty:"",returned:""}],["solvents","Solvent Input",["solvent","supplier","batchNo","qty","returned"],"1.5fr 1.5fr 1.5fr 1fr 1fr 36px",{solvent:"",supplier:"",batchNo:"",qty:"",returned:""}]].map(([key,title,cols,grid,emptyRow])=>(
          <div key={key} style={{marginTop:14}}>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,marginBottom:6}}>{title.toUpperCase()}</div>
            {(data[key]||[]).map((row,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:grid,gap:6,marginBottom:6,alignItems:"center"}}>
                {cols.map(c=><TI key={c} value={row[c]||""} onChange={v=>setArr(key,i,c,v)} placeholder={c} />)}
                <button style={S.btn("danger",{padding:"3px 6px",fontSize:11})} onClick={()=>delArr(key,i)}>✕</button>
              </div>
            ))}
            <button style={S.btn("ghost",{fontSize:11,marginTop:4})} onClick={()=>addArr(key,emptyRow)}>+ Add Row</button>
          </div>
        ))}
        <div style={{marginTop:14}}>
          <div style={{fontSize:10,fontWeight:700,color:C.muted,marginBottom:6}}>REMARKS</div>
          <textarea style={{...S.input,minHeight:60,resize:"vertical"}} value={data.remarks||""} onChange={e=>setData(d=>({...d,remarks:e.target.value}))} />
        </div>
      </div>;
    }

    function EditVisc({data,setH,setArr,addArr,delArr}){
      const h=data.header||{};
      return <div>
        <Grid cols={5}>
          {[["date","Date","date"],["shift","Shift","text"],["jobNo","Job Card Number","text"],["press","Press","text"],["operator","Operator","text"]].map(([k,label,type])=>(
            <F key={k} label={label}><TI type={type} value={h[k]||""} onChange={v=>setH(k,v)} /></F>
          ))}
        </Grid>
        <div style={{marginTop:14,overflowX:"auto"}}>
          <table style={{borderCollapse:"collapse",fontSize:11,width:"100%"}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
              <th style={TH}>Ink</th><th style={TH}>Type</th><th style={TH}>Target</th><th style={TH}>Unit</th>
              {getSlotsForShift(h.shift).map(t=><th key={t} style={TH}>{t}</th>)}<th style={TH}></th>
            </tr></thead>
            <tbody>{(data.readings||[]).map((row,i)=>(
              <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                <td style={TD}><input style={{...S.input,width:80,padding:"3px 5px"}} value={row.ink||""} onChange={e=>setArr("readings",i,"ink",e.target.value)} /></td>
                <td style={TD}><input style={{...S.input,width:80,padding:"3px 5px"}} value={row.type||""} onChange={e=>setArr("readings",i,"type",e.target.value)} /></td>
                <td style={TD}><input style={{...S.input,width:55,padding:"3px 5px"}} value={row.target||""} onChange={e=>setArr("readings",i,"target",e.target.value)} /></td>
                <td style={TD}><input style={{...S.input,width:55,padding:"3px 5px"}} value={row.unit||""} onChange={e=>setArr("readings",i,"unit",e.target.value)} /></td>
                {getSlotsForShift(h.shift).map(t=><td key={t} style={TD}><input style={{...S.input,width:46,padding:"3px",textAlign:"center"}} value={row.times?.[t]||""} onChange={e=>setArr("readings",i,`times.${t}`,e.target.value)} /></td>)}
                <td style={TD}><button style={S.btn("danger",{padding:"3px 6px",fontSize:11})} onClick={()=>delArr("readings",i)}>✕</button></td>
              </tr>
            ))}</tbody>
          </table>
          <button style={S.btn("ghost",{fontSize:11,marginTop:6})} onClick={()=>addArr("readings",{ink:"",type:"",target:"",unit:"sec",times:Object.fromEntries(getSlotsForShift(h.shift).map(t=>[t,""]))})}>+ Add Row</button>

    function EditQC({data,setH,setArr,setData}){
      const h=data.header||{};
      return <div>
        <Grid cols={4}>
          {[["date","Date","date"],["shift","Shift","text"],["jobNo","Job Card Number","text"],["customer","Customer","text"],["press","Press","text"],["operator","Operator","text"],["inspector","Inspector","text"],["reelNo","Reel No.","text"]].map(([k,label,type])=>(
            <F key={k} label={label}><TI type={type} value={h[k]||""} onChange={v=>setH(k,v)} /></F>
          ))}
        </Grid>
        <div style={{marginTop:14}}>
          {(data.checks||[]).map((c,i)=>(
            <div key={i} style={{display:"grid",gridTemplateColumns:"36px 2fr 150px 2fr",gap:8,padding:"5px 0",borderBottom:`1px solid ${C.border}`,alignItems:"center"}}>
              <div style={{fontSize:11,color:C.muted,textAlign:"center"}}>{i+1}</div>
              <div style={{fontSize:12,color:C.text}}>{c.label}</div>
              <div style={{display:"flex",gap:4}}>
                {["Pass","Fail","N/A"].map(opt=>(
                  <button key={opt} onClick={()=>setArr("checks",i,"result",opt)} style={{flex:1,padding:"4px 2px",border:"none",borderRadius:4,cursor:"pointer",fontSize:11,fontWeight:600,background:c.result===opt?(opt==="Pass"?C.success:opt==="Fail"?C.danger:C.muted):C.bg,color:c.result===opt?"#fff":C.muted,outline:c.result===opt?"none":`1px solid ${C.border}`}}>{opt}</button>
                ))}
              </div>
              <input style={{...S.input,padding:"4px 8px"}} value={c.comment||""} onChange={e=>setArr("checks",i,"comment",e.target.value)} />

            {["APPROVED","CONDITIONAL","REJECTED"].map(opt=>(

            ))}

        </div>
      </div>;

    function ProdD({d}){
      const h=d.header||{};
      return <div>
        {h.continuationOf&&(
          <div style={{marginBottom:12,padding:"8px 14px",background:C.warn+"22",border:`1px solid ${C.warn}`,borderRadius:6,fontSize:12,color:C.warn,fontWeight:600}}>
            🔗 Continuation of Job No.: <span style={{color:C.text,fontWeight:700}}>{h.continuationOf}</span>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}}>
          {[["Date",h.date],["Shift",h.shift],["Job Card Number",h.jobNo],["Customer",h.customer],["Product Name",h.productName],["Substrate",h.substrate],["Width A (mm)",h.widthA||h.width],["Width B (mm)",h.widthB],["Length A (m)",h.lengthA||h.length],["Length B (m)",h.lengthB],["Speed",h.speed],["Operator",h.operator],["Supervisor",h.supervisor]].map(([k,v])=>(
            <div key={k}><div style={{fontSize:10,color:C.muted}}>{k}</div><div style={{color:C.text}}>{v||"—"}</div></div>
          ))}
        </div>
        <DT title="Raw Material Input"  rows={d.rawIn}  cols={["material","batchNo","qty","unit","signedBy","signedShift","signedDate","signedAt"]} sumCols={["qty"]} />
        <DT title="Raw Material Output (Printing Reels)" rows={d.rawOut} cols={["material","batchNo","qty","unit","meters","time","signedBy","signedShift","signedDate","signedAt"]} sumCols={["qty","meters"]} />
        <DT title="Return Raw BOPP (When Job is Complete)" rows={d.returnBopp} cols={["material","batchNo","qty","unit","signedBy","signedShift","signedDate","signedAt"]} sumCols={["qty"]} />
        {(()=>{
          const bw=d.boppWaste;
          if(!bw) return null;
          const rows=Array.isArray(bw)?bw:[bw];
          if(!rows.some(r=>r.printingBopp||r.rawBopp)) return null;
          const sumPrinting=rows.reduce((a,r)=>a+parseFloat(r.printingBopp||0),0);
          const sumRaw=rows.reduce((a,r)=>a+parseFloat(r.rawBopp||0),0);
          return <div style={{marginBottom:12}}>
            <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:6}}>BOPP WASTE</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:4,marginBottom:4}}>
              <div style={{fontSize:10,color:C.muted}}>Printing BOPP (kg)</div>
              <div style={{fontSize:10,color:C.muted}}>Raw BOPP (kg)</div>
              <div style={{fontSize:10,color:C.muted}}>Signed By</div>
              <div style={{fontSize:10,color:C.muted}}>Date</div>
              <div style={{fontSize:10,color:C.muted}}>Time</div>
            </div>
            {rows.map((r,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:4,padding:"6px 0",borderTop:`1px solid ${C.border}`}}>
                <div>
                  <div style={{color:C.text,fontWeight:600}}>{r.printingBopp||"0"} kg</div>
                  {r.printingComment&&<div style={{color:C.muted,fontSize:11,marginTop:2}}>{r.printingComment}</div>}
                </div>
                <div>
                  <div style={{color:C.text,fontWeight:600}}>{r.rawBopp||"0"} kg</div>
                  {r.rawComment&&<div style={{color:C.muted,fontSize:11,marginTop:2}}>{r.rawComment}</div>}
                </div>
                <div style={{color:C.success,fontWeight:600,fontSize:11}}>{r.signedBy||"—"}</div>
                <div style={{color:C.blue,fontSize:11}}>{r.signedDate||"—"}</div>
                <div style={{color:C.muted,fontSize:11}}>{r.signedAt||"—"}</div>
              </div>
            ))}
            {rows.length>1&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:4,padding:"5px 0",borderTop:`2px solid ${C.border}`,marginTop:2}}>
                <div style={{color:C.accent,fontWeight:700,fontSize:11}}>Σ {sumPrinting%1===0?sumPrinting:sumPrinting.toFixed(3)} kg</div>
                <div style={{color:C.accent,fontWeight:700,fontSize:11}}>Σ {sumRaw%1===0?sumRaw:sumRaw.toFixed(3)} kg</div>
                <div/><div/><div/>
              </div>
            )}
          </div>;
        })()}
        <DT title="Ink Input" rows={(d.inks||[]).map(i=>({...i,inkLabel:i.inkCode?(i.description||i.shade?`${i.inkCode} — ${i.description||i.shade}`:i.inkCode):""}))} cols={["inkLabel","inkType","batchNo","supplier","qty","returned","signedBy","signedShift","signedDate","signedAt"]} sumCols={["qty","returned"]} />
        <DT title="Solvent Input" rows={d.solvents} cols={["solvent","supplier","batchNo","qty","returned","signedBy","signedShift","signedDate","signedAt"]} sumCols={["qty","returned"]} />
        {d.remarks&&<div style={{marginTop:10}}><span style={{color:C.muted}}>Remarks: </span>{d.remarks}</div>}
      </div>;
    }

          {[["Date",h.date],["Shift",h.shift],["Job Card Number",h.jobNo],["Press",h.press],["Operator",h.operator]].map(([k,v])=>(

              {getSlotsForShift(h.shift).map(t=><th key={t} style={TH}>{t}</th>)}

            <tbody>{(d.readings||[]).map((row,i)=>(

        <div style={{display:"flex",gap:24,marginBottom:14,flexWrap:"wrap"}}>
          {[["Date",h.date],["Shift",h.shift],["Machine",h.machine],["Job Card Number",h.jobNo],["Customer",h.customer],["Product",h.productName],["Reel No.",h.reelNo],["Operator",h.operator],["Inspector",h.inspector]].map(([k,v])=>(

          ))}

        <div style={{marginBottom:12}}><span style={{color:C.muted}}>Overall: </span><span style={{fontWeight:700,color:d.overallResult==="APPROVED"?C.success:d.overallResult==="REJECTED"?C.danger:C.warn}}>{d.overallResult||"—"}</span></div>
        {(d.checks||[]).map((c,i)=>(
          <div key={i} style={{display:"flex",gap:10,padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{width:20,color:C.muted,textAlign:"right",flexShrink:0}}>{i+1}</span>
            <span style={{flex:2}}>{c.label}</span>
            <span style={{width:50,fontWeight:700,flexShrink:0,color:c.result==="Pass"?C.success:c.result==="Fail"?C.danger:C.muted}}>{c.result||"—"}</span>

      return <div style={{background:C.bg,padding:12,borderRadius:6,border:`1px solid ${C.border}`}}>

    function DT({title,rows,cols,sumCols=[]}){
      if(!rows?.length) return null;
      const colLabels={material:"Material",batchNo:"Batch No.",qty:"Qty",unit:"Unit",meters:"Meters",inkLabel:"Ink Code",inkType:"Type",supplier:"Supplier",returned:"Returned",solvent:"Solvent",time:"Time",signedBy:"Signed By",signedShift:"Shift",signedDate:"Date",signedAt:"Time"};
      const totals={};
      if(sumCols.length){
        sumCols.forEach(col=>{
          const sum=rows.reduce((acc,r)=>acc+parseFloat(r[col]||0),0);
          totals[col]=sum%1===0?sum:parseFloat(sum.toFixed(3));
        });
      }
      return <div style={{marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:6}}>{title.toUpperCase()}</div>
        <div style={{display:"flex",gap:4,marginBottom:4}}>{cols.map(c=><div key={c} style={{flex:1,fontSize:10,color:C.muted}}>{colLabels[c]||c.replace(/([A-Z])/g," $1")}</div>)}</div>
        {rows.map((r,i)=><div key={i} style={{display:"flex",gap:4,padding:"3px 0",borderTop:`1px solid ${C.border}`}}>
          {cols.map(c=><div key={c} style={{flex:1,color:c==="signedBy"?C.success:c==="signedDate"?C.blue:C.text,fontWeight:c==="signedBy"?600:400}}>{r[c]||"—"}</div>)}
        </div>)}
        {sumCols.length>0&&(
          <div style={{display:"flex",gap:4,padding:"5px 0",borderTop:`2px solid ${C.border}`,marginTop:2}}>
            {cols.map(c=>(
              <div key={c} style={{flex:1,color:sumCols.includes(c)?C.accent:C.muted,fontWeight:sumCols.includes(c)?700:400,fontSize:11}}>
                {sumCols.includes(c)?`Σ ${totals[c]}`:""}
              </div>
            ))}
          </div>
        )}
      </div>;
    }

    function UserMgmt({users,session,reload,flash}){
      const [form,setForm]=useState({username:"",password:"",name:"",role:"operator"});
      const [err,setErr]=useState("");
      const [editId,setEditId]=useState(null); const [editPerms,setEditPerms]=useState({});
      const [resetId,setResetId]=useState(null); const [resetPw,setResetPw]=useState("");
      const f=(k,v)=>setForm(p=>({...p,[k]:v}));
      const add=async()=>{
        if(!form.username||!form.password||!form.name){ setErr("All fields required."); return; }
        if(users.find(u=>u.username===form.username)){ setErr("Username taken."); return; }
        const perms=form.role==="admin"?null:(ROLE_DEFAULTS[form.role]||["dashboard","records"]);
        const {error}=await dbAddUser({username:form.username,password:form.password,name:form.name,role:form.role,permissions:perms});
        if(error){ setErr("Error: "+error.message); return; }
        setForm({username:"",password:"",name:"",role:"operator"}); setErr(""); await reload(); flash("User added.");
      };
      const del=async id=>{ if(id===session.id){ alert("Cannot delete yourself."); return; } await dbDelUser(id); await reload(); flash("User deleted."); };
      const startEdit=(u)=>{ setEditId(u.id); const perms=u.permissions||ROLE_DEFAULTS[u.role]||["dashboard","records"]; setEditPerms(Object.fromEntries(perms.map(p=>[p,true]))); };
      const savePerms=async(u)=>{ const perms=SHEET_OPTIONS.map(s=>s.id).filter(id=>editPerms[id]); if(editPerms.printingoee&&editPerms.printingoee_edit) perms.push("printingoee_edit"); if(editPerms.records&&editPerms.records_reject) perms.push("records_reject"); await sb.from("users").update({permissions:perms}).eq("id",u.id); await reload(); setEditId(null); flash("Permissions updated."); };
      const doReset=async(u)=>{ if(!resetPw.trim()){ flash("Password cannot be empty.","danger"); return; } await sb.from("users").update({password:resetPw}).eq("id",u.id); setResetId(null); setResetPw(""); await reload(); flash(`Password reset for ${u.name}.`); };
      const togglePerm=(id)=>setEditPerms(p=>({...p,[id]:!p[id]}));
      const rc=r=>r==="admin"?C.accent2:r==="manager"?C.accent:r==="qc"?C.blue:r==="viewer"?C.muted:C.success;
      return <div>
        <PH title="User Management" sub="Control user roles and which sheets each user can access" />
        <SC title="Add New User">
          <Grid cols={4}>
            <F label="Full Name"><TI value={form.name}     onChange={v=>f("name",v)} /></F>
            <F label="Username"><TI value={form.username}  onChange={v=>f("username",v)} /></F>
            <F label="Password"><TI value={form.password}  onChange={v=>f("password",v)} /></F>
            <F label="Role"><TS value={form.role} onChange={v=>f("role",v)} options={["admin","manager","operator","qc","viewer"]} /></F>
          </Grid>
          {err&&<div style={{color:C.danger,fontSize:12,marginTop:8}}>{err}</div>}
          <button style={{...S.btn("accent"),marginTop:12}} onClick={add}>Add User</button>
        </SC>
        <SC title="Current Users & Permissions">
          {users.map(u=>(
            <div key={u.id} style={{borderBottom:`1px solid ${C.border}`,padding:"14px 0"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:160}}>
                  <div style={{color:C.text,fontWeight:600,fontSize:13}}>{u.name}</div>
                  <div style={{color:C.muted,fontSize:11,marginTop:2}}>{u.username}</div>
                </div>
                <span style={{fontSize:10,padding:"2px 10px",borderRadius:4,background:rc(u.role)+"33",color:rc(u.role),fontWeight:700}}>{u.role.toUpperCase()}</span>
                {u.role!=="admin"&&<button style={S.btn("ghost",{padding:"4px 12px",fontSize:11,color:C.blue,outline:`1px solid ${C.blue}`})} onClick={()=>editId===u.id?setEditId(null):startEdit(u)}>{editId===u.id?"Cancel":"✎ Edit Permissions"}</button>}
                {u.id!==session.id&&<button style={S.btn("ghost",{padding:"4px 12px",fontSize:11,color:C.warn,outline:`1px solid ${C.warn}`})} onClick={()=>{ setResetId(resetId===u.id?null:u.id); setResetPw(""); }}>{resetId===u.id?"Cancel":"🔑 Reset Password"}</button>}
                {u.id!==session.id&&<button style={S.btn("danger",{padding:"4px 10px",fontSize:11})} onClick={()=>del(u.id)}>Delete</button>}
              </div>
              {resetId===u.id&&(
                <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",padding:12,background:C.bg,borderRadius:6,border:`1px solid ${C.warn}`}}>
                  <span style={{fontSize:11,color:C.warn,fontWeight:600,flexShrink:0}}>New password for {u.name}:</span>
                  <input style={{...S.input,maxWidth:220,padding:"5px 10px"}} type="text" value={resetPw} placeholder="Enter new password" onChange={e=>setResetPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doReset(u)} />
                  <button style={{...S.btn("accent",{padding:"5px 16px",fontSize:12}),background:C.warn}} onClick={()=>doReset(u)}>Save</button>
                </div>
              )}
              {editId!==u.id&&u.role!=="admin"&&(
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
                  {(u.permissions||ROLE_DEFAULTS[u.role]||[]).map(p=>{ const tab=ALL_TABS.find(t=>t.id===p); return tab?<span key={p} style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:`${C.accent}22`,color:C.accent}}>{tab.icon} {tab.label}</span>:null; })}
                </div>
              )}
              {editId===u.id&&(
                <div style={{marginTop:12,padding:14,background:C.bg,borderRadius:8,border:`1px solid ${C.border}`}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:10}}>SELECT ACCESSIBLE SHEETS</div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
                    {SHEET_OPTIONS.map(s=>(
                      <button key={s.id} onClick={()=>togglePerm(s.id)} style={{padding:"6px 14px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,background:editPerms[s.id]?C.accent:C.panel,color:editPerms[s.id]?"#fff":C.muted,outline:editPerms[s.id]?"none":`1px solid ${C.border}`,transition:"all 0.12s"}}>{s.label}</button>
                    ))}
                  </div>
                  {editPerms.printingoee&&(
                    <div style={{marginBottom:14,padding:"10px 12px",background:C.panel,borderRadius:8,border:`1px solid ${C.border}`}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:8}}>📊 PRINTING OEE ACCESS LEVEL</div>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                        {[[false,"View only"],[true,"View & edit"]].map(([val,label])=>{
                          const on=!!editPerms.printingoee_edit===val;
                          return <button key={label} onClick={()=>setEditPerms(p=>({...p,printingoee_edit:val}))} style={{padding:"6px 16px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,background:on?C.success:C.bg,color:on?"#fff":C.muted,outline:on?"none":`1px solid ${C.border}`,transition:"all 0.12s"}}>{label}</button>;
                        })}
                        <span style={{fontSize:11,color:C.muted}}>View only: see, filter and export. View & edit: also select and delete shift summaries.</span>
                      </div>
                    </div>
                  )}
                  {editPerms.records&&(
                    <div style={{marginBottom:14,padding:"10px 12px",background:C.panel,borderRadius:8,border:`1px solid ${C.border}`}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:8}}>☰ ALL RECORDS: REJECT / APPROVE</div>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                        {[[false,"Not allowed"],[true,"Allowed"]].map(([val,label])=>{
                          const on=!!editPerms.records_reject===val;
                          return <button key={label} onClick={()=>setEditPerms(p=>({...p,records_reject:val}))} style={{padding:"6px 16px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,background:on?C.success:C.bg,color:on?"#fff":C.muted,outline:`1px solid ${on?C.success:C.border}`}}>{label}</button>;
                        })}
                        <span style={{fontSize:11,color:C.muted}}>Allowed: can send a record back for resubmission (Reject) and master-approve stuck records from All Records. Admins always can.</span>
                      </div>
                    </div>
                  )}
                  <button style={S.btn("accent",{padding:"6px 20px",fontSize:12})} onClick={()=>savePerms(u)}>Save Permissions</button>
                </div>
              )}
            </div>
          ))}
        </SC>
      </div>;
    }

    // ── Lists Manager ─────────────────────────────────────────────────────────
    function ListsManager({appLists,reload,flash}){
      const [activeList,setActiveList]=useState("substrate");
      const [items,setItems]=useState([]);
      const [newVal,setNewVal]=useState(""); const [newCode,setNewCode]=useState("");
      const [saving,setSaving]=useState(false);
      const isInkCode=activeList==="ink_code";
      const isChecklist=["printing_qc_checks","lamination_qc_checks","extruder_qc_checks","slitting_qc_checks","bagmaking_qc_checks"].includes(activeList);
      const isCustomerProducts=activeList==="customer_products";
      const isProductInkCodes=activeList==="product_ink_codes";
      const isProductSpeeds=activeList==="product_speeds";
      const isShiftTimes=activeList==="shift_times";
      const isOeeParams=activeList==="oee_params";
      const isApprovalSettings=activeList==="approval_settings";
      const isIsoSettings=activeList==="iso_settings";

      // Customer Products state
      const [cpEntries,setCpEntries]=useState([]); // [{customer,products:[]}]
      const [cpSelected,setCpSelected]=useState(""); // which customer is expanded
      const [cpNewProd,setCpNewProd]=useState("");
      const [cpNewCustomer,setCpNewCustomer]=useState("");

      // Product Ink Codes state
      const [piEntries,setPiEntries]=useState([]); // [{product, inks:[...codes]}]
      const [piSelected,setPiSelected]=useState("");
      const [piNewInk,setPiNewInk]=useState("");
      const [piNewProduct,setPiNewProduct]=useState("");

      // Product Speeds state
      const [psEntries,setPsEntries]=useState([]);
      const [psSearch,setPsSearch]=useState("");

      // Shift Times state
      const [stTimes,setStTimes]=useState(()=>{ const sch=getShiftSchedule(DEFAULT_SHIFT_TIMES); return {...DEFAULT_SHIFT_TIMES,daySchedule:sch["Day Shift"],nightSchedule:sch["Night Shift"]}; });
      const setSched=(key,day,patch)=>setStTimes(p=>({...p,[key]:{...p[key],[day]:{...p[key][day],...patch}}}));
      // Changing a shift's default start/end also moves every day that was still on the old default
      const setDefaultTime=(sh,which,v)=>setStTimes(p=>{
        const field=sh+(which==="start"?"Start":"End");
        const key=sh+"Schedule";
        const old=p[field];
        const next=Object.fromEntries(Object.entries(p[key]).map(([d,e])=>[d,e[which]===old?{...e,[which]:v}:e]));
        return {...p,[field]:v,[key]:next};
      });

      // OEE Parameters state
      const [oeeParams,setOeeParams]=useState({maxSpeed:200,loadingFactor:70,downtimeProvision:20});
      const DEFAULT_APPROVAL={production:true,viscosity:false,printingqc:false,lamination:false,laminationqc:false,extruder1:false,extruder1qc:false,extruder2:false,extruder2qc:false,slitting1:false,slitting1qc:false,slitting2:false,slitting2qc:false,bagmaking1:false,bagmaking1qc:false,bagmaking2:false,bagmaking2qc:false,bagmaking3:false,bagmaking3qc:false,bagmaking4:false,bagmaking4qc:false};
      const [approvalSettings,setApprovalSettings]=useState({...DEFAULT_APPROVAL});
      const [isoGlobal,setIsoGlobal]=useState({companyName:"Golden Tree Holdings (Pty) Ltd t/a Concord Packaging",manualTitle:"Food Safety Management Manual",reviewedBy:"Food Safety Officer",approvedBy:"Managing Director",issueDate:"02 March 2021"});
      const [isoDocs,setIsoDocs]=useState({});
      const [isoSelected,setIsoSelected]=useState("production");
      const ISO_DOC_TYPES=[
        {id:"production",label:"Printing Production"},{id:"viscosity",label:"Viscosity QC"},{id:"printingqc",label:"Printing QC"},
        {id:"lamination",label:"Lamination"},{id:"laminationqc",label:"Lamination QC"},
        {id:"extruder1",label:"Extruder 1"},{id:"extruder1qc",label:"Extruder 1 QC"},
        {id:"extruder2",label:"Extruder 2"},{id:"extruder2qc",label:"Extruder 2 QC"},
        {id:"slitting1",label:"Slitting 1"},{id:"slitting1qc",label:"Slitting 1 QC"},
        {id:"slitting2",label:"Slitting 2"},{id:"slitting2qc",label:"Slitting 2 QC"},
        {id:"bagmaking1",label:"Bag Making 1"},{id:"bagmaking1qc",label:"Bag Making 1 QC"},
        {id:"bagmaking2",label:"Bag Making 2"},{id:"bagmaking2qc",label:"Bag Making 2 QC"},
        {id:"bagmaking3",label:"Bag Making 3"},{id:"bagmaking3qc",label:"Bag Making 3 QC"},
        {id:"bagmaking4",label:"Bag Making 4"},{id:"bagmaking4qc",label:"Bag Making 4 QC"},
      ];

      React.useEffect(()=>{
        if(isCustomerProducts){
          const raw=appLists.customer_products||[];
          setCpEntries(Array.isArray(raw)?raw:[]);
          return;
        }
        if(isProductInkCodes){
          const raw=appLists.product_ink_codes||[];
          setPiEntries(Array.isArray(raw)?raw:[]);
          return;
        }
        if(isProductSpeeds){
          const raw=appLists.product_speeds||DEFAULT_PRODUCT_SPEEDS;
          setPsEntries(Array.isArray(raw)?raw:[]);
          return;
        }
        if(isShiftTimes){
          const raw=appLists.shift_times||DEFAULT_SHIFT_TIMES;
          const merged={...DEFAULT_SHIFT_TIMES,...(typeof raw==="object"&&!Array.isArray(raw)?raw:{})};
          const sch=getShiftSchedule(merged);
          setStTimes({...merged,daySchedule:sch["Day Shift"],nightSchedule:sch["Night Shift"]});
          return;
        }
        if(isOeeParams){
          const raw=appLists.oee_params||{maxSpeed:200,loadingFactor:70,downtimeProvision:20};
          setOeeParams({maxSpeed:200,loadingFactor:70,downtimeProvision:20,...(typeof raw==="object"&&!Array.isArray(raw)?raw:{})});
          return;
        }
        if(isApprovalSettings){
          const raw=appLists.approval_settings||DEFAULT_APPROVAL;
          setApprovalSettings({...DEFAULT_APPROVAL,...(typeof raw==="object"&&!Array.isArray(raw)?raw:{})});
          return;
        }
        if(isIsoSettings){
          const rawG=appLists.iso_global||{};
          setIsoGlobal(p=>({...p,...rawG}));
          const rawD=appLists.iso_docs||{};
          setIsoDocs(rawD);
          return;
        }
        const raw=appLists[activeList]||[];
        if(isInkCode){ setItems(raw.map(x=>typeof x==="object"?x:{code:String(x),description:""})); }
        else { setItems(raw.map(x=>typeof x==="object"?(x.val||x.code||String(x)):String(x)).map(v=>({val:v}))); }
        setNewVal(""); setNewCode("");
      },[activeList,appLists]);

      const addItem=()=>{
        if(isInkCode){ if(!newCode.trim()) return; setItems(prev=>[...prev,{code:newCode.trim(),description:""}]); setNewCode(""); }
        else { if(!newVal.trim()) return; setItems(prev=>[...prev,{val:newVal.trim()}]); setNewVal(""); }
      };
      const removeItem=i=>setItems(prev=>prev.filter((_,x)=>x!==i));
      const editItem=(i,field,val)=>setItems(prev=>prev.map((item,x)=>x===i?{...item,[field]:val}:item));
      const moveItem=(i,dir)=>{ const next=[...items]; const swap=i+dir; if(swap<0||swap>=next.length) return; [next[i],next[swap]]=[next[swap],next[i]]; setItems(next); };
      const saveList=async()=>{
        setSaving(true);
        const toSave=isInkCode?items.map(x=>({code:x.code||"",description:x.description||""})).filter(x=>x.code):items.map(x=>x.val||"").filter(Boolean);
        await dbUpsertList(activeList,JSON.stringify(toSave)); await reload(); flash("List saved!"); setSaving(false);
      };

      // Customer Products helpers
      const cpSave=async(entries)=>{
        setSaving(true);
        await dbUpsertList("customer_products",JSON.stringify(entries));
        await reload(); flash("Customer products saved!"); setSaving(false);
      };
      const cpAddCustomer=()=>{
        const name=cpNewCustomer.trim();
        if(!name) return;
        if(cpEntries.find(e=>e.customer===name)){ flash("Customer already exists.","danger"); return; }
        const next=[...cpEntries,{customer:name,products:[]}];
        setCpEntries(next); setCpNewCustomer(""); setCpSelected(name);
      };
      const cpRemoveCustomer=(customer)=>{ const next=cpEntries.filter(e=>e.customer!==customer); setCpEntries(next); if(cpSelected===customer) setCpSelected(""); };
      const cpAddProduct=(customer)=>{
        if(!cpNewProd.trim()) return;
        const next=cpEntries.map(e=>e.customer===customer?{...e,products:[...e.products,cpNewProd.trim()]}:e);
        setCpEntries(next); setCpNewProd("");
      };
      const cpRemoveProduct=(customer,pi)=>{
        const next=cpEntries.map(e=>e.customer===customer?{...e,products:e.products.filter((_,xi)=>xi!==pi)}:e);
        setCpEntries(next);
      };
      const cpEditProduct=(customer,pi,val)=>{
        const next=cpEntries.map(e=>e.customer===customer?{...e,products:e.products.map((p,xi)=>xi===pi?val:p)}:e);
        setCpEntries(next);
      };
      const cpMoveProduct=(customer,pi,dir)=>{
        const next=cpEntries.map(e=>{
          if(e.customer!==customer) return e;
          const prods=[...e.products]; const swap=pi+dir;
          if(swap<0||swap>=prods.length) return e;
          [prods[pi],prods[swap]]=[prods[swap],prods[pi]];
          return {...e,products:prods};
        });
        setCpEntries(next);
      };

      const allListKeys=Object.keys(LIST_LABELS);

      // Product Ink Codes helpers
      const piSave=async(entries)=>{
        setSaving(true);
        await dbUpsertList("product_ink_codes",JSON.stringify(entries));
        await reload(); flash("Product ink codes saved!"); setSaving(false);
      };
      const piAddProduct=()=>{
        const name=piNewProduct.trim();
        if(!name) return;
        if(piEntries.find(e=>e.product===name)){ flash("Product already exists in this list.","danger"); return; }
        const next=[...piEntries,{product:name,inks:[]}];
        setPiEntries(next); setPiNewProduct(""); setPiSelected(name);
      };
      const piRemoveProduct=(product)=>{ const next=piEntries.filter(e=>e.product!==product); setPiEntries(next); if(piSelected===product) setPiSelected(""); };
      const piAddInk=(product)=>{
        if(!piNewInk.trim()) return;
        const next=piEntries.map(e=>e.product===product?{...e,inks:[...e.inks,piNewInk.trim()]}:e);
        setPiEntries(next); setPiNewInk("");
      };
      const piRemoveInk=(product,ii)=>{
        const next=piEntries.map(e=>e.product===product?{...e,inks:e.inks.filter((_,xi)=>xi!==ii)}:e);
        setPiEntries(next);
      };

      return <div>
        <PH title="Lists / Settings" sub="Manage dropdown options and QC check items" />

        {/* Tab strip */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20}}>
          <button onClick={()=>setActiveList("customer_products")} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:activeList==="customer_products"?C.blue:C.panel,color:activeList==="customer_products"?"#fff":C.muted,outline:activeList==="customer_products"?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>🏢 Customer Products</button>
          <button onClick={()=>setActiveList("product_ink_codes")} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:activeList==="product_ink_codes"?C.blue:C.panel,color:activeList==="product_ink_codes"?"#fff":C.muted,outline:activeList==="product_ink_codes"?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>🎨 Product Ink Codes</button>
          <button onClick={()=>setActiveList("product_speeds")} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:activeList==="product_speeds"?C.blue:C.panel,color:activeList==="product_speeds"?"#fff":C.muted,outline:activeList==="product_speeds"?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>📈 Product Speeds</button>

                    <select style={{...S.input,flex:1}} value={piNewInk} onChange={e=>setPiNewInk(e.target.value)}>

                    <button style={S.btn("accent",{padding:"6px 14px",fontSize:12,flexShrink:0})} onClick={()=>piAddInk(entry.product)}>+ Add</button>
                  </div>
                </div>}
              </div>;

          </SC>
          <button style={{...S.btn("accent"),padding:"12px 32px",fontSize:14}} onClick={()=>piSave(piEntries)} disabled={saving}>{saving?"Saving…":"💾 Save Product Ink Codes"}</button>
          <div style={{color:C.muted,fontSize:11,marginTop:8}}>These mappings are saved but inactive until <code style={{color:C.accent}}>FILTER_INKS_BY_PRODUCT</code> is set to <code style={{color:C.accent}}>true</code>.</div>

          <SC title="Product Speeds & Downtime">

              These values are used to calculate target meters per shift in the Efficiency Report.<br/>
              <strong>Target = Run Speed × Shift Minutes ÷ Downtime Factor</strong>
            </div>
            <input style={{...S.input,maxWidth:320,marginBottom:14}} value={psSearch} onChange={e=>setPsSearch(e.target.value)} placeholder="Search customer or product…" />
            <div style={{display:"grid",gridTemplateColumns:"2fr 3fr 100px 100px 40px",gap:6,marginBottom:6,padding:"0 4px"}}>
              {["Customer","Product","Run Speed (m/min)","Downtime",""].map(h=><div key={h} style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.06em"}}>{h}</div>)}
            </div>

              // Get products for this customer from customer_products or fall back to full list

              return (
              <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 3fr 100px 100px 40px",gap:6,marginBottom:4,alignItems:"center"}}>
                <select style={{...S.input,padding:"4px 8px",fontSize:11}} value={e.customer} onChange={ev=>setPsEntries(a=>a.map((x,xi)=>xi===i?{...x,customer:ev.target.value,product:""}:x))}>
                  <option value="">— Customer —</option>
                  {(()=>{
                    const custList=(appLists.customer||[]).map(String).filter(Boolean);
                    // Add current value if not in list
                    if(e.customer&&!custList.includes(e.customer)) custList.unshift(e.customer);
                    return custList.map(c=><option key={c} value={c}>{c}</option>);
                  })()}
                </select>
                <select style={{...S.input,padding:"4px 8px",fontSize:11}} value={e.product} onChange={ev=>setPsEntries(a=>a.map((x,xi)=>xi===i?{...x,product:ev.target.value}:x))}>
                  <option value="">— Product —</option>
                  {custProds.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
                <input type="number" style={{...S.input,padding:"4px 8px",fontSize:11}} value={e.runSpeed} onWheel={e=>e.target.blur()} onChange={ev=>setPsEntries(a=>a.map((x,xi)=>xi===i?{...x,runSpeed:parseFloat(ev.target.value)||0}:x))} placeholder="m/min" />
                <input type="number" step="0.1" style={{...S.input,padding:"4px 8px",fontSize:11}} value={e.downtime} onWheel={e=>e.target.blur()} onChange={ev=>setPsEntries(a=>a.map((x,xi)=>xi===i?{...x,downtime:parseFloat(ev.target.value)||1}:x))} placeholder="1.2" />
                <button style={S.btn("danger",{padding:"3px 7px",fontSize:11})} onClick={()=>setPsEntries(a=>a.filter((_,xi)=>xi!==i))}>✕</button>
              </div>

            <div style={{fontSize:12,color:C.muted,marginBottom:16,padding:"8px 12px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`,lineHeight:1.7}}>
              Set the working days for the Day and Night shift <strong style={{color:C.text}}>separately</strong>, and a start and end time for each day
              (so a Friday can finish early). Printing OEE uses these to work out each shift's scheduled length — available meters follow it,
              and downtime is only counted inside it. A night shift belongs to the day it <strong style={{color:C.text}}>starts</strong> on.
            </div>
            <Grid cols={2}>
              {[["day","Day Shift","daySchedule",C.accent],["night","Night Shift","nightSchedule",C.blue]].map(([sh,label,key,color])=>{
                const sched=stTimes[key]||{};
                const defS=stTimes[sh+"Start"]||(sh==="day"?"07:00":"19:00");
                const defE=stTimes[sh+"End"]||(sh==="day"?"19:00":"07:00");
                const lenOf=(st,en)=>{ const [a,b]=st.split(":").map(Number),[c,d]=en.split(":").map(Number); let l=(c*60+d)-(a*60+b); if(l<0) l+=1440; return l; };
                return <div key={sh} style={S.card}>
                  <div style={{fontSize:11,fontWeight:700,color,letterSpacing:"0.08em",marginBottom:12}}>{label.toUpperCase()}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:6}}>
                    <F label="Default start"><input type="time" style={S.input} value={defS} onChange={e=>setDefaultTime(sh,"start",e.target.value)} /></F>
                    <F label="Default end"><input type="time" style={S.input} value={defE} onChange={e=>setDefaultTime(sh,"end",e.target.value)} /></F>
                  </div>
                  <div style={{fontSize:10,color:C.muted,marginBottom:14}}>Days still on the default follow it when you change it. Edit a day below to override just that day.</div>
                  <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:8}}>WORKING DAYS</div>

                    const e=sched[day]||{on:false,start:defS,end:defE};
                    const len=lenOf(e.start,e.end);
                    return <div key={day} style={{display:"grid",gridTemplateColumns:"96px 1fr 14px 1fr 86px",gap:6,alignItems:"center",marginBottom:6,opacity:e.on?1:0.55}}>
                      <button onClick={()=>setSched(key,day,{on:!e.on})}
                        style={{padding:"6px 8px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,textAlign:"left",
                        background:e.on?color:C.panel,color:e.on?"#fff":C.muted,outline:e.on?"none":`1px solid ${C.border}`,transition:"all 0.1s"}}>{e.on?"✔ ":""}{day.slice(0,3)}</button>
                      <input type="time" disabled={!e.on} style={{...S.input,padding:"5px 8px"}} value={e.start} onChange={ev=>setSched(key,day,{start:ev.target.value})} />
                      <span style={{color:C.muted,fontSize:12,textAlign:"center"}}>→</span>
                      <input type="time" disabled={!e.on} style={{...S.input,padding:"5px 8px"}} value={e.end} onChange={ev=>setSched(key,day,{end:ev.target.value})} />
                      <span style={{fontSize:11,color:e.on?(len>0?C.text:C.danger):C.muted}}>{e.on?(len>0?fmtMins(len):"no length"):"off"}</span>
                    </div>;
                  })}
                  <div style={{fontSize:10,color:C.muted,marginTop:8}}>An end time earlier than the start means the shift finishes the next day.</div>
                </div>;
              })}
            </Grid>

              These values are used to calculate <strong style={{color:C.accent}}>Available Meters</strong> in the Efficiency Report.<br/>

            </div>

                <div style={{fontSize:11,color:C.muted,marginTop:8}}>The absolute maximum speed of your press.</div>

                </div>
              </div>
              <div style={S.card}>
                <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:12}}>DOWNTIME PROVISION</div>
                <F label="Downtime Provision (%)">
                  <input type="number" style={S.input} value={oeeParams.downtimeProvision} min="0" max="99" onChange={e=>setOeeParams(p=>({...p,downtimeProvision:parseFloat(e.target.value)||20}))} />

                  Available time = 100% − {oeeParams.downtimeProvision}% = <strong style={{color:C.accent}}>{100-oeeParams.downtimeProvision}% of shift</strong>
                </div>
              </div>
            </Grid>
            <div style={{...S.card,marginTop:8,background:C.accent+"11",border:`1px solid ${C.accent}33`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.accent,marginBottom:6}}>CALCULATED AVAILABLE METERS PER 12-HOUR SHIFT</div>
              <div style={{fontSize:22,fontWeight:800,color:C.accent}}>
