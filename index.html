    // ── Printing Live Component ───────────────────────────────────────────────
    function PrintingLive({session,appLists={}}){
      const [readings,setReadings]=useState([]);
      const [latest,setLatest]=useState(null);
      const [loading,setLoading]=useState(true);
      const [shiftMeters,setShiftMeters]=useState(0);
      const [avgSpeed,setAvgSpeed]=useState(0);
      const [downtimeEvents,setDowntimeEvents]=useState([]);
      const [lastShiftSaved,setLastShiftSaved]=useState(null);
      const [shiftDowntimeMins,setShiftDowntimeMins]=useState(0);
      const [liveWin,setLiveWin]=useState(null);

      // Get shift times from settings
      const shiftTimes=appLists.shift_times||{dayStart:"07:00",dayEnd:"19:00",nightStart:"19:00",nightEnd:"07:00"};
      const parseTime=t=>{ const [h,m]=(t||"00:00").split(":").map(Number); return h*60+m; };
      const localDateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const hhmm=ms=>new Date(ms).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",hour12:false});

      // The scheduled shift this tab reports on: the one running right now or,
      // outside scheduled hours (e.g. after an early Friday finish), the most
      // recent one that has started — frozen at its scheduled end, so nothing
      // after the stop is counted as downtime. Follows the working days and
      // per-day times set in Lists / Settings → Shift Times.
      const findLiveWindow=()=>{
        const nowMs=Date.now();
        const today=new Date(); today.setHours(0,0,0,0);
        let best=null;
        for(let i=3;i>=0;i--){
          const day=new Date(today); day.setDate(day.getDate()-i);
          const date=localDateStr(day);
          ["Day Shift","Night Shift"].forEach(shift=>{
            const w=getShiftWindow(shiftTimes,date,shift);
            if(!w.on) return;
            const st=w.start.getTime();
            if(st<=nowMs&&(!best||st>best.start.getTime())) best={...w,shift,date};
          });
        }
        if(best) best.active=nowMs<best.end.getTime();
        return best;
      };

      // ── Auto-delete raw readings older than 7 days ──────────────────────────
      const cleanOldReadings=async()=>{
        const cutoff=new Date();
        cutoff.setDate(cutoff.getDate()-7);
        await sb.from("machine_readings").delete().lt("created_at",cutoff.toISOString());
      };

      // ── Sum stopped time across a set of ascending-sorted readings ──────────
      // For each reading marked not-running, adds the time up to the NEXT
      // reading; the last reading (if still stopped) is closed out at endMs
      // (either "now" for the live view, or the shift boundary when saving a
      // finished shift's summary). Adds across the whole set — not capped —
      // so a shift with many stoppages still totals correctly.
      const sumDowntimeMinutes=(sortedAsc,endMs)=>{
        let mins=0;
        for(let i=0;i<sortedAsc.length;i++){
          if(sortedAsc[i].running) continue;
          const startMs=new Date(sortedAsc[i].created_at).getTime();
          const nextMs=(i+1<sortedAsc.length)?new Date(sortedAsc[i+1].created_at).getTime():endMs;
          if(nextMs>startMs) mins+=(nextMs-startMs)/60000;
        }
        return mins;
      };

      // ── Shift helpers ───────────────────────────────────────────────────────
      const PUSH_MINS=5;               // Opta pushes a reading every 5 minutes
      const MIN_COVERAGE=0.5;          // need at least half a shift's readings to save a summary
      const REF_MAX_MS=15*60000;       // reference reading must be within 15 min of shift start
      const DOWNTIME_TAIL_MS=10*60000; // don't count more than 10 min of stop after the last reading

      // Meters made across a set of ascending readings. meters_shift is a
      // running counter on the Opta that only resets when the board reboots
      // (not at shift change), so a reading's absolute value includes whatever
      // was counted before the shift began. Only the INCREASE between readings
      // belongs to the shift. refReading is the last reading before the shift
      // started, so the first interval isn't lost. If the counter drops, the
      // board rebooted and restarted from 0, so the new value is the meters
      // made since that reboot.
      const sumShiftMeters=(sortedAsc,refReading)=>{
        const pts=refReading?[refReading,...sortedAsc]:sortedAsc;
        let total=0;
        for(let i=1;i<pts.length;i++){
          const prev=parseFloat(pts[i-1].meters_shift||0);
          const curr=parseFloat(pts[i].meters_shift||0);
          total+= curr>=prev ? curr-prev : curr;
        }
        return total;
      };

      // Last reading before startMs, as long as it's recent enough to trust.
      const findRefReading=(ascAll,startMs)=>{
        for(let i=ascAll.length-1;i>=0;i--){
          const t=new Date(ascAll[i].created_at).getTime();
          if(t<startMs) return (startMs-t<=REF_MAX_MS)?ascAll[i]:null;
        }
        return null;
      };

      const readingsForShift=(ascAll,startMs,endMs)=>({
        list:ascAll.filter(r=>{ const t=new Date(r.created_at).getTime(); return t>=startMs&&t<endMs; }),
        ref:findRefReading(ascAll,startMs),
      });

      // A shift only gets a summary if the Opta reported for at least half of
      // it. Otherwise the row would be built from a handful of readings and
      // would be misleading (e.g. a board that only came back online at the
      // very end of the shift).
      const hasEnoughReadings=(list,shiftMins)=>list.length>=Math.floor((shiftMins/PUSH_MINS)*MIN_COVERAGE);

      // ── Save shift summary ──────────────────────────────────────────────────
      const saveShiftSummary=async(shiftDate,shift,shiftReadings,oeeParams,shiftEndMs,refReading)=>{
        if(!shiftReadings||shiftReadings.length===0) return;
        const runningR=shiftReadings.filter(r=>r.running&&r.speed>0);
        const sorted=[...shiftReadings].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
        const totalMeters=sumShiftMeters(sorted,refReading);
        const avgSpd=runningR.length>0?runningR.reduce((a,r)=>a+parseFloat(r.speed||0),0)/runningR.length:0;

        // The scheduled window for this date + shift (from Lists / Settings).
        // A shift that isn't scheduled gets no summary.
        const win=getShiftWindow(shiftTimes,shiftDate,shift);
        if(!win.on) return;

        // Downtime — sum of actual stopped time between readings, closed out at
        // the scheduled END of the shift (shiftEndMs) so nothing after a planned
        // stop is counted. The tail is capped so that if the Opta went offline
        // part-way through, the missing hours aren't counted as downtime.
        const lastMs=new Date(sorted[sorted.length-1].created_at).getTime();
        const endMs=Math.min(shiftEndMs||win.end.getTime(),win.end.getTime(),lastMs+DOWNTIME_TAIL_MS);
        const downtimeMins=Math.round(sumDowntimeMinutes(sorted,endMs));
        let stopCount=0;
        for(let i=0;i<sorted.length-1;i++){
          if(sorted[i].running&&!sorted[i+1].running) stopCount++;
        }

        // OEE
        const shiftMins=win.mins;   // scheduled length, not a fixed 12 h
        const oeeSpeed=Math.round((oeeParams?.maxSpeed||200)*((oeeParams?.loadingFactor||70)/100));
        const oeeAvail=(100-(oeeParams?.downtimeProvision||20))/100;
        const available=Math.round(oeeSpeed*shiftMins*oeeAvail);
        const oee=available>0?Math.min(Math.round((totalMeters/available)*100),999):0;

        // scheduled_mins freezes the scheduled length as it was when the report was
        // saved, so later changes to Shift Times never rewrite history. If the column
        // hasn't been added to Supabase yet, save without it so nothing breaks.
        const row={
          shift_date:shiftDate,
          shift,
          total_meters:Math.round(totalMeters),
          avg_speed:Math.round(avgSpd*10)/10,
          downtime_mins:downtimeMins,
          stop_count:stopCount,
          oee_percent:oee,
        };
        let up=await sb.from("shift_summaries").upsert({...row,scheduled_mins:shiftMins},{onConflict:"shift_date,shift"});
        if(up.error&&/scheduled_mins/i.test(up.error.message||"")) up=await sb.from("shift_summaries").upsert(row,{onConflict:"shift_date,shift"});

        setLastShiftSaved(`${shift} ${shiftDate} saved`);
      };

      // ── Fetch readings and calculate shift stats ────────────────────────────
      const fetchReadings=async()=>{
        // Delete old readings on every fetch cycle (runs silently)
        cleanOldReadings();

        // Fetch last 200 readings (enough for a full shift + history)
        const {data}=await sb.from("machine_readings")
          .select("*")
          .order("created_at",{ascending:false})
          .limit(200);

        if(data&&data.length>0){
          setLatest(data[0]);
          setReadings(data.slice(0,10));

          // Which scheduled shift are we reporting on? (see findLiveWindow)
          const lw=findLiveWindow();
          setLiveWin(lw?{shift:lw.shift,date:lw.date,active:lw.active,start:lw.start.getTime(),end:lw.end.getTime()}:null);
          const winStartMs=lw?lw.start.getTime():0;
          const winEndMs=lw?(lw.active?Infinity:lw.end.getTime()):0;
          const closeMs=lw?(lw.active?Date.now():lw.end.getTime()):0;
          const shiftReadings=lw?data.filter(r=>{ const t=new Date(r.created_at).getTime(); return t>=winStartMs&&t<winEndMs; }):[];

          // Meters — only the increase since the shift began (see sumShiftMeters)
          const ascAll=[...data].reverse(); // data arrives newest-first
          if(shiftReadings.length>0){
            const sorted=[...shiftReadings].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
            setShiftMeters(sumShiftMeters(sorted,findRefReading(ascAll,winStartMs)));

            // Downtime — the actual stopped time between readings, only inside the
            // scheduled shift: it runs up to now while the shift is on, and is
            // closed at the scheduled end afterwards (so an early finish isn't
            // counted as downtime).
            setShiftDowntimeMins(sumDowntimeMinutes(sorted,closeMs));
          } else {
            setShiftMeters(0);
            setShiftDowntimeMins(0);
          }

          // Average speed
          const runningR=shiftReadings.filter(r=>r.running&&r.speed>0);
          if(runningR.length>0){
            setAvgSpeed(runningR.reduce((a,r)=>a+parseFloat(r.speed||0),0)/runningR.length);
          } else {
            setAvgSpeed(0);
          }

          // Downtime events
          const events=[];
          for(let i=0;i<shiftReadings.length-1;i++){
            if(!shiftReadings[i].running&&shiftReadings[i+1].running){
              const dur=Math.round((new Date(shiftReadings[i].created_at)-new Date(shiftReadings[i+1].created_at))/60000);
              if(dur>0) events.push({stopped:shiftReadings[i+1].created_at,resumed:shiftReadings[i].created_at,duration:dur,active:false});
            }
          }
          const lastR=shiftReadings[0];
          if(lw&&lw.active&&lastR&&!lastR.running){
            const lastRunIdx=shiftReadings.findIndex(r=>r.running);
            const stopStart=lastRunIdx>=0?shiftReadings[lastRunIdx-1]?.created_at||shiftReadings[lastRunIdx].created_at:shiftReadings[shiftReadings.length-1].created_at;
            const curDur=Math.round((Date.now()-new Date(stopStart).getTime())/60000);
            if(curDur>0) events.unshift({stopped:stopStart,resumed:null,duration:curDur,active:true});
          }
          setDowntimeEvents(events.slice(0,5));
        }
        setLoading(false);
      };

      // ── Save finished shifts (and catch up on any that were missed) ─────────
      // Saves every finished, SCHEDULED shift from the last 7 days (the raw
      // readings are deleted after 7) that has enough readings but no summary
      // row. It runs when the page loads and every 10 minutes while the app is
      // open, so a shift is saved shortly after it ends — whichever screen is
      // up — and one that was missed gets recovered the next time anyone opens
      // the app. Unscheduled shifts (non-working days) never get a row.
      const SETTLE_MS=10*60000;   // give the shift's last reading time to arrive
      const skippedRef=React.useRef(new Set());
      const backfillShifts=async()=>{
        try{
          const nowMs=Date.now();
          const cutoffMs=nowMs-7*24*3600*1000;
          const today=new Date(); today.setHours(0,0,0,0);
          const candidates=[];
          for(let i=8;i>=0;i--){
            const day=new Date(today); day.setDate(day.getDate()-i);
            const date=localDateStr(day);
            ["Day Shift","Night Shift"].forEach(shift=>{
              const w=getShiftWindow(shiftTimes,date,shift);
              if(!w.on) return;
              if(w.start.getTime()<cutoffMs||w.end.getTime()+SETTLE_MS>nowMs) return;
              candidates.push({date,shift,start:w.start,end:w.end,mins:w.mins});
            });
          }
          candidates.sort((a,b)=>a.start-b.start);
          if(candidates.length===0) return;

          const {data:existing,error:exErr}=await sb.from("shift_summaries").select("shift_date,shift").gte("shift_date",candidates[0].date);
          if(exErr) return;
          const have=new Set((existing||[]).map(s=>`${String(s.shift_date).substring(0,10)}_${s.shift}`));
          const keyOf=w=>`${w.date}_${w.shift}_${w.start.getTime()}_${w.end.getTime()}`;
          const missing=candidates.filter(w=>!have.has(`${w.date}_${w.shift}`)&&!skippedRef.current.has(keyOf(w)));
          if(missing.length===0) return;

          // Pull the readings (in pages — the API returns at most 1000 rows per request)
          const fromIso=new Date(missing[0].start.getTime()-REF_MAX_MS).toISOString();
          let all=[]; let from=0; const PAGE=1000;
          while(true){
            const {data:page,error}=await sb.from("machine_readings").select("*").gte("created_at",fromIso).order("created_at",{ascending:true}).range(from,from+PAGE-1);
            if(error||!page) return;
            all=all.concat(page);
            if(page.length<PAGE) break;
            from+=PAGE;
          }

          let saved=0;
          for(const w of missing){
            const {list,ref}=readingsForShift(all,w.start.getTime(),w.end.getTime());
            if(!hasEnoughReadings(list,w.mins)){ skippedRef.current.add(keyOf(w)); continue; }
            await saveShiftSummary(w.date,w.shift,list,appLists.oee_params,w.end.getTime(),ref);
            saved++;
          }
          if(saved>0) setLastShiftSaved(`${saved} shift${saved>1?"s":""} saved`);
        }catch(e){ /* silent — it will try again on the next pass */ }
      };

      // Always run the latest version of each function (so a settings change
      // takes effect without a page reload)
      const fetchRef=React.useRef(); fetchRef.current=fetchReadings;
      const backfillRef=React.useRef(); backfillRef.current=backfillShifts;

      React.useEffect(()=>{
        fetchRef.current();
        const interval=setInterval(()=>fetchRef.current(),10000);
        return ()=>clearInterval(interval);
      },[]);

      React.useEffect(()=>{
        backfillRef.current();
        const iv=setInterval(()=>backfillRef.current(),10*60*1000);
        return ()=>clearInterval(iv);
      },[]);

      const isRunning=latest?.running===true;
      const speed=parseFloat(latest?.speed||0);
      const lastSeen=latest?new Date(latest.created_at).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}):"—";
      const totalDowntime=downtimeEvents.reduce((a,e)=>a+e.duration,0);
      const TARGET_SPEED=130;
      const speedColor=speed>=TARGET_SPEED*0.9?C.success:speed>=TARGET_SPEED*0.7?C.warn:speed>0?C.danger:C.muted;

      return <div>
        <PH title="Printing Live" sub="Live machine data from Arduino Opta — updates every 10 seconds" />
        {lastShiftSaved&&<div style={{fontSize:10,color:C.success,textAlign:"right",marginBottom:8}}>✔ Shift summary saved: {lastShiftSaved}</div>}

        {loading
          ?<div style={{...S.card,textAlign:"center",padding:40,color:C.muted}}>Loading live data…</div>
          :<div>
            {/* ── Status banner ── */}
            <div style={{...S.card,marginBottom:16,padding:20,background:isRunning?C.success+"11":C.danger+"11",border:`1px solid ${isRunning?C.success:C.danger}44`,display:"flex",alignItems:"center",gap:16}}>
              <div style={{width:16,height:16,borderRadius:"50%",background:isRunning?C.success:C.danger,boxShadow:`0 0 12px ${isRunning?C.success:C.danger}`,flexShrink:0}} />
              <div style={{flex:1}}>
                <div style={{fontSize:18,fontWeight:800,color:isRunning?C.success:C.danger}}>{isRunning?"▶ MACHINE RUNNING":"■ MACHINE STOPPED"}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>Last reading: {lastSeen} · Shift: {liveWin?(liveWin.shift+(liveWin.active?"":" (finished "+hhmm(liveWin.end)+")")):"none scheduled"}</div>
                {liveWin&&!liveWin.active&&<div style={{fontSize:10,color:C.warn,marginTop:3}}>Outside scheduled hours — showing the last scheduled shift. Nothing after its end counts as downtime.</div>}
              </div>
              {!isRunning&&latest&&<div style={{fontSize:12,color:C.danger,fontWeight:600}}>
                Stopped for {Math.round((Date.now()-new Date(latest.created_at).getTime())/60000)} min
              </div>}
            </div>

            {/* ── Stats cards ── */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
              {[
                {label:"CURRENT SPEED",    value:isRunning?speed.toFixed(1)+" m/min":"0 m/min",    color:speedColor},
                {label:"AVERAGE SPEED",    value:avgSpeed>0?avgSpeed.toFixed(1)+" m/min":"—",       color:C.blue,         sub:"Running time only"},
                {label:"METERS THIS SHIFT",value:shiftMeters>0?Math.round(shiftMeters).toLocaleString()+" m":"0 m", color:C.accent, sub:"Since shift start"},
                {label:"DOWNTIME TODAY",   value:shiftDowntimeMins>0?Math.round(shiftDowntimeMins)+" min":"0 min", color:shiftDowntimeMins>60?C.danger:shiftDowntimeMins>0?C.warn:C.muted, sub:`${downtimeEvents.length} recent stop${downtimeEvents.length!==1?"s":""} shown below`},
              ].map(({label,value,color,sub})=>(
                <div key={label} style={{...S.card,textAlign:"center",padding:16,marginBottom:0}}>
                  <div style={{fontSize:9,color:C.muted,letterSpacing:"0.08em",marginBottom:8}}>{label}</div>
                  <div style={{fontSize:22,fontWeight:800,color}}>{value}</div>
                  {sub&&<div style={{fontSize:10,color:C.muted,marginTop:4}}>{sub}</div>}
                </div>
              ))}
            </div>

            {/* ── Speed gauge ── */}
            {isRunning&&<div style={{...S.card,marginBottom:16,padding:14}}>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <div style={{fontSize:11,color:C.muted,fontWeight:600,flexShrink:0,width:100}}>SPEED</div>
                <div style={{flex:1,height:20,background:C.border,borderRadius:10,overflow:"hidden"}}>
                  <div style={{width:`${Math.min((speed/200)*100,100)}%`,height:"100%",background:speedColor,borderRadius:10,transition:"width 0.5s",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:8}}>
                    {speed>20&&<span style={{fontSize:11,fontWeight:700,color:"#fff"}}>{speed.toFixed(1)}</span>}
                  </div>
                </div>
                <div style={{fontSize:11,color:C.muted,flexShrink:0}}>max 200</div>
              </div>
              <div style={{fontSize:10,color:C.muted,marginTop:8,display:"flex",gap:16}}>
                <span><span style={{color:C.success}}>■</span> ≥{Math.round(TARGET_SPEED*0.9)} m/min good</span>
                <span><span style={{color:C.warn}}>■</span> ≥{Math.round(TARGET_SPEED*0.7)} m/min low</span>
                <span><span style={{color:C.danger}}>■</span> &lt;{Math.round(TARGET_SPEED*0.7)} m/min critical</span>
              </div>
            </div>}

            {/* ── Downtime events ── */}
            {downtimeEvents.length>0&&<div style={{...S.card,marginBottom:16}}>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:12}}>MOST RECENT STOPPAGES THIS SHIFT</div>
              {downtimeEvents.map((e,i)=>(
                <div key={i} style={{display:"flex",gap:12,padding:"8px 0",borderTop:i>0?`1px solid ${C.border}`:"none",alignItems:"center"}}>
                  <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:C.danger+"22",color:C.danger,fontWeight:700,whiteSpace:"nowrap"}}>
                    {e.active?"⏱ ":""}{e.duration} min{e.active?" (ongoing)":""}
                  </span>
                  <span style={{fontSize:11,color:C.muted}}>
                    Stopped: {new Date(e.stopped).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",hour12:false})}
                    {e.resumed?" → Resumed: "+new Date(e.resumed).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",hour12:false}):" → Still stopped"}
                  </span>
                </div>
              ))}
              <div style={{fontSize:10,color:C.muted,marginTop:8,borderTop:`1px solid ${C.border}`,paddingTop:8}}>
                Total downtime this shift: <strong style={{color:C.danger}}>{Math.round(shiftDowntimeMins)} min</strong> (list above shows only the {downtimeEvents.length} most recent)
              </div>
            </div>}

            {/* ── Last 10 readings ── */}
            <div style={S.card}>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:12}}>LAST 10 READINGS</div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead>
                  <tr style={{borderBottom:`1px solid ${C.border}`}}>
                    {["Date","Time","Speed (m/min)","Meters Shift","Status"].map(h=>(
                      <th key={h} style={{padding:"4px 10px",color:C.muted,fontWeight:600,textAlign:"left",fontSize:10}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {readings.map((r,i)=>(
                    <tr key={r.id} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"transparent":C.panel+"44"}}>
                      <td style={{padding:"6px 10px",color:C.muted,whiteSpace:"nowrap"}}>{new Date(r.created_at).toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"})}</td>
                      <td style={{padding:"6px 10px",color:C.muted,whiteSpace:"nowrap"}}>{new Date(r.created_at).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}</td>
                      <td style={{padding:"6px 10px",color:r.running?speedColor:C.muted,fontWeight:r.running?700:400}}>{r.running?parseFloat(r.speed||0).toFixed(1):"—"}</td>
                      <td style={{padding:"6px 10px",color:C.text}}>{Math.round(parseFloat(r.meters_shift||0)).toLocaleString()} m</td>
                      <td style={{padding:"6px 10px"}}>
                        <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:r.running?C.success+"22":C.danger+"22",color:r.running?C.success:C.danger,fontWeight:700}}>
                          {r.running?"▶ Running":"■ Stopped"}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{fontSize:10,color:C.muted,marginTop:8,textAlign:"right"}}>Auto-refreshes every 10 seconds · Raw data auto-deleted after 7 days</div>
            </div>
          </div>
        }
      </div>;
    }


    // ── Printing OEE Component ────────────────────────────────────────────────
    function PrintingOEE({appLists={},session,canEdit=false,records=[],syncTick=0}){
      const [summaries,setSummaries]=useState([]);
      const [loading,setLoading]=useState(true);
      const [filterMonth,setFilterMonth]=useState("all");
      const [filterYear,setFilterYear]=useState("all");
      const [filterShift,setFilterShift]=useState("all");
      const [filterOperator,setFilterOperator]=useState("all");
      const [selected,setSelected]=useState(new Set());
      const [deleting,setDeleting]=useState(false);
      // "View & edit" permission (set per user in User Mgmt → Edit Permissions).
      // Admins always have it. View-only users can still filter and export.
      const canEditRows=canEdit||session?.role==="admin";

      const oeeParams=appLists.oee_params||{maxSpeed:200,loadingFactor:70,downtimeProvision:20};
      const shiftTimes=appLists.shift_times||{dayStart:"07:00",dayEnd:"19:00"};
      const parseTime=t=>{ const [h,m]=(t||"00:00").split(":").map(Number); return h*60+m; };
      const oeeSpeed=Math.round((oeeParams.maxSpeed||200)*((oeeParams.loadingFactor||70)/100));
      const oeeAvail=(100-(oeeParams.downtimeProvision||20))/100;

      const fetchSummaries=async()=>{
        const {data}=await sb.from("shift_summaries")
          .select("*")
          .order("shift_date",{ascending:false})
          .limit(200);
        let rows=data||[];
        // One-time freeze: rows saved before scheduled_mins existed get the schedule
        // that applies right now. (Only when the column exists in Supabase.)
        if(rows.length>0&&("scheduled_mins" in rows[0])){
          const unstamped=rows.filter(r=>r.scheduled_mins===null||r.scheduled_mins===undefined);
          if(unstamped.length>0){
            await Promise.all(unstamped.map(r=>{
              const w=getShiftWindow(shiftTimes,r.shift_date,r.shift);
              r.scheduled_mins=w.on?w.mins:0;
              return sb.from("shift_summaries").update({scheduled_mins:r.scheduled_mins}).eq("id",r.id);
            }));
          }
        }
        setSummaries(rows);
        setLoading(false);
      };

      React.useEffect(()=>{ fetchSummaries(); },[syncTick]);

      const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
      const allYears=[...new Set(summaries.map(s=>s.shift_date?.substring(0,4)).filter(Boolean))].sort().reverse();

      // ── Who ran each shift ───────────────────────────────────────────────────
      // Names come from the PIN sign-offs on the printing reels in the Production
      // sheets (the same source the Efficiency Report's per-operator view uses),
      // matched by the exact moment of each sign-off to the shift's scheduled window.
      // They are looked up here, not stored, so a long job's names appear for every
      // shift as soon as its sheet is closed. Until then the cell shows a dash.
      const signOffs=React.useMemo(()=>{
        const ev=[];
        (records||[]).forEach(r=>{
          if(r.type!=="production") return;
          (r.data?.rawOut||[]).forEach(x=>{
            if(!x.signedBy) return;
            const ms=signedMs(x.signedDate,x.signedAt);
            if(ms) ev.push({ms,name:x.signedBy});
          });
        });
        return ev.sort((a,b)=>a.ms-b.ms);
      },[records]);

      const opsById=React.useMemo(()=>{
        const map=new Map();
        summaries.forEach(s=>{
          const w=getShiftWindow(shiftTimes,s.shift_date,s.shift);
          const names=[];
          if(w.on){
            const a=w.start.getTime(), b=w.end.getTime();
            for(const e of signOffs){ if(e.ms>=a&&e.ms<b&&!names.includes(e.name)) names.push(e.name); }
          }
          map.set(s.id,names);
        });
        return map;
      },[summaries,signOffs,shiftTimes]);

      const allOperators=[...new Set([].concat(...opsById.values()))].sort((a,b)=>a.localeCompare(b));

      const filtered=summaries.filter(s=>{
        if(filterYear!=="all"&&!s.shift_date?.startsWith(filterYear)) return false;
        if(filterMonth!=="all"&&s.shift_date?.substring(5,7)!==filterMonth) return false;
        if(filterShift!=="all"&&s.shift!==filterShift) return false;
        if(filterOperator!=="all"&&!(opsById.get(s.id)||[]).includes(filterOperator)) return false;
        return true;
      });

      // Each row is measured against the shift that was SCHEDULED for its date
      // (working days + per-day times from Lists / Settings → Shift Times), not a
      // fixed 12 hours. A shift that wasn't scheduled has no available time, so it
      // is flagged "Unscheduled" and left out of the OEE figures.
      const rowCalc=(s)=>{
        // Use the scheduled length frozen when the report was saved; only rows
        // without one fall back to the current Shift Times.
        const frozen=(s.scheduled_mins!==null&&s.scheduled_mins!==undefined);
        const w=frozen?{on:s.scheduled_mins>0,mins:s.scheduled_mins}:getShiftWindow(shiftTimes,s.shift_date,s.shift);
        const avail=w.on?Math.round(oeeSpeed*w.mins*oeeAvail):0;
        const meters=parseFloat(s.total_meters||0);
        return {scheduled:w.on,mins:w.mins,avail,meters,oee:avail>0?Math.min(Math.round((meters/avail)*100),999):null};
      };
      const totalsFor=(list)=>{
        const calcs=list.map(rowCalc);
        const sched=calcs.filter(c=>c.avail>0);
        const availT=sched.reduce((a,c)=>a+c.avail,0);
        const schedMeters=sched.reduce((a,c)=>a+c.meters,0);
        const withSpeed=list.filter(s=>s.avg_speed>0);
        return {
          totalMeters:list.reduce((a,s)=>a+parseFloat(s.total_meters||0),0),
          avgSpeedAll:withSpeed.length>0?withSpeed.reduce((a,s)=>a+parseFloat(s.avg_speed||0),0)/withSpeed.length:0,
          totalDowntime:list.reduce((a,s)=>a+parseInt(s.downtime_mins||0),0),
          totalStops:list.reduce((a,s)=>a+(s.stop_count||0),0),
          totalAvailable:availT,
          scheduledMins:sched.reduce((a,c)=>a+c.mins,0),
          unscheduledCount:calcs.length-sched.length,
          overallOEE:availT>0?Math.min(Math.round((schedMeters/availT)*100),999):0,
        };
      };
      const {totalMeters,avgSpeedAll,totalDowntime,totalStops,totalAvailable,scheduledMins,unscheduledCount,overallOEE}=totalsFor(filtered);
      const effColor=e=>e>=90?C.success:e>=70?C.warn:C.danger;

      const allSelected=filtered.length>0&&filtered.every(s=>selected.has(s.id));
      const toggleSel=(e,id)=>{ e.stopPropagation(); const next=new Set(selected); if(next.has(id)) next.delete(id); else next.add(id); setSelected(next); };
      const toggleAll=()=>{ if(allSelected) setSelected(new Set()); else setSelected(new Set(filtered.map(s=>s.id))); };
      const deleteSelected=async()=>{
        if(!canEditRows) return;
        // Only rows currently shown can be deleted, so a filter change can never
        // delete something the user can't see.
        const visibleIds=new Set(filtered.map(s=>s.id));
        const ids=[...selected].filter(id=>visibleIds.has(id));
        if(ids.length===0) return;
        if(!window.confirm(`Permanently delete ${ids.length} shift summar${ids.length>1?"ies":"y"}? This cannot be undone.`)) return;
        setDeleting(true);
        for(const id of ids){ await sb.from("shift_summaries").delete().eq("id",id); }
        setSelected(new Set());
        await fetchSummaries();
        setDeleting(false);
      };

      const exportToExcel=()=>{
        const rows=(selected.size>0?filtered.filter(s=>selected.has(s.id)):filtered);
        const T=totalsFor(rows);
        const wb=XLSX.utils.book_new();
        const data=[["Date","Shift","Operator(s)","Total Meters","Avg Speed (m/min)","Downtime (min)","Stops","Scheduled (min)","Available (m)","OEE (%)"]];
        rows.forEach(s=>{
          const c=rowCalc(s);
          data.push([
            s.shift_date, s.shift,
            (opsById.get(s.id)||[]).join(", "),
            Math.round(s.total_meters||0),
            Math.round((parseFloat(s.avg_speed||0))*10)/10,
            s.downtime_mins||0,
            s.stop_count||0,
            c.scheduled?c.mins:0,
            c.avail,
            c.oee===null?"Unscheduled":c.oee,
          ]);
        });
        data.push([]);
        data.push(["TOTALS","","",Math.round(T.totalMeters),Math.round(T.avgSpeedAll*10)/10,T.totalDowntime,T.totalStops,T.scheduledMins,T.totalAvailable,T.overallOEE]);
        const ws=XLSX.utils.aoa_to_sheet(data);
        ws["!cols"]=[{wch:14},{wch:12},{wch:28},{wch:14},{wch:16},{wch:14},{wch:8},{wch:16},{wch:14},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws,"Printing OEE");
        XLSX.writeFile(wb,`Printing-OEE-${todayStr()}.xlsx`);
      };

      return <div>
        <PH title="Printing OEE" sub={"Shift summaries — automatically saved at end of each shift"+(canEditRows?"":" · View only")} />
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
          <select style={{...S.input,width:120}} value={filterYear} onChange={e=>{ setFilterYear(e.target.value); setSelected(new Set()); }}>
            <option value="all">All Years</option>
            {allYears.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select style={{...S.input,width:140}} value={filterMonth} onChange={e=>{ setFilterMonth(e.target.value); setSelected(new Set()); }}>
            <option value="all">All Months</option>
            {MONTHS.map((m,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{m}</option>)}
          </select>
          <select style={{...S.input,width:140}} value={filterShift} onChange={e=>{ setFilterShift(e.target.value); setSelected(new Set()); }}>
            <option value="all">All Shifts</option>
            <option value="Day Shift">☀ Day Shift</option>
            <option value="Night Shift">🌙 Night Shift</option>
          </select>
          <select style={{...S.input,width:170}} value={filterOperator} onChange={e=>{ setFilterOperator(e.target.value); setSelected(new Set()); }}>
            <option value="all">All Operators</option>
            {allOperators.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
          {(filterYear!=="all"||filterMonth!=="all"||filterShift!=="all"||filterOperator!=="all")&&(
            <button style={S.btn("ghost",{padding:"6px 12px",fontSize:11})} onClick={()=>{ setFilterYear("all"); setFilterMonth("all"); setFilterShift("all"); setFilterOperator("all"); setSelected(new Set()); }}>✕ Clear</button>
          )}
          <div style={{flex:1}} />
          {canEditRows&&filtered.length>0&&<div style={{display:"flex",alignItems:"center",gap:8}}>
            <div onClick={toggleAll} style={{width:18,height:18,border:`1px solid ${allSelected?C.success:C.muted}`,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",background:allSelected?C.success:C.bg,color:"#fff",fontSize:12,cursor:"pointer",flexShrink:0}}>
              {allSelected&&"✔"}
            </div>
            <span style={{fontSize:11,color:C.muted,cursor:"pointer"}} onClick={toggleAll}>
              {allSelected?"Deselect All":`Select All (${filtered.length})`}
            </span>
          </div>}
          {selected.size>0&&<span style={{fontSize:11,color:C.accent,fontWeight:600}}>{selected.size} selected</span>}
          {selected.size>0&&canEditRows&&(
            <button style={S.btn("danger",{padding:"6px 16px",fontSize:11})} onClick={deleteSelected} disabled={deleting}>
              {deleting?"Deleting…":`🗑 Delete Selected (${selected.size})`}
            </button>
          )}
          {selected.size>0&&<button style={S.btn("ghost",{padding:"6px 16px",fontSize:11})} onClick={()=>setSelected(new Set())}>Clear Selection</button>}
          <button style={{...S.btn("accent",{padding:"6px 16px",fontSize:11}),background:C.success}} onClick={exportToExcel}>↓ Export to Excel {selected.size>0?`(${selected.size})`:""}</button>
          <button style={S.btn("ghost",{padding:"6px 14px",fontSize:11})} onClick={fetchSummaries}>↺ Refresh</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
          {[
            {label:"SHIFTS",       value:filtered.length,                                  color:C.blue},
            {label:"TOTAL METERS", value:Math.round(totalMeters).toLocaleString()+" m",    color:C.accent},
            {label:"AVG SPEED",    value:avgSpeedAll>0?avgSpeedAll.toFixed(1)+" m/min":"—",color:C.text},
            {label:"OVERALL OEE",  value:overallOEE>0?overallOEE+"%":"—",                  color:effColor(overallOEE)},
          ].map(({label,value,color})=>(
            <div key={label} style={{...S.card,textAlign:"center",padding:16,marginBottom:0}}>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.08em",marginBottom:8}}>{label}</div>
              <div style={{fontSize:22,fontWeight:800,color}}>{value}</div>
            </div>
          ))}
        </div>
        {loading
          ?<div style={{...S.card,textAlign:"center",padding:40,color:C.muted}}>Loading…</div>
          :filtered.length===0
            ?<div style={{...S.card,textAlign:"center",padding:40,color:C.muted}}>No shift summaries yet — saved automatically at shift end.</div>
            :<div style={S.card}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead>
                  <tr style={{borderBottom:`2px solid ${C.border}`}}>
                    {canEditRows&&<th style={{padding:"8px 10px",width:32}}></th>}
                    {["Date","Shift","Operator(s)","Total Meters","Avg Speed","Downtime","Stops","Scheduled","Available","OEE"].map(h=>(
                      <th key={h} style={{padding:"8px 10px",color:C.muted,fontWeight:600,textAlign:h==="Date"||h==="Shift"||h==="Operator(s)"?"left":"right",fontSize:10}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((s,i)=>{
                    const c=rowCalc(s);
                    const avail=c.avail;
                    const oee=c.oee;
                    return (
                    <tr key={s.id} style={{borderBottom:`1px solid ${C.border}`,background:selected.has(s.id)?C.success+"11":i%2===0?"transparent":C.panel+"44"}} onClick={canEditRows?(e)=>toggleSel(e,s.id):undefined}>
                      {canEditRows&&<td style={{padding:"8px 10px"}}>
                        <div onClick={e=>toggleSel(e,s.id)} style={{width:16,height:16,border:`1px solid ${selected.has(s.id)?C.success:C.muted}`,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",background:selected.has(s.id)?C.success:C.bg,color:"#fff",fontSize:11,cursor:"pointer"}}>
                          {selected.has(s.id)&&"✔"}
                        </div>
                      </td>}
                      <td style={{padding:"8px 10px",color:C.text,fontWeight:600}}>{s.shift_date}</td>
                      <td style={{padding:"8px 10px"}}>
                        <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:s.shift==="Night Shift"?C.blue+"33":C.accent+"33",color:s.shift==="Night Shift"?C.blue:C.accent,fontWeight:700}}>
                          {s.shift==="Night Shift"?"🌙 Night":"☀ Day"}
                        </span>
                      </td>
                      <td style={{padding:"8px 10px",color:(opsById.get(s.id)||[]).length?C.success:C.muted,fontWeight:600,maxWidth:200}}>{(opsById.get(s.id)||[]).join(", ")||"—"}</td>
                      <td style={{padding:"8px 10px",color:C.accent,fontWeight:700,textAlign:"right"}}>{Math.round(s.total_meters||0).toLocaleString()} m</td>
                      <td style={{padding:"8px 10px",color:C.text,textAlign:"right"}}>{parseFloat(s.avg_speed||0).toFixed(1)} m/min</td>
                      <td style={{padding:"8px 10px",color:s.downtime_mins>60?C.danger:C.warn,textAlign:"right"}}>{s.downtime_mins||0} min</td>
                      <td style={{padding:"8px 10px",color:C.muted,textAlign:"right"}}>{s.stop_count||0}</td>
                      <td style={{padding:"8px 10px",color:c.scheduled?C.text:C.muted,textAlign:"right"}}>{c.scheduled?fmtMins(c.mins):"—"}</td>
                      <td style={{padding:"8px 10px",color:C.blue,textAlign:"right"}}>{c.scheduled?avail.toLocaleString()+" m":"—"}</td>
                      <td style={{padding:"8px 10px",minWidth:100}}>
                        {oee===null
                          ?<div style={{textAlign:"right"}}><span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:C.muted+"22",color:C.muted,fontWeight:700}}>Unscheduled</span></div>
                          :<div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"flex-end"}}>
                            <div style={{width:60,height:8,background:C.border,borderRadius:4,overflow:"hidden"}}>
                              <div style={{width:`${Math.min(oee,100)}%`,height:"100%",background:effColor(oee),borderRadius:4}} />
                            </div>
                            <span style={{color:effColor(oee),fontWeight:800,fontSize:12,minWidth:40,textAlign:"right"}}>{oee}%</span>
                          </div>}
                      </td>
                    </tr>
                    );
                  })}
                </tbody>
                {filtered.length>1&&<tfoot>
                  <tr style={{borderTop:`2px solid ${C.border}`,background:C.bg}}>
                    <td colSpan={canEditRows?4:3} style={{padding:"8px 10px",color:C.muted,fontWeight:700}}>TOTALS</td>
                    <td style={{padding:"8px 10px",color:C.accent,fontWeight:700,textAlign:"right"}}>{Math.round(totalMeters).toLocaleString()} m</td>
                    <td style={{padding:"8px 10px",color:C.text,textAlign:"right"}}>{avgSpeedAll.toFixed(1)} m/min</td>
                    <td style={{padding:"8px 10px",color:C.danger,textAlign:"right"}}>{totalDowntime} min</td>
                    <td style={{padding:"8px 10px",color:C.muted,textAlign:"right"}}>{totalStops}</td>
                    <td style={{padding:"8px 10px",color:C.text,textAlign:"right"}}>{scheduledMins>0?fmtMins(scheduledMins):"—"}</td>
                    <td style={{padding:"8px 10px",color:C.blue,textAlign:"right"}}>{totalAvailable.toLocaleString()} m</td>
                    <td style={{padding:"8px 10px"}}><span style={{color:effColor(overallOEE),fontWeight:800,fontSize:13}}>{overallOEE}%</span></td>
                  </tr>
                </tfoot>}
              </table>
              {unscheduledCount>0&&<div style={{fontSize:10,color:C.muted,marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
                {unscheduledCount} shift{unscheduledCount>1?"s":""} in this list {unscheduledCount>1?"fall":"falls"} on a day that isn't a working day in Lists / Settings → Shift Times. {unscheduledCount>1?"They're":"It's"} shown as Unscheduled and left out of the OEE figures.
              </div>}
            </div>
        }
      </div>;
    }

    // ── Debug Panel ───────────────────────────────────────────────────────────
    function DebugPanel({records,users,session}){
      const [copied,setCopied]=useState(false);
      const buildReport=()=>{
        const lines=[];
        lines.push("=== CONCORD TRACEABILITY — DEBUG REPORT ===");
        lines.push(`Generated: ${new Date().toLocaleString()}`);
        lines.push(`Logged in as: ${session.name} (${session.role})`);
        lines.push(`Supabase URL: ${SUPABASE_URL}`);
        lines.push("");
        lines.push(`--- USERS (${users.length} total) ---`);
        users.forEach(u=>lines.push(`  [${u.role}] ${u.name} — username: ${u.username}`));
        lines.push("");
        lines.push(`--- RECORDS (${records.length} total) ---`);
        const types={};
        records.forEach(r=>{ types[r.type]=(types[r.type]||0)+1; });
        Object.entries(types).forEach(([t,c])=>lines.push(`  ${t}: ${c}`));
        lines.push("");
        lines.push("--- LAST 5 RECORDS ---");
        records.slice(0,5).forEach((r,i)=>{ lines.push(`\n[${i+1}] ${r.title}`); lines.push(`  Type: ${r.type}`); lines.push(`  Completed by: ${r.created_by}`); lines.push(`  Created at: ${r.created_at}`); });
        lines.push("\n=== END OF REPORT ===");
        return lines.join("\n");
      };
      const report=buildReport();
      const copy=()=>{ navigator.clipboard.writeText(report).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2500); }); };
      return <div>
        <PH title="Debug / AI Help" sub="Copy this report and paste it into Claude or any AI to get help" />
        <div style={{...S.card,marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em",marginBottom:12}}>HOW TO USE</div>
          <div style={{fontSize:13,color:C.text,lineHeight:2}}>1. Click <span style={{color:C.accent,fontWeight:700}}>Copy Report</span> below<br />2. Open a new chat at <span style={{color:C.accent}}>claude.ai</span><br />3. Paste the report and describe your problem</div>
        </div>
        <div style={S.card}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"0.1em"}}>REPORT PREVIEW</div>
            <button style={{...S.btn(copied?"ghost":"accent"),background:copied?C.success:C.accent,color:"#fff",padding:"6px 18px",fontSize:12}} onClick={copy}>{copied?"✔ Copied!":"Copy Report"}</button>
          </div>
          <pre style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,padding:16,fontSize:11,color:C.muted,overflowX:"auto",maxHeight:480,overflowY:"auto",lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{report}</pre>
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <!-- PWA Install Prompt -->
  <div id="pwa-banner" style="display:none;position:fixed;bottom:24px;right:24px;z-index:99999;background:#161b22;border:1px solid #f0a500;borderRadius:10px;padding:16px 20px;boxShadow:0 4px 24px rgba(0,0,0,0.5);fontFamily:'IBM Plex Mono',monospace;maxWidth:320px;">
    <div style="font-size:13px;font-weight:700;color:#f0a500;margin-bottom:6px;">📦 Install CPK Traceability</div>
    <div style="font-size:11px;color:#8b949e;margin-bottom:14px;">Install this app on your desktop for quick access — no URL needed.</div>
    <div style="display:flex;gap:8px;">
      <button id="pwa-install" style="flex:1;background:#f0a500;color:#0d1117;border:none;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Install App</button>
      <button id="pwa-dismiss" style="background:transparent;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;">Later</button>
    </div>
  </div>

  <script>
    // PWA Install prompt
    let deferredPrompt = null;
    const banner = document.getElementById('pwa-banner');
    const installBtn = document.getElementById('pwa-install');
    const dismissBtn = document.getElementById('pwa-dismiss');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Show banner after 3 seconds if not already installed
      if(!localStorage.getItem('pwa-dismissed')){
        setTimeout(() => { banner.style.display = 'block'; }, 3000);
      }
    });

    installBtn && installBtn.addEventListener('click', async () => {
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if(outcome === 'accepted') banner.style.display = 'none';
      deferredPrompt = null;
    });

    dismissBtn && dismissBtn.addEventListener('click', () => {
      banner.style.display = 'none';
      localStorage.setItem('pwa-dismissed', '1');
    });

    // Hide banner if already installed
    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
      deferredPrompt = null;
    });

    // Service Worker for offline capability
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        // Inline service worker as blob
        const swCode = `
          const CACHE = 'cpk-trace-v1';
          const URLS = [self.location.pathname];
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS)));
            self.skipWaiting();
          });
          self.addEventListener('activate', e => {
            e.waitUntil(caches.keys().then(keys =>
              Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
            ));
            self.clients.claim();
          });
          self.addEventListener('fetch', e => {
            if(e.request.url.includes('supabase.co') || e.request.url.includes('cdn.')) return;
            e.respondWith(
              fetch(e.request).then(r => {
                const clone = r.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
                return r;
              }).catch(() => caches.match(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }
  </script>
